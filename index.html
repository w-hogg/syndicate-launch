        else if (k === 'arrowright' || k === 'd') { e.preventDefault(); this.decide(2); }
        else if (k === 'r') this.revealNext();
        else if (k === 'p') this.openBoard(this.nextEventIdx(), false);
        else if (['1', '2', '3'].includes(k)) this.useFavour(['lunch', 'reins', 'poach'][+k - 1]);
      };
      addEventListener('keydown', this.onKey);
      return root;
    },
    mounted() {
      this.renderDerby();
      if (G.book.length) G.book.forEach((b) => this.addBinder(b));
      Sound.murmur(true);
      this.onMonth();
      this.updateRace();
      this.tick(G.no + ' ' + G.name + ' is open for business. ' + G.market.modifier.text + '.');
      if (G.delayMonths) toast('Late start', 'Your first brokers arrive in February.', 'var(--warn)');
    },
    exit() { removeEventListener('keydown', this.onKey); Sound.murmur(false); },

    // ---- calendar, months, events ----
    nextEventIdx() {
      const evs = G.market.events;
      for (let i = 0; i < evs.length; i++) if (evs[i].month >= this.month && !evs[i].done) return i;
      return null;
    },
    paintCal() {
      this.root.querySelectorAll('#cal div').forEach((d) => {
        const m = +d.dataset.m;
        d.classList.toggle('done', m < this.month);
        d.classList.toggle('now', m === this.month);
        d.querySelector('i').style.width = m < this.month ? '100%' : m === this.month ? Math.min(100, (this.mt / MONTH_LEN) * 100) + '%' : '0';
      });
    },
    onMonth() {
      this.paintCal();
      const evs = G.market.events;
      evs.forEach((e, i) => {
        if (e.month === this.month + 1 || (this.month === 0 && e.month === 0)) {
          if (e.forecasted) return;
          e.forecasted = true;
          const tiles = e.candidates.map((t) => E.TILES[t].name).join(' or ');
          toast('Forecast: ' + e.kind, e.forecast + ' Threatens ' + tiles + '.', 'var(--bad)', 5);
          this.tick('FORECAST · ' + e.forecast.toUpperCase());
          const c = this.root.querySelector('#cal div[data-m="' + e.month + '"]'); if (c) c.classList.add('ev');
          this.root.querySelector('#perilBtn').classList.add('hot');
        }
      });
      evs.forEach((e, i) => { if (e.month === this.month && !e.done) this.openBoard(i, true); });
      if (this.month === 3 || this.month === 8) this.triggerAlert();
      G.book.forEach((b) => this.paintBinder(b));
    },

    // ---- the race ----
    renderDerby() {
      const lanes = [
        ['you', 'You · ' + G.no],
        ['nemesis', E.RIVALS[G.nemesis].name],
        ['rival2', E.RIVALS[G.rival2].name]
      ];
      if (G.ghost) lanes.push(['ghost', G.ghost.label]);
      this.root.querySelector('#derby').innerHTML = lanes.map(([k, name]) => '<button class="lane ' + k + '" data-lane="' + k + '" style="--lc:' + LANE_COLORS[k] + '"><span class="ln">' + esc(name) + '</span><span class="track"><span class="zero"></span><span class="runner">' + (k === 'you' ? 'U' : k === 'ghost' ? '' : name[0]) + '</span></span><span class="lv num">£0.0m</span></button>').join('');
      this.root.querySelectorAll('.lane').forEach((ln) => ln.addEventListener('click', () => {
        const k = ln.dataset.lane;
        if (k === 'nemesis' || k === 'rival2') this.trash(k);
      }));
    },
    trash(k) {
      const id = k === 'nemesis' ? G.nemesis : G.rival2;
      const rv = E.RIVALS[id];
      const line = pick(rv.talk);
      const lane = this.root.querySelector('.lane.' + k);
      lane.querySelectorAll('.talk').forEach((t) => t.remove());
      const b = el('<span class="talk"><span class="bubble">' + esc(line) + '</span></span>');
      lane.appendChild(b);
      setTimeout(() => b.remove(), 3500);
      this.tick(rv.name.toUpperCase() + ': “' + line + '”');
    },
    curveAt(curve) {
      if (!curve || !curve.length) return 0;
      if (this.month >= 12) return curve[11];
      const f = Math.min(1, this.mt / MONTH_LEN);
      const prev = this.month > 0 ? curve[this.month - 1] : 0;
      return lerp(prev, curve[this.month], f);
    },
    updateRace() {
      const res = E.scoreRun(G.book, scoreOpts());
      this.live = res;
      const vals = { you: this.curveAt(res.curve), nemesis: this.curveAt(G.rivalRuns[G.nemesis].curve), rival2: this.curveAt(G.rivalRuns[G.rival2].curve) };
      if (G.ghost) vals.ghost = this.curveAt(G.ghost.curve);
      const all = Object.values(vals);
      const lo = Math.min(-12, ...all) - 3, hi = Math.max(12, ...all) + 3;
      const pos = (v) => ((v - lo) / (hi - lo)) * 100;
      for (const k in vals) {
        const ln = this.root.querySelector('.lane.' + k); if (!ln) continue;
        ln.querySelector('.runner').style.left = pos(vals[k]) + '%';
        ln.querySelector('.zero').style.left = pos(0) + '%';
        ln.querySelector('.lv').textContent = fmtM(vals[k], true);
      }
      // HUD
      const m = Math.min(11, this.month);
      const f = this.month >= 12 ? 1 : Math.min(1, this.mt / MONTH_LEN);
      const uwNow = lerp(m > 0 ? res.uwCurve[m - 1] : 0, res.uwCurve[m], f);
      const capNow = res.fal + uwNow, scale = G.eca * 1.6;
      this.root.querySelector('#hCap').textContent = '£' + capNow.toFixed(0) + 'm';
      const cb = this.root.querySelector('#hCapBar');
      cb.style.width = Math.max(0, Math.min(100, (capNow / scale) * 100)) + '%';
      cb.style.background = capNow < G.eca * E.SOLVENCY_LINE ? 'var(--bad)' : capNow < G.eca ? 'var(--warn)' : 'var(--good)';
      this.root.querySelector('#hCapLine').style.left = ((G.eca * E.SOLVENCY_LINE) / scale) * 100 + '%';
      const bt = boundTot();
      this.root.querySelector('#hGwp').textContent = '£' + bt.toFixed(0) + '/' + G.capacity.toFixed(0) + 'm';
      this.root.querySelector('#hGwpBar').style.width = Math.min(100, (bt / (G.capacity * 1.3)) * 100) + '%';
      this.root.querySelector('#hGwpLine').style.left = (1 / 1.3) * 100 + '%';
      const w = E.weights(G.split);
      this.root.querySelector('#hPlan').innerHTML = Object.keys(w).map((k) => '<span style="width:' + w[k] * 100 + '%;background:' + clsColor(k) + '"></span>').join('');
      const bound = {}; G.book.forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
      this.root.querySelector('#hBound').innerHTML = bt ? Object.keys(bound).map((k) => '<span style="width:' + (bound[k] / bt) * 100 + '%;background:' + clsColor(k) + '"></span>').join('') : '';
      this.root.querySelector('#hDrift').textContent = bt ? Math.round(this.drift()) + ' pts off' : 'on plan';
      // peril heat
      const expo = this.exposure();
      const maxT = Math.max(0, ...Object.values(expo).map((x) => x.P));
      this.root.querySelector('#perilBtn').style.setProperty('--heat', Math.min(1, maxT / 30).toFixed(2));
      return vals;
    },
    drift() {
      const bt = boundTot(); if (!bt) return 0;
      const w = E.weights(G.split), bound = {};
      G.book.forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
      let d = 0; const keys = new Set([...Object.keys(w), ...Object.keys(bound)]);
      for (const k of keys) d += Math.abs((bound[k] || 0) / bt - (w[k] || 0));
      return d * 50;
    },
    exposure(atMonth) {
      const out = {};
      for (const t in E.TILES) out[t] = { P: 0, cls: [] };
      const mo = atMonth == null ? this.month : atMonth;
      for (const b of G.book) {
        if (b.month > mo) continue;
        if (b.alert === 'exit' && b.alertMonth <= mo) continue;
        out[b.deal.tile].P += b.P; out[b.deal.tile].cls.push(b.deal.cls);
      }
      return out;
    },

    // ---- ticker ----
    tick(msg) {
      this.tickQ.push(msg);
      if (this.tickQ.length > 4) this.tickQ.splice(0, this.tickQ.length - 4);
      if (!this.tickBusy) this.runTicker();
    },
    runTicker() {
      const box = this.root && this.root.querySelector('#ticker');
      if (!box || !this.tickQ.length) { this.tickBusy = false; return; }
      this.tickBusy = true;
      const s = el('<span>' + esc(this.tickQ.shift()) + '</span>');
      box.innerHTML = ''; box.appendChild(s);
      const w = box.clientWidth, sw = s.offsetWidth;
      const dur = ((w + sw) / 90) * 1000;
      const a = s.animate([{ transform: 'translateX(' + w + 'px)' }, { transform: 'translateX(' + -sw + 'px)' }], { duration: REDUCED ? 4000 : dur, easing: 'linear' });
      a.onfinish = () => this.runTicker();
    },

    // ---- deals ----
    present() {
      if (G.deckIdx >= G.deck.length) return;
      const d0 = G.deck[G.deckIdx++];
      const d = Object.assign({}, d0, { tells: Object.assign({}, d0.tells) });
      if (G.hotLeft > 0) { d.q = Math.max(0.6, d.q * 0.9); d.base = E.round1(d.base * 1.15); G.hotLeft--; d.hot = true; }
      const b = E.BROKERS[d.broker];
      const room = G.capacity * 1.3 - boundTot();
      let blocked = null;
      if (d.structure === 'binder' && this.month < G.atlasUntil) blocked = 'Coverholder not yet approved in ATLAS. Decline only.';
      else if (room < 0.5) blocked = 'Stamp capacity full. Decline only.';
      this.cur = { d, patience: 1, total: 9 * b.patience * (G.au === 'veteran' ? 1.4 : 1), revealed: [false, false, false], shownAt: this.t, lunch: false, blocked, busy: false };
      const row = this.root.querySelector('#brokerRow');
      row.innerHTML = '<div class="face">' + face(d.broker) + '</div><div class="who"><span class="bname">' + esc(b.name) + '<small>' + esc(b.firm) + '</small></span><div class="bubble">' + esc(E.brokerLine(d)) + '</div><div class="patience"><i id="pat"></i></div></div>';
      this.renderSlip();
      this.root.querySelectorAll('.actions [data-line]').forEach((btn) => { btn.disabled = !!blocked && btn.dataset.line !== '0'; });
      Sound.tick();
      if (AUTO) setTimeout(() => {
        if (this.cur && this.cur.d === d && !this.cur.busy) {
          const pol = E.POLICIES[AUTO] || E.POLICIES.skilled;
          const line = pol(d, { au: G.au, r: Math.random, boundTot: boundTot(), capacity: G.capacity });
          this.decide(blocked ? 0 : line);
        }
      }, 700 / SPEED);
    },
    tellHTML(i) {
      const d = this.cur.d, c = E.CLASSES[d.cls], open = this.cur.revealed[i];
      const names = ['Loss history', 'Rate change', 'Growth'];
      if (!open) return '<button class="tell" data-t="' + i + '">' + names[i] + '<span class="redact"></span></button>';
      let v, cls = '';
      if (i === 0) { v = d.tells.hist; cls = v === 'Clean' ? 'good' : v === 'Ugly' ? 'bad' : ''; }
      if (i === 1) { v = (d.tells.rate > 0 ? '+' : '') + d.tells.rate + '%'; const ref = c.rate * 0.5; cls = d.tells.rate > ref + 3 ? 'good' : d.tells.rate < ref - 3 ? 'bad' : ''; }
      if (i === 2) { v = '+' + d.tells.growth + '%'; cls = d.tells.growth > 40 ? 'bad' : d.tells.growth < 15 ? 'good' : ''; }
      return '<button class="tell ' + cls + '" data-t="' + i + '" disabled>' + names[i] + '<b>' + v + '</b></button>';
    },
    insightHTML() {
      const c = this.cur, d = c.d;
      if (c.lunch) return '<div class="insight" style="--c:' + (d.q < 0.95 ? 'var(--good)' : d.q < 1.05 ? 'var(--warn)' : 'var(--bad)') + '"><span class="pip"></span>Over a long lunch: this book is ' + qualityWord(d.q) + '. Price adequacy ' + Math.round(100 / d.q) + '%.</div>';
      if (G.au === 'quant') return '<div class="insight" style="--c:' + (d.adequacy >= 103 ? 'var(--good)' : d.adequacy <= 95 ? 'var(--bad)' : 'var(--warn)') + '"><span class="pip"></span>The Quant: price adequacy ' + d.adequacy + '%</div>';
      if (G.au === 'forensic') return '<div class="insight" style="--c:' + ({ A: 'var(--good)', B: 'var(--good)', C: 'var(--warn)', D: 'var(--bad)' })[d.grade] + '"><span class="pip"></span>The Forensic: audit grade ' + d.grade + '</div>';
      if (G.au === 'veteran') {
        const t = { good: ['var(--good)', 'Gut feel: the broker isn’t bluffing.'], meh: ['var(--warn)', 'Gut feel: nothing either way.'], bad: ['var(--bad)', 'Gut feel: you’ve seen this one before. It ended badly.'] }[d.gut];
        return '<div class="insight" style="--c:' + t[0] + '"><span class="pip"></span>' + t[1] + '</div>';
      }
      return '<div class="insight"><span class="pip"></span>The Rainmaker: “I know their cousin. Lovely family.”</div>';
    },
    renderSlip() {
      const c = this.cur, d = c.d, cl = E.CLASSES[d.cls], tile = E.TILES[d.tile];
      const area = this.root.querySelector('#slotArea');
      const struct = { QS: 'Quota share', treaty: 'Treaty', binder: 'Binder', consortium: 'Consortium', lineslip: 'Lineslip', facility: 'Facility' }[d.structure] || d.structure;
      area.innerHTML = '<div class="slip" id="slip"><div class="holes"><i></i><i></i><i></i><i></i></div>' +
        '<div class="sh"><span>' + esc(struct) + ' · slip ' + (G.deckIdx) + '</span><span>' + MONTHS[Math.min(11, this.month)] + ' ' + (parseInt(SEASON, 10) + 1) + '</span></div>' +
        '<h3>' + esc(d.label) + '</h3>' +
        '<div class="clsrow"><span class="tag" style="--c:' + clsColor(d.cls) + '"><i></i>' + esc(cl.name) + '</span><span class="tag">' + icon(tile.icon) + esc(tile.name) + '</span>' + (d.off ? '<span class="tag off">Off plan</span>' : '') + (d.hot ? '<span class="tag">Hot box</span>' : '') + '</div>' +
        '<div class="terms"><div><span>Small line</span><b class="num">£' + d.base.toFixed(1) + 'm</b></div><div><span>Big line</span><b class="num">£' + (d.base * 2).toFixed(1) + 'm</b></div>' +
        '<div><span>Commission</span><b class="num">' + Math.round(d.comm * 100) + '%</b></div><div><span>Market rates</span><b class="num">' + (cl.rate > 0 ? '+' : '') + cl.rate + '%</b></div></div>' +
        '<div class="smallprint"><span class="lbl">Small print · tap to read (costs patience)</span><div class="tells">' + [0, 1, 2].map((i) => this.tellHTML(i)).join('') + '</div></div>' +
        '<div id="ins">' + this.insightHTML() + '</div>' +
        (c.blocked ? '<div class="insight" style="--c:var(--bad);margin-top:6px"><span class="pip"></span>' + esc(c.blocked) + '</div>' : '') +
        '<div class="stamp ghoststamp" id="gs"></div></div>';
      const slip = area.querySelector('#slip');
      slip.querySelectorAll('.tell').forEach((t) => t.addEventListener('click', (e) => { e.stopPropagation(); this.reveal(+t.dataset.t); }));
      const gs = slip.querySelector('#gs');
      const dir = (dx, dy) => (Math.abs(dy) > Math.abs(dx) && dy > 0 ? 1 : dx > 0 ? 2 : 0);
      draggable(slip, {
        enabled: () => this.cur && !this.cur.busy,
        onStart: () => slip.classList.add('dragging'),
        onMove: (dx, dy) => {
          slip.style.transform = 'translate(' + dx + 'px,' + Math.max(-40, dy) + 'px) rotate(' + dx / 18 + 'deg)';
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          gs.textContent = ['Decline', 'Small line', 'Big line'][k];
          gs.style.borderColor = gs.style.color = k === 0 ? 'var(--stamp)' : k === 1 ? '#1b2a6b' : '#1d7a4c';
          gs.style.opacity = Math.min(0.95, dist / 110);
        },
        onEnd: (dx, dy, vx, vy, e, cancelled) => {
          slip.classList.remove('dragging');
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          if (!cancelled && (dist > 95 || (k === 2 && vx > 900) || (k === 0 && vx < -900) || (k === 1 && vy > 900)) && !(k > 0 && this.cur.blocked)) { gs.style.opacity = 0; this.decide(k); }
          else {
            if (k > 0 && this.cur && this.cur.blocked) toast('Can’t bind this one', this.cur.blocked, 'var(--bad)');
            slip.classList.add('back'); slip.style.transform = ''; gs.style.opacity = 0;
            setTimeout(() => slip.classList.remove('back'), 320);
          }
        }
      });
    },
    reveal(i) {
      const c = this.cur; if (!c || c.busy || c.revealed[i]) return;
      c.revealed[i] = true; c.patience = Math.max(0.04, c.patience - 0.15);
      Sound.tick();
      const t = this.root.querySelector('.tell[data-t="' + i + '"]');
      if (t) { const n = el(this.tellHTML(i)); t.replaceWith(n); }
    },
    revealNext() { if (!this.cur) return; const i = this.cur.revealed.indexOf(false); if (i >= 0) this.reveal(i); },
    decide(line) {
      const c = this.cur; if (!c || c.busy) return;
      if (line > 0 && c.blocked) { toast('Can’t bind this one', c.blocked, 'var(--bad)'); return; }
      c.busy = true;
      const d = c.d;
      G.decisionTimes.push(this.t - c.shownAt);
      const slip = this.root.querySelector('#slip');
      if (line === 0) {
        Sound.crumple();
        if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(-120px,140px) scale(.15) rotate(-260deg)', opacity: 0 }], { duration: 480, easing: 'ease-in', fill: 'forwards' });
        if (rand() < 0.5) { G.walked.push({ d, to: G.nemesis }); this.tick(E.RIVALS[G.nemesis].name + ' scratched the ' + d.label.toLowerCase() + ' you declined.'); }
      } else {
        const room = G.capacity * 1.3 - boundTot();
        const P = E.round1(Math.max(0.5, Math.min(d.base * line, room)));
        const entry = { deal: d, P, month: this.month, line };
        G.book.push(entry);
        if (d.q < 0.95) G.streak++; else G.streak = 0;
        if (G.streak >= 3) {
          G.streak = 0; G.hotLeft = 2;
          toast('Hot box!', 'Three good binds in a row. Better brokers are queueing.', 'var(--brass)');
          const box = this.root.querySelector('#box'); box.classList.add('hotbox'); setTimeout(() => box.classList.remove('hotbox'), 15000 / SPEED);
        }
        if (slip) {
          slamStamp(slip, 'Scratched<small>Synd ' + G.no + ' · ' + (line === 2 ? '20' : '10') + '% line · £' + P.toFixed(1) + 'm</small>', { pos: 'right:6%;top:34%', rot: -8, shake: false, blue: line === 1 });
          Sound.kaching();
          const [x, y] = centre(slip); FX.burst(x, y, 'coins', line === 2 ? 26 : 14);
          setTimeout(() => {
            const shelf = this.root.querySelector('#shelf'); if (!shelf || !slip.isConnected) return;
            const [sx, sy] = centre(shelf);
            slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(' + (sx - x) + 'px,' + (sy - y) + 'px) scale(.08)', opacity: 0.3 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
          }, 380 / SPEED);
        }
        this.addBinder(entry);
        this.checkPmd();
        toast('+£' + P.toFixed(1) + 'm premium', d.label, clsColor(d.cls), 1.6);
      }
      setTimeout(() => this.clearDeal(), 800 / SPEED);
      this.nextAt = Math.max(this.t + 1.0, this.start0 + G.deckIdx * this.spacing);
      this.updateRace();
    },
    walk() {
      const c = this.cur; if (!c || c.busy) return;
      c.busy = true;
      G.walked.push({ d: c.d, to: G.nemesis });
      const b = this.root.querySelector('#brokerRow .bubble'); if (b) b.textContent = 'Fine. I’ll take it to ' + E.RIVALS[G.nemesis].name + '.';
      const slip = this.root.querySelector('#slip');
      if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(140%) rotate(12deg)', opacity: 0 }], { duration: 520, easing: 'ease-in', fill: 'forwards' });
      Sound.whoosh();
      G.decisionTimes.push(c.total);
      this.tick(E.RIVALS[G.nemesis].name + ' picked up the ' + c.d.label.toLowerCase() + '. You took too long.');
      setTimeout(() => this.clearDeal(), 900 / SPEED);
      this.nextAt = Math.max(this.t + 1.2, this.start0 + G.deckIdx * this.spacing);
    },
    clearDeal() {
      this.cur = null;
      if (!this.root) return;
      this.root.querySelector('#brokerRow').innerHTML = '';
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">' + (G.deckIdx >= G.deck.length ? 'The brokers have gone to lunch. For the rest of the year.' : 'Next broker approaching…') + '</p>';
    },
    checkPmd() {
      const bt = boundTot();
      if (!G.pmdFlags.gwp && bt > G.capacity * 1.2) { G.pmdFlags.gwp = true; this.pmdLetter('your gross written premium is running at ' + pct(bt / G.capacity) + ' of plan.'); }
      if (!G.pmdFlags.drift && bt >= G.capacity * 0.4 && this.drift() > 25) { G.pmdFlags.drift = true; this.pmdLetter('your business mix has drifted ' + Math.round(this.drift()) + ' points from your SBF.'); }
    },
    pmdLetter(text) {
      G.pmd++; G.pmdNotes.push(text);
      const l = el('<div class="letter" role="status"><h4>Lloyd’s Performance Management</h4>Dear Active Underwriter,<br>We note that ' + esc(text) + ' Please explain.<br><b>−1,000 points</b></div>');
      this.root.querySelector('#box').appendChild(l);
      Sound.thud();
      setTimeout(() => l.remove(), 5500 / Math.min(SPEED, 2));
    },

    // ---- the book shelf ----
    addBinder(entry) {
      const shelf = this.root.querySelector('#shelf');
      const empty = shelf.querySelector('.empty'); if (empty) empty.remove();
      const w = Math.max(14, Math.min(44, entry.P * 2.6));
      const n = el('<button class="binder" style="--c:' + clsColor(entry.deal.cls) + ';--w:' + w + 'px" aria-label="' + esc(entry.deal.label) + '"><span class="lbl">' + esc(E.CLASSES[entry.deal.cls].short) + '</span><span class="st"></span></button>');
      entry.node = n;
      n.addEventListener('click', (e) => { e.stopPropagation(); this.binderInfo(entry); });
      shelf.appendChild(n);
      shelf.scrollLeft = shelf.scrollWidth;
      this.paintBinder(entry);
    },
    paintBinder(entry) {
      const n = entry.node; if (!n) return;
      const st = n.querySelector('.st');
      st.className = 'st';
      if (this.month - entry.month >= 2 || entry.alert) {
        const lr = E.dealLR(entry.deal, G.market) * (entry.alert === 'ignore' ? 1.35 : 1);
        const r = lr / E.CLASSES[entry.deal.cls].lr;
        st.classList.add(r < 0.93 ? 'good' : r < 1.08 ? 'warn' : 'bad');
      }
      n.classList.toggle('scorched', !!entry.catHit);
      n.classList.toggle('exited', entry.alert === 'exit');
    },
    binderInfo(entry) {
      this.root.querySelectorAll('.popover').forEach((p) => p.remove());
      const d = entry.deal;
      const pending = entry.alertPending;
      const p = el('<div class="popover" role="dialog"><h4>' + esc(d.label) + '</h4><div>' + esc(E.CLASSES[d.cls].name) + ' · ' + esc(E.TILES[d.tile].name) + '<br>£' + entry.P.toFixed(1) + 'm bound in ' + MONTHS[entry.month] + (entry.catHit ? ' · hit by a catastrophe' : '') + (entry.alert ? ' · ' + ({ audit: 'audited', exit: 'exited', ignore: 'alert ignored' })[entry.alert] : '') + '</div>' +
        (pending ? '<div><b>' + esc(entry.alertMsg) + '</b></div><div class="row"><button class="btn primary" data-a="audit">Audit' + (G.au === 'forensic' ? ' (free)' : ' (£0.3m)') + '</button><button class="btn danger" data-a="exit">Exit the book</button></div>' : '<div class="row"><button class="btn ghost" data-a="close">Close</button></div>') + '</div>');
      const box = this.root.querySelector('.side');
      box.style.position = 'relative';
      p.style.left = '0'; p.style.bottom = '100%';
      box.appendChild(p);
      p.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => {
        const a = b.dataset.a; p.remove();
        if (a !== 'close') this.resolveAlert(entry, a);
      }));
      setTimeout(() => { const off = (e) => { if (!p.contains(e.target)) { p.remove(); removeEventListener('pointerdown', off, true); } }; addEventListener('pointerdown', off, true); }, 0);
    },
    triggerAlert() {
      const cands = G.book.filter((b) => b.month < this.month && !b.alert && !b.alertPending && !b.catHit);
      if (!cands.length) return;
      const worst = cands.reduce((a, b) => (b.deal.q > a.deal.q ? b : a));
      worst.alertPending = true; worst.alertAt = this.t;
      worst.alertMsg = pick(['Bordereaux are three months late.', 'The book grew 60% overnight.', 'Claims notifications have doubled.', 'The coverholder has changed its name. Again.']);
      G.alerts.push(worst);
      if (worst.node) { worst.node.classList.add('smoking'); worst.node.appendChild(el('<span class="smoke"></span>')); }
      toast('Portfolio alert', worst.deal.label + ': ' + worst.alertMsg + (G.au === 'forensic' ? ' The Forensic says audit it (free).' : ' Tap the smoking binder.'), 'var(--bad)', 5);
      this.alerting = worst;
      if (AUTO) setTimeout(() => this.resolveAlert(worst, worst.deal.q > 1.25 ? 'exit' : 'audit'), 600 / SPEED);
    },
    resolveAlert(entry, choice) {
      if (!entry.alertPending) return;
      entry.alertPending = false; entry.alert = choice; entry.alertMonth = this.month;
      if (entry.node) { entry.node.classList.remove('smoking'); entry.node.querySelectorAll('.smoke').forEach((s) => s.remove()); }
      if (this.alerting === entry) this.alerting = null;
      if (choice === 'audit') { toast('Audited', 'The coverholder has been reminded what a bordereau is.', 'var(--good)'); Sound.blip(true); }
      if (choice === 'exit') { toast('Book exited', 'You hand back the unearned premium and walk away.', 'var(--warn)'); Sound.crumple(); }
      if (choice === 'ignore') { toast('Alert ignored', entry.deal.label + ' is getting worse.', 'var(--bad)'); }
      this.paintBinder(entry);
    },

    // ---- favours ----
    wireFavour(n) {
      const k = n.dataset.f;
      draggable(n, {
        enabled: () => G.favours[k],
        onStart: () => n.classList.add('dragging'),
        onMove: (dx, dy) => { n.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 25 + 'deg)'; },
        onEnd: (dx, dy, vx, vy, e) => {
          n.classList.remove('dragging'); n.style.transform = '';
          if (dropTarget(e.clientX, e.clientY, FAVOURS[k][2], n)) this.useFavour(k);
        },
        onTap: () => this.useFavour(k)
      });
    },
    useFavour(k) {
      if (!G.favours[k] || this.ended) return;
      if (k === 'lunch') {
        if (!this.cur || this.cur.busy) { toast('No slip on the table', 'Save the lunch for a broker.', 'var(--warn)'); return; }
        this.cur.lunch = true;
        const ins = this.root.querySelector('#ins'); if (ins) ins.innerHTML = this.insightHTML();
        toast('Long Lunch', 'Three courses later, the truth comes out.', 'var(--brass)');
      }
      if (k === 'reins') {
        G.armedReins = true;
        toast('Reinsurance Call armed', 'The next catastrophe hit is halved.', 'var(--brass)');
      }
      if (k === 'poach') {
        const w = [...G.walked].reverse().find((x) => x.to === G.nemesis && !x.poached);
        if (!w) { toast('Nothing to poach yet', E.RIVALS[G.nemesis].name + ' hasn’t taken anything of yours.', 'var(--warn)'); return; }
        w.poached = true;
        const room = G.capacity * 1.3 - boundTot();
        if (room < 0.5) { toast('No room', 'Your stamp capacity is full.', 'var(--warn)'); return; }
        const entry = { deal: w.d, P: E.round1(Math.min(w.d.base, room)), month: this.month, line: 1, poached: true };
        G.book.push(entry); this.addBinder(entry); this.checkPmd();
        this.tick(E.RIVALS[G.nemesis].name.toUpperCase() + ': “That was OURS.”');
        toast('Poached!', w.d.label + ' is now yours.', 'var(--brass)');
      }
      G.favours[k] = false;
      Sound.blip(true);
      const n = this.root.querySelector('.favour[data-f="' + k + '"]'); if (n) n.classList.add('used');
      this.updateRace();
    },

    // ---- the Peril Board and catastrophes ----
    openBoard(idx, live) {
      if (this.overlayOpen || this.ended) return;
      this.overlayOpen = true;
      const e = idx == null ? null : G.market.events[idx];
      const showThreat = e && e.forecasted;
      const expo = this.exposure(e && live ? e.month : null);
      const tiles = Object.keys(E.TILES).map((t) => {
        const x = expo[t];
        const pins = x.cls.slice(0, 12).map((c) => '<i style="--c:' + clsColor(c) + '"></i>').join('');
        return '<button class="tile' + (showThreat && e.candidates.includes(t) ? ' threat' : '') + (e && G.shields[idx] === t ? ' shielded' : '') + '" data-tile="' + t + '">' +
          '<span class="tn">' + esc(E.TILES[t].name) + '</span>' + icon(E.TILES[t].icon, 'ic') + '<span><span class="pins">' + pins + '</span><span class="exp">' + (x.P ? '£' + x.P.toFixed(1) + 'm' : '') + '</span></span></button>';
      }).join('');
      const head = live ? e.name : 'Peril Board';
      const fc = showThreat ? '<div class="forecast">' + icon('storm') + '<div><b>' + esc(e.kind) + '</b> · ' + esc(e.forecast) + ' Threatens ' + e.candidates.map((t) => E.TILES[t].name).join(' or ') + '.</div></div>'
        : '<div class="forecast" style="background:var(--night-2);border-color:var(--girder);color:var(--ink-2)">' + icon('storm') + '<div>No catastrophe forecast yet. Pins show where your bound premium sits.</div></div>';
      const canShield = e && showThreat && !G.shields[idx];
      const body = el('<div><h3>' + esc(head) + '</h3>' + fc + '<div class="board" id="board">' + tiles + '</div>' +
        '<div class="boardfoot">' + (canShield ? '<button class="shieldtok" id="shield">' + icon('shield') + 'Reinsurance shield</button><span class="muted" id="shieldTxt">Drag the shield onto a tile (or tap a tile). It halves the loss there and costs 8% of the premium on that tile.</span>' : '<span class="muted" id="shieldTxt">' + (e && G.shields[idx] ? 'Shield on ' + E.TILES[G.shields[idx]].name + '.' : '') + (G.armedReins ? ' Reinsurance Call armed.' : '') + '</span>') +
        '<span class="lossline" id="lossline"></span>' +
        (live ? '<button class="btn danger" id="brace">Brace! <span class="num" id="bc">6</span></button>' : '<button class="btn" id="closeBoard">Close</button>') + '</div></div>');
      const o = overlay(body);
      this.board = { o, body, idx, live, e, t: 6 };
      const place = (t) => {
        if (!canShield || this.board.landed || G.shields[idx]) return;
        G.shields[idx] = t;
        body.querySelectorAll('.tile').forEach((n) => n.classList.toggle('shielded', n.dataset.tile === t));
        const s = body.querySelector('#shield'); if (s) s.remove();
        body.querySelector('#shieldTxt').textContent = 'Shield on ' + E.TILES[t].name + ' (costs £' + (expo[t].P * E.SHIELD_COST).toFixed(1) + 'm).';
        Sound.blip(true);
      };
      body.querySelectorAll('.tile').forEach((n) => n.addEventListener('click', () => place(n.dataset.tile)));
      const sh = body.querySelector('#shield');
      if (sh) {
        draggable(sh, {
          onStart: () => sh.classList.add('dragging'),
          onMove: (dx, dy, ev) => {
            sh.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
            body.querySelectorAll('.tile').forEach((n) => n.classList.remove('drop'));
            const t = dropTarget(ev.clientX, ev.clientY, '.tile', sh); if (t) t.classList.add('drop');
          },
          onEnd: (dx, dy, vx, vy, ev) => {
            sh.classList.remove('dragging'); sh.style.transform = '';
            body.querySelectorAll('.tile').forEach((n) => n.classList.remove('drop'));
            const t = dropTarget(ev.clientX, ev.clientY, '.tile', sh); if (t) place(t.dataset.tile);
          },
          onTap: () => { const cand = e.candidates.slice().sort((a, b) => expo[b].P - expo[a].P)[0]; place(cand); }
        });
      }
      if (live) {
        Sound.rumble();
        body.querySelector('#brace').addEventListener('click', () => this.landfall());
        if (AUTO) setTimeout(() => { const cand = e.candidates.slice().sort((a, b) => expo[b].P - expo[a].P)[0]; if (expo[cand].P > 0) place(cand); }, 300 / SPEED);
      } else {
        const close = () => { o.remove(); this.overlayOpen = false; this.board = null; };
        body.querySelector('#closeBoard').addEventListener('click', close);
        o.addEventListener('click', (ev) => { if (ev.target === o) close(); });
      }
    },
    landfall() {
      const B = this.board; if (!B || B.landed) return;
      B.landed = true;
      const e = B.e, idx = B.idx;
      e.done = true;
      if (G.armedReins) { G.reinsCall[idx] = true; G.armedReins = false; }
      const brace = B.body.querySelector('#brace'); if (brace) brace.remove();
      const tileNode = B.body.querySelector('.tile[data-tile="' + e.tile + '"]');
      B.body.querySelectorAll('.tile').forEach((n) => n.classList.remove('threat'));
      const [tx, ty] = centre(tileNode);
      FX.storm(tx, ty, 1.8);
      setTimeout(() => {
        flash(); Sound.bell(1); shake(app);
        tileNode.classList.add('hit');
        let total = 0;
        const mult = (G.shields[idx] === e.tile ? 0.5 : 1) * (G.reinsCall[idx] ? 0.5 : 1);
        for (const b of G.book) {
          if (b.month > e.month || b.deal.tile !== e.tile) continue;
          if (b.alert === 'exit' && b.alertMonth <= e.month) continue;
          const loss = b.P * E.CLASSES[b.deal.cls].catMult * e.sev * mult;
          total += loss; b.catHit = true; this.paintBinder(b);
        }
        const net = total * (G.qs ? 1 - E.QS_SHARE : 1);
        G.hitTiles.push(e.tile);
        if (G.shields[idx] === e.tile && total > 0) G.calledIt = true;
        e.loss = net;
        const ll = B.body.querySelector('#lossline');
        ll.textContent = total > 0 ? e.name + ' hits ' + E.TILES[e.tile].name + ': ' + fmtM(-net) : e.name + ' hits ' + E.TILES[e.tile].name + '. You had nothing there.';
        if (total > 0) {
          for (let i = 0; i < Math.min(6, 1 + Math.floor(total / 3)); i++) {
            const f = el('<span style="position:fixed;z-index:85;pointer-events:none;font:900 1.15rem var(--f-display);color:#ffb3a6;left:' + (tx - 30 + rand() * 60) + 'px;top:' + (ty - 10) + 'px">' + fmtM(-net / Math.min(6, 1 + Math.floor(total / 3))) + '</span>');
            document.body.appendChild(f);
            f.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-90px)', opacity: 0 }], { duration: 1300, delay: i * 120, easing: 'ease-out', fill: 'forwards' }).onfinish = () => f.remove();
          }
          this.tick('CATASTROPHE · ' + e.name.toUpperCase() + ' · ' + G.no + ' LOSES ' + fmtM(net).toUpperCase());
        } else this.tick(e.name.toUpperCase() + ' MISSES ' + G.no + '. THE ROOM EXHALES.');
        this.updateRace();
        setTimeout(() => this.solvency(), 2000 / SPEED);
      }, 700 / SPEED);
    },
    solvency() {
      const B = this.board; if (!B) return;
      const e = B.e;
      let pending = null;
      E.scoreRun(G.book, scoreOpts({ cashCallChoice: (info) => { if (info.month === e.month && !G.cashChoices[info.month]) { pending = info; return 'pay'; } return G.cashChoices[info.month] || 'pay'; } }));
      const closeBoard = () => { B.o.remove(); this.board = null; this.overlayOpen = false; this.updateRace(); };
      if (!pending) return closeBoard();
      const sheet = B.o.querySelector('.sheet');
      sheet.innerHTML = '';
      const body = el('<div style="display:grid;gap:10px"><h3>Lloyd’s cash call</h3><p>After ' + esc(e.name) + ', your capital (£' + pending.capitalNow.toFixed(1) + 'm) is below the solvency line (£' + pending.line.toFixed(1) + 'm, 80% of your ECA).</p>' +
        '<p>Top up <b>£' + pending.topUp.toFixed(1) + 'm</b> now. Emergency capital is expensive: it costs <b>' + fmtM(pending.cost) + '</b> of value (' + fmtPts(-pending.cost * 1000) + ' points). Or pull up stumps and go into run-off: the game ends here.</p>' +
        '<div class="resactions"><button class="btn brass" id="pay">Pay up</button><button class="btn danger" id="runoff">Run-off</button></div></div>');
      sheet.appendChild(body);
      Sound.thud();
      body.querySelector('#pay').addEventListener('click', () => { G.cashChoices[e.month] = 'pay'; toast('Cash call paid', 'Your backers are not thrilled.', 'var(--warn)'); closeBoard(); });
      body.querySelector('#runoff').addEventListener('click', () => { G.cashChoices[e.month] = 'runoff'; G.runoff = e.month; closeBoard(); this.endYear(true); });
      if (AUTO) setTimeout(() => body.querySelector(params.get('cash') === 'runoff' ? '#runoff' : '#pay').click(), 500 / SPEED);
    },

    // ---- main loop ----
    update(dt) {
      if (this.ended || this.overlayOpen) {
        if (this.board && this.board.live && !this.board.landed) {
          this.board.t -= dt;
          const bc = this.board.body.querySelector('#bc'); if (bc) bc.textContent = Math.max(0, Math.ceil(this.board.t));
          if (this.board.t <= 0) this.landfall();
        }
        return;
      }
      this.t += dt; this.mt += dt;
      if (this.mt >= MONTH_LEN) {
        this.mt -= MONTH_LEN; this.month++;
        if (this.month >= 12) { this.month = 12; this.paintCal(); this.updateRace(); return this.endYear(false); }
        this.onMonth();
        if (this.overlayOpen) return;
      }
      const c = this.cur;
      if (c && !c.busy) {
        c.patience -= dt / c.total;
        const pat = this.root.querySelector('#pat');
        if (pat) { pat.style.transform = 'scaleX(' + Math.max(0, c.patience) + ')'; pat.style.background = c.patience < 0.3 ? 'var(--bad)' : c.patience < 0.6 ? 'var(--warn)' : 'var(--good)'; }
        if (c.patience <= 0) this.walk();
      }
      if (!this.cur && this.t >= this.nextAt && this.month < 12) this.present();
      if (this.alerting && this.t - this.alerting.alertAt > 10) this.resolveAlert(this.alerting, 'ignore');
      this.raceT -= dt;
      if (this.raceT <= 0) { this.raceT = 0.35; this.updateRace(); }
      this.paintCal();
      this.talkT -= dt;
      if (this.talkT <= 0) { this.talkT = 14 + rand() * 10; this.trash(rand() < 0.6 ? 'nemesis' : 'rival2'); }
    },
    endYear(runoff) {
      if (this.ended) return;
      this.ended = true; this.cur = null;
      Sound.murmur(false);
      if (this.alerting) this.resolveAlert(this.alerting, 'ignore');
      if (runoff) {
        Sound.bell(1);
        toast('Run-off', G.no + ' has stopped writing. The lawyers will take it from here.', 'var(--bad)', 4);
        setTimeout(() => go('results'), 1600 / SPEED);
      } else {
        Sound.bell(2);
        toast('Year closed', 'That’s the year of account. Now for the long tail.', 'var(--brass)');
        setTimeout(() => interstitial('close', () => go('close')), 900 / SPEED);
      }
    }
  };

  // ----- Step 5a: the 3-year close (slot machine) -----
  SCENES.close = {
    enter() {
      setStep('Step 5 of 5 · The three-year close');
      const prem = {};
      G.book.forEach((b) => { if (!(b.alert === 'exit')) prem[b.deal.cls] = (prem[b.deal.cls] || 0) + b.P; });
      const reels = Object.keys(prem).filter((k) => E.CLASSES[k].tail > 0).sort((a, b) => prem[b] - prem[a]).slice(0, 3)
        .map((k) => { const r = G.market.resDev[k] * (G.au === 'quant' ? 0.5 : 1); return { k, r, amt: r * prem[k] }; });
      this.reels = reels.length ? reels : [{ k: null, r: 0, amt: 0 }];
      this.pulled = false;
      const strip = (rl) => {
        const vals = [];
        for (let i = 0; i < 14; i++) { const v = (rand() - 0.5) * 0.3; vals.push('<div class="' + (v > 0 ? 'up' : 'down') + '">' + (v > 0 ? '+' : '−') + Math.abs(v * 100).toFixed(1) + '%<small>' + (rl.k ? esc(E.CLASSES[rl.k].short) : 'Short tail') + '</small></div>'); }
        vals.push(rl.k ? '<div class="' + (rl.r > 0 ? 'up' : 'down') + '">' + (rl.r > 0 ? '+' : '−') + Math.abs(rl.r * 100).toFixed(1) + '%<small>' + esc(E.CLASSES[rl.k].short) + ' · ' + fmtM(-rl.amt, true) + '</small></div>' : '<div class="down">0.0%<small>Short tail · nothing to develop</small></div>');
        return vals.join('');
      };
      const root = el('<section class="scene"><div class="stephead"><div><span class="eyebrow">Step 5 · The three-year close</span><h2>Pull the lever</h2></div>' +
        '<p>Long-tail classes keep developing after the year ends. Pull the lever to find out how your reserves held up. ' + (G.au === 'quant' ? 'The Quant halves any surprises.' : '') + '</p></div>' +
        '<div class="closewrap"><div class="slot"><div class="machine"><div class="mt">Reserve development</div><div class="reels" style="--n:' + this.reels.length + '">' +
        this.reels.map((rl, i) => '<div class="reel"><div class="strip" data-i="' + i + '">' + strip(rl) + '</div></div>').join('') + '</div></div>' +
        '<button class="lever" id="lever" aria-label="Pull the lever"><span class="shaft" id="shaft"><span class="knob"></span></span><span class="base"></span></button></div>' +
        '<p class="lossline" id="resLine" style="text-align:center;min-height:1.4em"></p><button class="btn primary" id="toResults" hidden>Read all about it →</button></div></section>');
      this.root = root;
      const lever = root.querySelector('#lever'), shaft = root.querySelector('#shaft');
      draggable(lever, {
        onMove: (dx, dy) => { shaft.style.transition = 'none'; shaft.style.transform = 'rotateX(' + Math.max(0, Math.min(70, dy)) + 'deg) scaleY(' + (1 - Math.max(0, Math.min(90, dy)) / 200) + ')'; },
        onEnd: (dx, dy) => { shaft.style.transition = ''; shaft.style.transform = ''; if (dy > 40) this.pull(); },
        onTap: () => this.pull()
      });
      root.querySelector('#toResults').addEventListener('click', () => go('results'));
      this.onKey = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.pulled ? (this.revealed && go('results')) : this.pull(); } };
      addEventListener('keydown', this.onKey);
      if (AUTO) setTimeout(() => this.pull(), 500 / SPEED);
      return root;
    },
    exit() { removeEventListener('keydown', this.onKey); },
    pull() {
      if (this.pulled) return;
      this.pulled = true;
      Sound.init();
      const shaft = this.root.querySelector('#shaft');
      shaft.style.transform = 'scaleY(.45)'; setTimeout(() => { shaft.style.transform = ''; }, 350);
      this.root.querySelectorAll('.strip').forEach((s, i) => {
        const h = s.firstElementChild.offsetHeight || 92, n = s.children.length;
        const a = s.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(' + -(n - 1) * h + 'px)' }], { duration: (1400 + i * 500) / SPEED, easing: 'cubic-bezier(.15,.6,.25,1)', fill: 'forwards' });
        const tk = setInterval(() => Sound.tick(), 90);
        a.onfinish = () => { clearInterval(tk); Sound.thud(); if (i === this.reels.length - 1) this.done(); };
      });
    },
    done() {
      this.revealed = true;
      const tot = this.reels.reduce((s, r) => s + r.amt, 0);
      const line = this.root.querySelector('#resLine');
      line.textContent = !this.reels[0].k ? 'Short-tail book: nothing left to develop.' : tot > 0.05 ? 'Reserves deteriorate: ' + fmtM(-tot) : tot < -0.05 ? 'Reserves release: ' + fmtM(-tot, true) : 'Reserves hold. Nobody believes it.';
      line.style.color = tot > 0.05 ? '#ffb3a6' : 'var(--good)';
      if (tot < -0.05) { const [x, y] = centre(line); FX.burst(x, y, 'coins', 24); Sound.kaching(); }
      const b = this.root.querySelector('#toResults'); b.hidden = false; b.focus({ preventScroll: true });
      if (AUTO) setTimeout(() => go('results'), 600 / SPEED);
    }
  };

  // ----- Step 5b: results -----
  const QUOTES = {
    veteran: ['In thirty years I’ve never seen anything like it. Twice.', 'You can’t model a handshake.'],
    quant: ['The result was inside my 95% confidence interval. Just.', 'I’ve already updated the model.'],
    rainmaker: ['I’d like to thank everyone I had lunch with. Which is everyone.', 'Relationships, darling. Relationships.'],
    forensic: ['I read every bordereau. Every single one. Please send help.', 'The audit trail speaks for itself.']
  };
  function miniRing(split, size = 18) {
    let a0 = -Math.PI / 2, o = '<svg viewBox="0 0 20 20" width="' + size + '" height="' + size + '" aria-hidden="true">';
    let tot = 0; for (const k in split) tot += split[k];
    for (const k in split) {
      if (!E.CLASSES[k]) continue;
      const a1 = a0 + (split[k] / tot) * Math.PI * 2;
      const p = (a) => [10 + 7 * Math.cos(a), 10 + 7 * Math.sin(a)];
      const [x0, y0] = p(a0), [x1, y1] = p(a1 - 0.0001);
      o += split[k] === tot ? '<circle cx="10" cy="10" r="7" fill="none" stroke="' + clsColor(k) + '" stroke-width="5"/>' : '<path d="M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A7 7 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + '" fill="none" stroke="' + clsColor(k) + '" stroke-width="5"/>';
      a0 = a1;
    }
    return o + '</svg>';
  }
  function waterfallSVG(res) {
    const rows = [
      ['Gross written premium', res.gwp, 'start'],
      ['Commission', -res.comm],
      ['Attritional losses', -res.attr],
      ['Cat losses', -res.cat],
      ['Reserve development', -res.res],
      ['Expenses & reinsurance', -res.expenses],
      ['Underwriting result', res.uwGross, 'total']
    ];
    if (G.qs) rows.push(['Outward QS share', -res.qsTake]);
    rows.push(['Cost of capital', -res.capCost], ['Value created', res.value, 'total'], ['On-plan bonus', res.onPlan ? 1 : 0], ['PMD letters', -res.pmd], ['Score (£m)', res.score / 1000, 'total']);
    let cum = 0;
    const segs = rows.map(([label, v, kind]) => {
      let a, b;
      if (kind === 'start' || kind === 'total') { a = 0; b = v; cum = v; } else { a = cum; b = cum + v; cum = b; }
      return { label, v, kind, a, b };
    });
    const lo = Math.min(0, ...segs.map((s) => Math.min(s.a, s.b))), hi = Math.max(1, ...segs.map((s) => Math.max(s.a, s.b)));
    const X0 = 132, X1 = 300, RH = 22, H = segs.length * RH + 8;
    const x = (v) => X0 + ((v - lo) / (hi - lo)) * (X1 - X0);
    let o = '<svg class="wf" viewBox="0 0 360 ' + H + '" role="img" aria-label="Score waterfall">';
    o += '<line x1="' + x(0) + '" y1="0" x2="' + x(0) + '" y2="' + H + '" stroke="var(--girder)" stroke-width="1"/>';
    segs.forEach((s, i) => {
      const y = 4 + i * RH;
      const left = Math.min(x(s.a), x(s.b)), w = Math.max(1.5, Math.abs(x(s.b) - x(s.a)));
      const col = s.kind === 'start' ? 'var(--crane)' : s.kind === 'total' ? (s.b >= 0 ? 'var(--brass)' : 'var(--bad)') : s.v >= 0 ? 'var(--good)' : 'var(--bad)';
      const origin = s.kind || s.v >= 0 ? 'left' : 'right';
      o += '<text x="0" y="' + (y + 14) + '"' + (s.kind ? ' class="v"' : '') + '>' + esc(s.label) + '</text>';
      o += '<rect class="wfbar" style="--dl:' + (i * 0.12).toFixed(2) + 's;transform-origin:' + origin + ';fill:' + col + '" x="' + left.toFixed(1) + '" y="' + (y + 3) + '" width="' + w.toFixed(1) + '" height="' + (RH - 8) + '" rx="2"/>';
      o += '<text x="356" y="' + (y + 14) + '" text-anchor="end" class="v">' + (s.kind ? fmtM(s.v) : fmtM(s.v, true)) + '</text>';
    });
    return o + '</svg>';
  }
  function headline(res, rivalScores) {
    const nem = E.RIVALS[G.nemesis].name, nemRun = G.rivalRuns[G.nemesis];
    const hit = G.market.events.filter((e) => e.done && e.loss > 0).sort((a, b) => b.loss - a.loss)[0];
    const mixName = E.MIX_BY_ID[G.mixId].name;
    const evClause = hit ? ', despite ' + hit.name + ' costing it ' + fmtM(hit.loss) : G.market.events.some((e) => e.done) ? ', while the catastrophes landed somewhere else' : '';
    if (res.runoff !== null) return ['Syndicate ' + G.no + ' enters run-off', G.name + ' pulls up stumps after ' + (hit ? hit.name : 'a bruising year') + '.'];
    if (res.score > 0 && nemRun.cashCalls.length) return [G.no + ' rides out the year as ' + nem + ' sinks', nem + ' needed a cash call. ' + G.name + ' did not.'];
    if (res.cor < 0.85) return ['Syndicate ' + G.no + ' storms to a ' + Math.round(res.cor * 100) + '% combined ratio', 'A ' + mixName + ' debut that has the Room talking' + evClause + '.'];
    if (res.score > nemRun.score && res.score > 0) return [G.name + ' beats ' + nem + ' in year one', 'The new ' + mixName + ' syndicate edges its nearest rival' + evClause + '.'];
    if (res.score >= 0) return ['Steady start for ' + G.name, 'Syndicate ' + G.no + ' creates value in its first year of account' + evClause + '.'];
    if (res.pmd >= 2) return ['PMD schedules "friendly chat" with ' + G.no, 'Performance Management would like to discuss the plan. And the other plan.'];
    return [G.name + ' "disappointed" with year one', 'Sources say the BOC is "not surprised".'];
  }

  SCENES.results = {
    enter() {
      setStep('Results · ' + SEASON);
      const res = E.scoreRun(G.book, scoreOpts());
      G.result = res;
      const rivalRuns = {};
      for (const id of Object.keys(E.RIVALS)) rivalRuns[id] = G.rivalRuns[id] || E.rivalRun(id, SEASON);
      const rivalBest = Math.max(...Object.values(rivalRuns).map((r) => r.score));
      const bigLines = G.book.filter((b) => b.line === 2).length;
      const own = G.book.filter((b) => !b.forced);
      const avgT = G.decisionTimes.length ? G.decisionTimes.reduce((a, b) => a + b, 0) / G.decisionTimes.length : 99;
      const paidCall = Object.values(G.cashChoices).includes('pay');
      const badges = [];
      if (G.market.events.some((e) => e.loss > 10) && res.value > 0) badges.push('bigone');
      if (bigLines >= 6) badges.push('bigline');
      if (G.alerts.length && G.alerts.every((a) => a.alert === 'audit' || a.alert === 'exit')) badges.push('bloodhound');
      if (res.runoff === null && res.gwp > 20 && res.cor < 0.85) badges.push('lutine');
      if (res.onPlan) badges.push('onplan');
      if (res.score > rivalBest) badges.push('slayer');
      if (G.calledIt) badges.push('calledit');
      if (G.decisionTimes.length >= 5 && avgT < 3) badges.push('quick');
      if (G.racehorse) badges.push('racehorse');
      if (paidCall && res.runoff === null) badges.push('survivor');
      if (own.length < 2) badges.push('declined');
      if (res.runoff !== null) badges.push('runoff');
      G.badges = badges;
      const grade = E.grade(res.roc, res.runoff);
      const [hl, deck] = headline(res);
      const mix = E.MIX_BY_ID[G.mixId];
      const quote = pick(QUOTES[G.au]);
      const para = 'Syndicate ' + G.no + ', a ' + mix.name + ' start-up, wrote ' + fmtM(res.gwp) + ' of premium in its first year of account, backed by ' + fmtM(res.fal) + ' of Funds at Lloyd’s.' +
        (res.cashCalls.length ? ' It needed a cash call along the way.' : '') + (G.pmd ? ' Performance Management wrote ' + G.pmd + (G.pmd > 1 ? ' letters.' : ' letter.') : '');
      const root = el('<section class="scene scroll"><div class="results-grid">' +
        '<article class="ledger' + (REDUCED ? '' : ' spin') + '" id="ledger"><div class="mast">The Lime Street Ledger</div>' +
        '<div class="dateline"><span>' + SEASON + ' · Late edition</span><span>Price: one Lutine Bell</span></div>' +
        '<h2>' + esc(hl) + '</h2><p class="deck">' + esc(deck) + '</p>' +
        '<div class="cols"><div class="photo">' + face(G.au, res.score >= 0 ? 'grin' : 'worried') + '</div><div class="body"><p>' + esc(para) + '</p><p>“' + esc(quote.replace(/\.$/, ',')) + '” said ' + esc(E.AUS[G.au].name) + ', Active Underwriter.</p></div></div>' +
        '<div class="figs"><div><b class="num">' + (res.gwp ? Math.round(res.cor * 100) + '%' : '–') + '</b><span>Combined ratio</span></div><div><b class="num">' + pct(res.roc, 1) + '</b><span>Return on capital</span></div><div><b class="num">' + fmtPts(res.score) + '</b><span>Score</span></div></div></article>' +
        '<div class="scorebox"><div class="bigscore"><span class="n num" id="bigN">0</span><span class="g">' + esc(grade) + '</span></div>' +
        '<div class="panel"><span class="eyebrow">How you scored (£m)</span>' + waterfallSVG(res) + '</div>' +
        '<div class="panel"><span class="eyebrow">Badges</span><div class="badges">' + (badges.length ? badges.map((b, i) => '<span class="badge' + (BADGES[b][2] ? ' shame' : '') + '" style="--dl:' + (0.6 + i * 0.15) + 's" title="' + esc(BADGES[b][1]) + '">' + esc(BADGES[b][0]) + '</span>').join('') : '<span class="muted">No badges this time. The Room is a hard school.</span>') + '</div></div>' +
        '<div class="panel"><span class="eyebrow">This week’s leaderboard · ' + SEASON + '</span><div class="lb" id="lb"></div><p class="muted" id="lbNote" style="font-size:.78rem;margin:8px 0 0"></p></div>' +
        '<div class="resactions"><button class="btn primary" id="again">Play again</button><button class="btn" id="copy">Copy result</button></div>' +
        '<textarea class="copybox" id="copyBox" readonly hidden aria-label="Your result"></textarea>' +
        '</div></div></section>');
      this.root = root; this.res = res; this.rivalRuns = rivalRuns; this.grade = grade;
      root.querySelector('#again').addEventListener('click', () => { newGame(); interstitial('enquiry', () => go('build')); });
      root.querySelector('#copy').addEventListener('click', () => this.copy());
      this.entry = {
        season: SEASON, score: res.score, syndicateNo: G.no, syndicateName: String(G.name).slice(0, 28), mixType: G.mixId, split: G.split, au: G.au,
        badges: badges.slice(0, 6), cor: Math.round(res.cor * 1000) / 1000, roc: Math.round(res.roc * 1000) / 1000, curve: res.curve.map((v) => E.round1(v)), at: new Date().toISOString()
      };
      this.lbListener = () => this.renderLB();
      LB.listeners.add(this.lbListener);
      return root;
    },
    mounted() {
      const res = this.res;
      Sound.bell(res.score >= 0 ? 2 : 1);
      if (res.score > 0) setTimeout(() => { const [x, y] = centre(this.root.querySelector('#bigN')); FX.burst(x, y, 'confetti', 70); }, 900);
      const n = this.root.querySelector('#bigN');
      const t0 = performance.now(), dur = REDUCED ? 1 : 1400;
      const step = () => { const k = Math.min(1, (performance.now() - t0) / dur); n.textContent = fmtPts(res.score * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      this.renderLB();
      LB.submit(this.entry).then((r) => {
        this.submitted = r;
        const note = this.root && this.root.querySelector('#lbNote');
        if (!note) return;
        note.textContent = r.shared ? (r.best === false ? 'Your best score this week is already on the shared board.' : 'Your score is on the shared board for everyone who can open this game.')
          : LB.live ? 'Saved on this device. To post to the shared board, ask the owner for Contributor access.' : 'This board lives on this device. Copy your result to challenge colleagues.';
        this.renderLB();
      });
    },
    exit() { LB.listeners.delete(this.lbListener); },
    renderLB() {
      const box = this.root && this.root.querySelector('#lb'); if (!box) return;
      let humans = LB.live ? LB.rows.map((r) => Object.assign({}, r, { who: LB.displayName(r), me: r.uid === LB.uid })) : store.get('lsl-local-' + SEASON, []).map((r) => Object.assign({}, r, { who: r.me ? 'You' : 'Someone' }));
      if (LB.live && !humans.some((h) => h.me && h.score === this.entry.score)) humans.push(Object.assign({}, this.entry, { uid: 'this-run', who: 'This run', me: true }));
      const ai = Object.keys(this.rivalRuns).map((id) => ({ uid: 'ai-' + id, who: E.RIVALS[id].name + ' (AI)', ai: true, score: this.rivalRuns[id].score, syndicateNo: E.RIVALS[id].no, syndicateName: E.RIVALS[id].blurb, split: E.MIX_BY_ID[E.RIVALS[id].mix].split, mixType: E.RIVALS[id].mix }));
      const rows = humans.concat(ai).sort((a, b) => b.score - a.score).slice(0, 14);
      const pref = store.get('lsl-ghost', null);
      box.innerHTML = rows.map((r, i) => '<button class="lbrow' + (r.me ? ' me' : '') + (r.ai ? ' ai' : '') + (pref && r.uid === pref ? ' ghostpick' : '') + '" data-uid="' + esc(r.uid) + '"' + (r.ai || r.me ? ' tabindex="-1"' : '') + '>' +
        '<span class="rk">' + (i + 1) + '</span>' + miniRing(r.split || {}) + '<span class="who"><b>' + esc(r.who) + '</b><span>' + esc((r.syndicateNo ? r.syndicateNo + ' · ' : '') + (r.syndicateName || '') + (r.mixType && E.MIX_BY_ID[r.mixType] && !r.ai ? ' · ' + E.MIX_BY_ID[r.mixType].name : '')) + '</span></span>' +
        '<span class="sc num">' + fmtPts(r.score) + '</span></button>').join('');
      box.querySelectorAll('.lbrow').forEach((b) => b.addEventListener('click', () => {
        const uid = b.dataset.uid;
        if (!LB.live || uid.startsWith('ai-') || uid === LB.uid || uid === 'this-run') return;
        store.set('lsl-ghost', uid);
        toast('Ghost chosen', 'Next game you’ll race their ghost.', 'var(--brass)');
        this.renderLB();
      }));
    },
    copy() {
      const r = this.res;
      const text = 'Lime Street Launch · ' + SEASON + ' · Syndicate ' + G.no + ' ' + G.name + ' (' + E.MIX_BY_ID[G.mixId].name + ', ' + E.AUS[G.au].name + ') · Score ' + fmtPts(r.score) + ' · COR ' + (r.gwp ? Math.round(r.cor * 100) + '%' : '–') + ' · RoC ' + pct(r.roc, 1) + ' · ' + this.grade + '. Beat that.';
      const box = this.root.querySelector('#copyBox');
      const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); toast('Select and copy', 'Your result is highlighted below.', 'var(--crane)'); };
      try {
        navigator.clipboard.writeText(text).then(() => toast('Copied', 'Paste it into Teams and wait for the replies.', 'var(--good)'), fallback);
      } catch (e) { fallback(); }
    }
  };

  // ---------- boot ----------
  function boot(data) {
    FX.init();
    newGame(data && data.no ? data : null);
    go('title');
    let last = performance.now();
    const loop = (ts) => {
      const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts;
      if (!paused && scene && scene.update) {
        try { scene.update(dt * SPEED); } catch (err) { console.error(err); }
      }
      FX.step(dt);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    LB.init();
  }
  window.__LSL = { get G() { return G; }, get scene() { return scene; }, go, E, LB };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ no: G && G.no, name: G && G.name })); } catch (e) { /* hot reload unavailable */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
