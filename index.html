    { id: 'capital-glut', text: 'Capital glut: everyone wants to back a syndicate', cap: -0.02 },
    { id: 'capital-crunch', text: 'Capital crunch: investors are nervous', cap: 0.02 },
    { id: 'specialty-boom', text: 'Geopolitics lifts specialty rates +10%', lr: { terror: -0.04, prc: -0.04, aviation: -0.03 } },
    { id: 'benign', text: 'Steady market. No surprises (yet).' }
  ];

  const PLAN_GWP = 100;       // £m stamp capacity applied for in year 1
  const FIXED_COSTS = 8;      // £m a year at £100m: team, Lloyd's fees, ops
  const ECU = 1.35;           // economic capital uplift
  const SOLVENCY_LINE = 0.6;  // cash call below 60% of the current ECA
  const CASH_CALL_COST = 0.2;
  const QS_SHARE = 0.25;
  const OUTWARDS_LOAD = 1.05; // annual cat XL shields are priced just above their expected recovery
  const ILW_COST = 0.25;      // last-minute ILW on a forecast event, share of gross RDS exposure
  const APPETITE = 1.0;       // net RDS appetite: no single full scenario may cost more than your FAL
  const shieldCost = (rdsId, gross) => gross * RDS_P[rdsId] * 0.5 * OUTWARDS_LOAD;
  const WINDOW_SHARE = { '1.1': 0.85, '1.7': 0.15 };
  const CAPACITY_STEPS = { shrink: 0.8, hold: 1, grow: 1.25, large: 1.5 };
  const ON_PLAN = { lo: 0.85, hi: 1.15, drift: 20 }; // a year is on plan if premium is within 85–115% of the stamp and no more than 20% of it is in different classes
  const fixedCosts = (cap, au) => FIXED_COSTS * (0.6 + 0.4 * cap / PLAN_GWP) + (au === 'rainmaker' ? 1.5 : 0);

  // ---------- members on the stamp ----------
  // The stamp is split into lines: the agency's own (aligned) corporate member and third-party members, who bring their
  // own FAL, take their share of the result and pay the agency a fee on their line and profit commission on their profit.
  const MIN_ALIGNED = 0.2;    // the BOC expects at least a fifth of the stamp to be the agency's own capital
  const MAX_THIRD = 1 - MIN_ALIGNED;
  // Reactions at coming into line, on the members' return for the year: leave below `leave`, halve below `halve`,
  // ask for a bigger line (growBy) above `grow`. The ILS fund also leaves when catastrophes exceed catLimit of FAL.
  const MEMBERS = {
    names: { label: 'Names via members’ agents', short: 'Names', color: '#e9d3a0', line: [0.08, 0.12], fee: 0.01, pc: 0.175, leave: 0, grow: 0.38, growBy: 0.5, note: 'Follow performance closely.' },
    corporate: { label: 'Kestrel Insurance Group', short: 'Kestrel', color: '#9fd0ff', line: [0.2, 0.25], fee: 0.0075, pc: 0.15, halve: -0.05, grow: 0.42, growBy: 0.25, note: 'Patient corporate capital.' },
    ils: { label: 'Thames Gate ILS fund', short: 'ILS fund', color: '#f0a35c', line: [0.15, 0.2], fee: 0.005, pc: 0.2, leave: 0, catLimit: 0.35, grow: 0.35, growBy: 0.5, note: 'Walks after a big catastrophe.' },
    family: { label: 'Family office', short: 'Family', color: '#c9e08a', line: [0.1, 0.15], fee: 0.01, pc: 0.1, stays: true, note: 'Loyal. Also owns a racehorse.' }
  };
  const round3 = (x) => Math.round(x * 1000) / 1000;
  const memberOf = (kind, share, label) => { const M = MEMBERS[kind]; return { kind, label: label || M.label, short: !label || label === M.label ? M.short : label.split(' ')[0], color: M.color, fee: M.fee, pc: M.pc, share: round3(share) }; };
  // Fill a stamp: lines are shares of the planned stamp and bring their own FAL; the agency's capital covers the rest.
  function stampFill(alignedFal, eca, lines, plan) {
    const L = Math.min(MAX_THIRD, lines.reduce((s, x) => s + x.line, 0));
    const filled = Math.min(1, (eca > 0 ? alignedFal / eca : 0) + L);
    const aligned = filled > 0 ? (filled - L) / filled : 1;
    const members = lines.map((x) => Object.assign(memberOf(x.kind, filled > 0 ? x.line / filled : 0, x.label), { line: x.line }));
    return { filled, capacity: (plan || PLAN_GWP) * filled, aligned, third: 1 - aligned, members, fal: alignedFal + L * eca, surplus: Math.max(0, alignedFal - (filled - L) * eca) };
  }
  // A standard set of members for automated players: corporate, ILS and Names in proportion
  function startMembers(third) {
    if (third < 0.05) return [];
    return [memberOf('corporate', third * 0.4), memberOf('ils', third * 0.3), memberOf('names', third * 0.3)];
  }
  // The members' view of a year at coming into line: their return on capital after fees and profit commission, and the catastrophe hit
  function memberReturn(entries, market, y, au, Y, qs, prot) {
    const mem = (Y && Y.members) || [];
    const third = mem.reduce((s, x) => s + x.share, 0);
    let gwp = 0; for (const e of entries) if (e.yoa === y) gwp += e.P;
    const uw = gwp > 0 ? gwp * (1 - projectYoA(entries, market, y, 12 * y + 10, au, prot)) * (qs ? 1 - QS_SHARE : 1) : 0;
    let cat = 0;
    for (const ev of market.years[y].events) {
      const mult = protMult(ev, prot);
      for (const e of entries) {
        if (ev.month < e.start || ev.month >= bookEnd(e)) continue;
        cat += e.P * (e.deal.rds[ev.rds] || 0) * ev.sev * mult;
      }
    }
    const catHit = cat / Math.max(1, (Y && Y.fal) || 1);
    if (third <= 0) return { ret: 0, catHit, uw };
    const fees = mem.reduce((s, x) => s + x.fee * x.share, 0) * (Y.capacity || 0);
    const pool = third * uw - fees;
    const pcRate = mem.reduce((s, x) => s + x.pc * x.share, 0) / third;
    return { ret: (pool > 0 ? pool * (1 - pcRate) : pool) / Math.max(1, third * (Y.eca || 1)), catHit, uw };
  }
  function memberReview(members, info) {
    return members.map((x) => {
      const M = MEMBERS[x.kind] || {};
      let action = 'stays', to = x.share;
      if (M.stays) action = 'stays';
      else if (M.catLimit != null && info.catHit > M.catLimit) { action = 'leaves'; to = 0; }
      else if (M.leave != null && info.ret < M.leave) { action = 'leaves'; to = 0; }
      else if (M.halve != null && info.ret < M.halve) { action = 'cuts'; to = x.share / 2; }
      else if (M.grow != null && info.ret > M.grow) { action = 'offers'; to = x.share * (1 + M.growBy); }
      return Object.assign({}, x, { action, to: round3(to) });
    });
  }
  // Departures and cuts always happen; an offer happens if accept(member, thirdSoFar) says yes and the 80% limit allows.
  function applyReview(review, accept) {
    const out = review.filter((x) => (x.action === 'offers' ? x.share : x.to) > 0).map((x) => Object.assign(memberOf(x.kind, x.action === 'offers' ? x.share : x.to, x.label), { offer: x.action === 'offers' ? x.to : null }));
    let third = out.reduce((s, x) => s + x.share, 0);
    for (const x of out) {
      if (x.offer == null) continue;
      const d = Math.min(x.offer - x.share, MAX_THIRD - third);
      if (d > 0.005 && accept(x, third)) { x.share = round3(x.share + d); third += d; }
      delete x.offer;
    }
    return out;
  }

  // ---------- the market over three years ----------
  const yearStart = (y) => y * 12;
  function weekMarket(season) {
    const r = rng('market|' + season);
    const years = [];
    let idx = {};
    for (const c in CLASSES) idx[c] = 0;
    for (let y = 0; y < YEARS; y++) {
      const modifier = MODIFIERS[Math.floor(r() * MODIFIERS.length)];
      const n = r() < 0.5 ? 1 : 2;
      const pool = Object.keys(RDS);
      const picked = [];
      while (picked.length < n) {
        const id = r.weighted(pool.filter(p => !picked.includes(p)).map(p => [p, RDS[p].w]));
        picked.push(id);
      }
      const events = [];
      picked.forEach((id, k) => {
        const d = RDS[id];
        const lo = k === 0 && n === 2 ? 1 : 2, hi = k === 0 && n === 2 ? 6 : 10;
        let month = d.months ? r.pick(d.months) : lo + Math.floor(r() * (hi - lo + 1));
        const sev = 0.3 + 0.8 * r();
        events.push({ rds: id, name: r.pick(d.names), month: yearStart(y) + month, sev, warn: d.warn });
        if (d.double) events.push({ rds: id, name: d.names[0] + ' (second storm)', month: yearStart(y) + Math.min(11, month + 1), sev: sev * 0.7, warn: true, second: true });
      });
      events.sort((a, b) => a.month - b.month);
      for (let i = 1; i < events.length; i++) if (events[i].month <= events[i - 1].month && !events[i].second) events[i].month = Math.min(yearStart(y) + 11, events[i - 1].month + 1);
      events.forEach((e, i) => { e.key = 'y' + y + 'e' + i; e.year = y; });
      const shock = {}, resDev = {};
      for (const id in CLASSES) {
        const c = CLASSES[id];
        shock[id] = r.normal(0, c.vol) + ((modifier.lr && modifier.lr[id]) || 0);
        resDev[id] = c.tail ? r.normal(0, c.tail) + ((modifier.res && modifier.res[id]) || 0) : 0;
      }
      const rateIdx = Object.assign({}, idx);
      // next year's rates: soft drift, hardening in the classes this year's events hit
      const next = {};
      for (const c in CLASSES) {
        let h = 0;
        for (const e of events) {
          const hit = CLASSES[c].templates.some(t => (t.rds[e.rds] || 0) > 0.8);
          if (hit) h += 0.05 + 0.1 * e.sev;
        }
        next[c] = clamp(idx[c] - 0.02 + h + r.normal(0, 0.03), -0.2, 0.35);
      }
      const outlook = {};
      for (const c in CLASSES) outlook[c] = Math.round((next[c] - idx[c]) * 100);
      years.push({ y, modifier, events, shock, resDev, rateIdx, outlook, capAdj: modifier.cap || 0 });
      idx = next;
    }
    const events = years.flatMap(Y => Y.events);
    return { season, years, events };
  }

  // ---------- capital ----------
  function splitKey(split) {
    return Object.keys(split).filter(k => split[k] > 0).sort().map(k => k + split[k]).join('-');
  }
  function weights(split) {
    let tot = 0; for (const k in split) tot += split[k];
    const w = {}; for (const k in split) if (split[k] > 0) w[k] = split[k] / tot;
    return w;
  }
  function capitalFor(split, loading, qs, capacity) {
    const w = weights(split);
    let scr = 0, hhi = 0;
    for (const k in w) { scr += w[k] * CLASSES[k].scr; hhi += w[k] * w[k]; }
    const div = 0.3 * (1 - hhi);
    const scrAmt = (capacity || PLAN_GWP) * scr * (1 - div);
    const eca = scrAmt * ECU * (1 + (loading || 0)) * (qs ? 1 - QS_SHARE : 1);
    return { scrFactor: scr, div, scr: scrAmt, eca };
  }
  function mixProfile(split) {
    const w = weights(split);
    let margin = 0, vol = 0, catLoad = 0;
    for (const k in w) {
      const c = CLASSES[k];
      margin += w[k] * (1 - c.lr - c.comm - 0.08);
      catLoad += w[k] * c.cat;
      vol += w[k] * (c.vol + c.cat * 0.6 + c.tail);
    }
    const cap = capitalFor(split, 0, false);
    return { margin, vol, catLoad, hunger: cap.eca / PLAN_GWP, eca: cap.eca, div: cap.div };
  }

  // capital offers that float up in a Capital Grab, scaled to the amount needed
  function capitalOffers(seed, need, capAdj, mini) {
    const r = rng('capital|' + seed);
    const c = capAdj || 0;
    // aligned capital (amt is a share of the ECA, at a cost a year) and members' lines (a share of the stamp)
    const full = [
      { src: 'agency', label: 'Your agency’s balance sheet', amt: 0.2, rate: 0.07 },
      { member: 'names' },
      { member: 'corporate' },
      { src: 'corporate', label: 'Corporate parent', amt: 0.25, rate: 0.07 },
      { member: 'ils' },
      { src: 'qs', label: 'Outward QS reinsurer', amt: 0, rate: 0, qs: true, hint: 'Cuts the capital you need by 25%, takes 25% of your result.' },
      { member: 'family', trap: 'racehorse', hint: 'A loyal line, but the founder’s racehorse comes with it.' },
      { src: 'pe', label: 'PE money for your corporate member', amt: 0.35, rate: 0.18, trap: 'hurdle', hint: 'Fills the hole fast. Wants 18% a year.' },
      { member: 'names' },
      { src: 'agency', label: 'Your agency’s balance sheet', amt: 0.2, rate: 0.07 },
      { member: 'corporate', label: 'Heron Mutual' },
      { src: 'corporate', label: 'Corporate parent', amt: 0.2, rate: 0.07 }
    ];
    const smallList = [
      { src: 'agency', label: 'Your agency’s balance sheet', amt: 0.35, rate: 0.08 },
      { src: 'corporate', label: 'Corporate parent', amt: 0.45, rate: 0.08 },
      { src: 'pe', label: 'PE money for your corporate member', amt: 0.8, rate: 0.13 },
      { src: 'agency', label: 'Your agency’s balance sheet', amt: 0.3, rate: 0.08 },
      { src: 'pe', label: 'Emergency PE money', amt: 1.1, rate: 0.18, trap: 'hurdle', hint: 'Expensive, but it fills the hole.' }
    ];
    const list = mini ? smallList : full;
    const gap = 2.0;
    return list.map((o, i) => {
      const t = { id: 'cap' + i, appearAt: i * gap + r() * 0.5, life: 6.5 + r() * 2 };
      if (o.member) {
        const M = MEMBERS[o.member];
        return Object.assign({}, o, t, { kind: 'line', src: o.member, label: o.label || M.label, line: round3(M.line[0] + (M.line[1] - M.line[0]) * r()), fee: M.fee, pc: M.pc, color: M.color, hint: o.hint || M.note });
      }
      return Object.assign({}, o, t, { kind: o.qs ? 'qs' : 'aligned', amt: round1(Math.max(0.5, o.amt * need * (0.9 + 0.2 * r()))), rate: o.qs ? 0 : Math.max(0.03, o.rate + c) });
    });
  }

  // ---------- deals ----------
  function tellsFor(q, c, r) {
    const z = (q - 1) / 0.2 + r.normal(0, 0.8);
    const hist = z < -0.4 ? 'Clean' : z > 0.6 ? 'Ugly' : 'Patchy';
    const rate = Math.round(-(q - 1) * 35 + r.normal(0, 4) + c.rate * 0.5);
    const growth = Math.max(0, Math.round(15 + (q - 1) * 120 + r.normal(0, 18)));
    const adequacy = Math.round(100 / q + r.normal(0, 3));
    const gq = q + r.normal(0, 0.05);
    const grade = gq < 0.85 ? 'A' : gq < 1.0 ? 'B' : gq < 1.15 ? 'C' : 'D';
    const gutScore = (q - 1) + r.normal(0, 0.08);
    const gut = gutScore < -0.06 ? 'good' : gutScore > 0.08 ? 'bad' : 'meh';
    return { tells: { hist, rate, growth }, adequacy, grade, gut };
  }
  const cycleQ = (qBase, idx) => clamp(qBase * Math.exp(-0.9 * idx), 0.5, 1.8);

  // Slips per window: renewals carry most of the book after year 1, so later 1.1 rushes are shorter.
  const deckSize = (auId, year, win) => (win === '1.1' ? (year > 0 ? 7 : 10) : 3) + (auId === 'rainmaker' ? (win === '1.1' ? (year > 0 ? 2 : 3) : 1) : 0);
  // A deck of new business for one renewal window of one year. scale sizes the slips to the plan.
  function makeDeck(season, split, auId, year, win, scale, tag, market) {
    const r = rng('deck|' + season + '|' + splitKey(split) + '|' + auId + '|' + year + '|' + win + '|' + (tag || 'player'));
    const mk = market || weekMarket(season);
    const Y = mk.years[year];
    const w = weights(split);
    const inMix = Object.keys(w);
    const offMix = Object.keys(CLASSES).filter(k => !inMix.includes(k));
    const hasProperty = inMix.some(k => PROPERTY.includes(k));
    const rain = auId === 'rainmaker';
    const n = deckSize(auId, year, win);
    // brokers know your plan: in-plan slips arrive roughly in its proportions (largest remainder), in random order
    const bw = inMix.map(k => [k, w[k] * (win === '1.7' && PROPERTY.concat(['energy', 'marine']).includes(k) ? 2.5 : 1)]);
    const bwt = bw.reduce((s, x) => s + x[1], 0);
    const bag = [];
    bw.map(([k, x]) => ({ k, x: x / bwt * n })).map(o => ({ k: o.k, f: Math.floor(o.x), rem: o.x - Math.floor(o.x) + r() * 1e-6 }))
      .sort((a, b) => b.rem - a.rem).forEach((o, i, all) => { const extra = i < n - all.reduce((s, z) => s + z.f, 0) ? 1 : 0; for (let j = 0; j < o.f + extra; j++) bag.push(o.k); });
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
    let bi = 0;
    const deck = [];
    for (let i = 0; i < n; i++) {
      const off = r() < 0.15;
      const brokerId = r.weighted([['hal', 20], ['seb', 20], ['fiona', hasProperty ? 15 : 0], ['reggie', 15], ['dev', 15], ['bot', 15]]);
      const b = BROKERS[brokerId];
      let cls;
      if (brokerId === 'fiona') cls = r.weighted(PROPERTY.map(k => [k, w[k] || 0.01]));
      else if (off) cls = r.pick(offMix);
      else cls = bag[bi++ % bag.length];
      const c = CLASSES[cls];
      let pool = c.templates.filter(t => t.window === win);
      if (!pool.length) pool = c.templates;
      let tmpl = r.pick(pool);
      if (brokerId === 'fiona') tmpl = c.templates.find(t => t.rds.flw && t.window === win) || tmpl;
      const qBase = clamp(Math.exp(r.normal(b.qBias + (rain ? 0.01 : 0), 0.22)), 0.6, 1.6);
      const q = cycleQ(qBase, Y.rateIdx[cls]);
      const base = round1((5 + 7 * r()) * b.size * (rain ? 1.15 : 1) * scale);
      const comm = clamp(c.comm + r.normal(0, 0.03) + b.commAdj, 0.08, 0.42);
      deck.push(Object.assign({
        id: 'y' + year + 'w' + win + 'd' + i + (tag ? '-' + tag : ''), cls, off: !inMix.includes(cls), label: tmpl.label, tmpl: tmpl.i, rds: tmpl.rds, lrAdj: tmpl.lrAdj,
        structure: tmpl.structure, window: win, year, broker: brokerId, qBase, q, base: Math.max(0.5, base), comm
      }, tellsFor(q, c, r)));
    }
    return deck;
  }

  // Next year's renewal of a bound portfolio: quality drifts, the market moves, the broker quotes a rate change.
  function renewalOffer(entry, market, year) {
    const d = entry.deal;
    const r = rng('renew|' + market.season + '|' + d.id + '|' + year);
    const c = CLASSES[d.cls];
    const qBase = clamp(d.qBase * Math.exp(r.normal(0, 0.07)), 0.55, 1.7);
    const prevIdx = market.years[year - 1].rateIdx[d.cls], idx = market.years[year].rateIdx[d.cls];
    const q = cycleQ(qBase, idx);
    const offered = Math.round((idx - prevIdx) * 100 + r.normal(0, 3));
    return Object.assign({}, d, tellsFor(q, c, r), {
      id: d.id.replace(/^y\d/, 'y' + year) + 'r', year, qBase, q, renewal: true, offeredRate: offered,
      comm: clamp(d.comm + r.normal(0, 0.01), 0.08, 0.42)
    });
  }

  function brokerLine(deal) {
    const q = deal.q;
    if (deal.renewal) return deal.offeredRate >= 0 ? 'Renewal at ' + (deal.offeredRate > 0 ? '+' : '') + deal.offeredRate + '%. Same again?' : 'Renewal at ' + deal.offeredRate + '%. Market’s soft, sorry.';
    switch (deal.broker) {
      case 'hal': return q < 0.95 ? 'This one’s a good’un, I promise.' : q > 1.1 ? 'I’d be careful with this one.' : 'Fair risk, fair price.';
      case 'seb': return 'Cracking risk, honestly.';
      case 'fiona': return 'Sunshine and low-rise, darling. What could go wrong?';
      case 'reggie': return 'Shall we discuss it over lunch?';
      case 'dev': return 'It’s Friday, it’s four o’clock, it’s yours.';
      case 'bot': return 'BEEP. CAPACITY REQUESTED. BEEP.';
    }
    return '';
  }

  const RACEHORSE = {
    id: 'y0racehorse', cls: 'specie', off: true, label: 'The founder’s racehorse (bloodstock binder)', rds: { hst: 1 }, lrAdj: 0.1, structure: 'binder', window: '1.1', year: 0,
    broker: 'reggie', qBase: 1.55, q: 1.55, base: 2.5, comm: 0.3, tells: { hist: 'Ugly', rate: -12, growth: 0 }, adequacy: 64, grade: 'D', gut: 'bad', forced: true
  };

  // attritional loss ratio of a deal in the year it was written
  function dealLR(deal, market) {
    const c = CLASSES[deal.cls];
    const Y = market.years[deal.year || 0];
    return Math.max(0.05, c.lr * deal.q * (1 + Y.shock[deal.cls]) + (deal.lrAdj || 0));
  }
  // RDS appetite agreed in the business plan: at least your FAL, or 110% of the gross exposure your plan implies
  function rdsAppetite(split, capacity, fal) {
    const w = weights(split);
    const planned = {};
    for (const c in w) {
      const ts = CLASSES[c].templates;
      for (const t of ts) for (const r in t.rds) planned[r] = (planned[r] || 0) + capacity * w[c] * t.rds[r] / ts.length;
    }
    const out = {};
    for (const r in RDS) out[r] = Math.max(APPETITE * fal, 1.1 * (planned[r] || 0));
    return out;
  }
  // gross loss estimate for each RDS from the live book at a month (absolute)
  function rdsExposure(entries, month) {
    const out = {};
    for (const e of entries) {
      if (e.start > month || e.start + 12 <= month) continue;
      if (e.alert === 'exit' && e.alertMonth <= month) continue;
      for (const r in e.deal.rds) out[r] = (out[r] || 0) + e.P * e.deal.rds[r];
    }
    return out;
  }

  // ---------- scoring over three years ----------
  // entries: [{deal, P, start (absolute month), yoa, alert, alertMonth}]  (policy runs 12 months from start)
  // o: {market, au, qs, years:[{fal, capital:[{amt,rate}], eca, capacity, split, outwards:[rdsId], outwardsCost}],
  //     ilw:{eventKey:true}, reinsCall:{eventKey:true}, pmd, cashCallChoice:(info)=>'pay'|'runoff', audits}
  function scoreGame(entries, o) {
    const m = o.market, au = o.au;
    const nYears = o.years.length;
    const T = 12 * YEARS;
    const curve = [], uwCurve = [];
    const per = [];
    for (let y = 0; y < YEARS; y++) per.push({ yoa: y, gwp: 0, comm: 0, attr: 0, cat: 0, res: 0, expenses: 0, outwards: 0, ilw: 0, audits: 0, fixed: 0, evSynd: 0, evAgency: 0, uwGross: 0, qsTake: 0, uw: 0, capCost: 0, cashCallCost: 0, value: 0, bound: {}, onPlan: false });
    const lines = entries.map(b => ({
      b, lr: dealLR(b.deal, m) * (b.alert === 'ignore' ? 1.35 : 1) * fxLR(b, o.fx), cat: 0,
      end: b.alert === 'exit' ? b.alertMonth : b.start + 12
    }));
    for (const l of lines) if (l.b.alert === 'audit' && au !== 'forensic') { per[l.b.yoa].audits += 0.3; }
    const evByMonth = {}, fxByMonth = {};
    m.events.forEach(e => { (evByMonth[e.month] = evByMonth[e.month] || []).push(e); });
    // in-year events: syndicate costs and the agency's own costs land in the month they happen
    (o.fx || []).forEach(f => { if (f.synd || f.agency) (fxByMonth[f.month] = fxByMonth[f.month] || []).push(f); });
    let agencyEv = 0;
    let cumUW = 0, worstUW = 0, cashCallCost = 0, runoff = null, agencyCum = 0, agencyCash = 0;
    let agDone = 0, yAg = 0, yPool = 0, pcDeficit = 0, pcNow = 0;
    const cashCalls = [];
    const falNow = (y) => (o.years[Math.min(y, nYears - 1)] || {}).fal || 0;
    let falExtra = 0;
    const net = (x) => x * (o.qs ? 1 - QS_SHARE : 1);
    for (let mo = 0; mo < T; mo++) {
      const y = Math.floor(mo / 12);
      if (y >= nYears) break;
      let uw = 0;
      const Yo = o.years[y];
      const mem = Yo.members || [];
      const third = mem.reduce((s, x) => s + x.share, 0), a = 1 - third;
      const pcR = third > 0 ? mem.reduce((s, x) => s + x.pc * x.share, 0) / third : 0;
      if (mo % 12 === 0) {
        const fx = fixedCosts(Yo.capacity || PLAN_GWP, au);
        per[y].fixed = fx;
        per[y].outwards = Yo.outwardsCost || 0;
        uw -= per[y].audits + per[y].outwards;
      }
      uw -= per[y].fixed / 12;
      for (const l of lines) {
        if (mo < l.b.start || mo >= l.end) continue;
        uw += l.b.P * (1 - l.b.deal.comm - l.lr) / 12;
      }
      for (const e of (evByMonth[mo] || [])) {
        const shielded = (Yo.outwards || []).includes(e.rds);
        let gross = 0;
        for (const l of lines) {
          if (mo < l.b.start || mo >= l.end) continue;
          const f = l.b.deal.rds[e.rds];
          if (!f) continue;
          gross += l.b.P * f;
          let loss = l.b.P * f * e.sev;
          if (shielded) loss *= 0.5;
          if (o.ilw && o.ilw[e.key]) loss *= 0.5;
          if (o.reinsCall && o.reinsCall[e.key]) loss *= 0.5;
          l.cat += loss; uw -= loss;
          per[l.b.yoa].cat += loss;
        }
        if (o.ilw && o.ilw[e.key]) { const c = gross * ILW_COST; per[y].ilw += c; uw -= c; }
      }
      for (const f of (fxByMonth[mo] || [])) {
        if (f.synd) { uw -= f.synd; per[f.y].evSynd += f.synd; }
        if (f.agency) { per[f.y].evAgency += f.agency; agencyEv += f.agency; }
      }
      cumUW += net(uw);
      worstUW = Math.min(worstUW, cumUW);
      // the agency's running value for the race: its own share and fees, plus profit commission once members are in profit
      const feeM = mem.reduce((s, x) => s + x.fee * x.share, 0) * (Yo.capacity || 0) / 12;
      yAg += a * net(uw) + feeM;
      yPool += third * net(uw) - feeM;
      pcNow = third > 0 ? pcR * Math.max(0, yPool + pcDeficit) : 0;
      agencyCum = agDone + yAg + pcNow;
      if (mo % 12 === 11) { agDone += yAg + pcNow; if (third > 0) pcDeficit = Math.min(0, yPool + pcDeficit); yAg = 0; yPool = 0; pcNow = 0; }
      // solvency check after an event month: FAL plus funds held in the syndicate (open-year profits or losses)
      if (evByMonth[mo]) {
        const capitalNow = falNow(y) + falExtra + cumUW;
        const line = SOLVENCY_LINE * (Yo.eca || 0);
        if (capitalNow < line) {
          const topUp = line - capitalNow;
          const choice = o.cashCallChoice ? o.cashCallChoice({ month: mo, year: y, topUp, capitalNow, line, cost: topUp * CASH_CALL_COST, aligned: a }) : 'pay';
          cashCalls.push({ month: mo, year: y, topUp, choice, aligned: a });
          if (choice === 'runoff') runoff = mo;
          else { falExtra += topUp; const cc = topUp * CASH_CALL_COST; cashCallCost += cc; per[y].cashCallCost += cc; agencyCash += a * cc; }
        }
      }
      const capAccrued = o.years.slice(0, y).reduce((s, Y) => s + Y.capital.reduce((a, c) => a + c.amt * c.rate, 0), 0)
        + Yo.capital.reduce((a, c) => a + c.amt * c.rate, 0) * ((mo % 12) + 1) / 12;
      curve.push(round1(agencyCum - capAccrued - agencyCash - agencyEv));
      uwCurve.push(cumUW);
      if (runoff !== null) break;
    }
    // per-YoA totals; exposure beyond the game (or after run-off) is projected at expected loss, without new catastrophes
    const lastMo = runoff !== null ? runoff + 1 : Math.min(T, 12 * nYears);
    for (const l of lines) {
      const P = per[l.b.yoa];
      const span = l.end - l.b.start;
      const earnedIn = clamp(Math.min(l.end, lastMo) - l.b.start, 0, span);
      const frac = runoff !== null ? earnedIn / 12 : span / 12;
      P.gwp += l.b.P * frac; P.comm += l.b.P * frac * l.b.deal.comm; P.attr += l.b.P * frac * l.lr;
      if (runoff === null && l.b.start + 12 > T) {
        const left = (l.b.start + 12 - T) / 12;
        let exp = 0; for (const r in l.b.deal.rds) exp += l.b.deal.rds[r] * RDS_P[r];
        P.cat += l.b.P * exp * left;
      }
      if (runoff === null && l.end === l.b.start + 12) {
        let rd = m.years[l.b.yoa].resDev[l.b.deal.cls] * l.b.P;
        if (au === 'quant') rd *= 0.5;
        P.res += rd;
      }
      P.bound[l.b.deal.cls] = (P.bound[l.b.deal.cls] || 0) + l.b.P;
    }
    let total = 0, onPlanYears = 0, gwpAll = 0, lossAll = 0, deficit = 0;
    for (let y = 0; y < nYears; y++) {
      const P = per[y], Yo = o.years[y];
      if (runoff !== null && 12 * y > runoff) { P.skipped = true; continue; }
      const yearFrac = runoff !== null && runoff < 12 * y + 12 ? (runoff - 12 * y + 1) / 12 : 1;
      P.fixed *= yearFrac;
      P.expenses = P.fixed + P.outwards + P.ilw + P.audits + P.evSynd;
      P.uwGross = P.gwp - P.comm - P.attr - P.cat - P.res - P.expenses;
      P.qsTake = o.qs ? P.uwGross * QS_SHARE : 0;
      P.uw = P.uwGross - P.qsTake;
      // the agency's take: its aligned share, fees on members' lines, and profit commission once members' losses are made good
      const mem = Yo.members || [];
      const third = mem.reduce((s, x) => s + x.share, 0), a = 1 - third;
      const pcR = third > 0 ? mem.reduce((s, x) => s + x.pc * x.share, 0) / third : 0;
      P.aligned = a;
      P.fees = mem.reduce((s, x) => s + x.fee * x.share, 0) * (Yo.capacity || 0) * yearFrac;
      const pool = third * P.uw - P.fees;
      if (third > 0 && pool + deficit > 0) { P.pc = pcR * (pool + deficit); deficit = 0; } else { P.pc = 0; if (third > 0) deficit += pool; }
      P.membersTake = third * P.uw - P.fees - P.pc;
      P.alignedUW = a * P.uw;
      P.capCost = Yo.capital.reduce((s, c) => s + c.amt * c.rate, 0) * yearFrac + a * P.cashCallCost;
      P.value = P.alignedUW - P.capCost + P.fees + P.pc - P.evAgency;
      P.cor = P.gwp > 0 ? (P.comm + P.attr + P.cat + P.res + P.expenses) / P.gwp : 0;
      P.fal = Yo.fal;
      P.roc = Yo.fal > 0 ? P.uw / Yo.fal : 0;
      const bt = Object.values(P.bound).reduce((a, b) => a + b, 0);
      const w = weights(Yo.split);
      let drift = 0;
      for (const k of new Set([...Object.keys(w), ...Object.keys(P.bound)])) drift += Math.abs((bt ? (P.bound[k] || 0) / bt : 0) - (w[k] || 0));
      P.drift = drift * 50; P.boundTot = bt;
      P.onPlan = runoff === null && bt >= Yo.capacity * ON_PLAN.lo && bt <= Yo.capacity * ON_PLAN.hi && P.drift <= ON_PLAN.drift;
      if (P.onPlan) onPlanYears++;
      total += P.value; gwpAll += P.gwp; lossAll += P.comm + P.attr + P.cat + P.res + P.expenses;
    }
    const pmd = o.pmd || 0;
    const score = Math.round(total * 1000 + onPlanYears * 500 - pmd * 1000);
    if (runoff !== null) while (curve.length < T) { curve.push(curve[curve.length - 1]); uwCurve.push(uwCurve[uwCurve.length - 1]); }
    // letters and the on-plan bonus land in the race when they happen, and the race finishes on the score
    const pmdAt = (o.pmdAt || []).slice(0, pmd);
    while (pmdAt.length < pmd) pmdAt.push(T - 1);
    // mid-game the curve only runs to the months played so far
    for (let i = 0; i < curve.length; i++) {
      let adj = 0;
      for (const m of pmdAt) if (m <= i) adj -= 1;
      for (let y = 0; y < nYears; y++) if (per[y].onPlan && i >= 12 * y + 11) adj += 0.5;
      curve[i] = round1(curve[i] + adj);
    }
    if (curve.length >= T) curve[T - 1] = round1(score / 1000);
    const uwAll = per.reduce((s, P) => s + (P.skipped ? 0 : P.uw), 0);
    const falAvg = o.years.reduce((s, Y) => s + (Y.fal || 0), 0) / Math.max(1, nYears);
    const live = per.filter((P) => !P.skipped && P.aligned != null);
    return {
      per, value: total, score, onPlanYears, pmd, cashCalls, cashCallCost, runoff, curve, uwCurve,
      uwAll, fees: live.reduce((s, P) => s + P.fees, 0), pc: live.reduce((s, P) => s + P.pc, 0),
      alignedAvg: live.length ? live.reduce((s, P) => s + P.aligned, 0) / live.length : 1,
      gwp: gwpAll, cor: gwpAll > 0 ? lossAll / gwpAll : 0, roc: falAvg > 0 ? uwAll / (falAvg * nYears) : 0,
      lines: lines.map(l => ({ id: l.b.deal.id, yoa: l.b.yoa, cls: l.b.deal.cls, P: l.b.P, lr: l.lr, cat: l.cat }))
    };
  }

  // Lloyd's verdict on next year's business plan
  function pmdVerdict(projCOR, ask) {
    if (projCOR > 1.15) return { mult: 0.8, stamp: 'Remediation plan', note: 'Projected combined ratio ' + Math.round(projCOR * 100) + '%. Shrink by 20%.' };
    if (projCOR > 1.05) return { mult: Math.min(ask, 1), stamp: ask > 1 ? 'Hold' : 'Approved', note: ask > 1 ? 'No growth until the numbers improve.' : 'Approved.' };
    if (projCOR > 0.95 && ask > 1.25) return { mult: 1.25, stamp: 'Capped at +25%', note: 'Growth capped while the plan beds in.' };
    return { mult: ask, stamp: 'Approved', note: 'Approved as submitted.' };
  }
  // projected combined ratio of a YoA part-way through its first year
  // Catastrophe multiplier on an event after the protection in place: shield, ILW, Reinsurance Call (0.8 when unknown)
  function protMult(ev, prot) {
    if (!prot) return 0.8;
    const Y = prot.years && prot.years[Math.floor(ev.month / 12)];
    return ((Y && (Y.outwards || []).includes(ev.rds)) ? 0.5 : 1) * (prot.ilw && prot.ilw[ev.key] ? 0.5 : 1) * (prot.reinsCall && prot.reinsCall[ev.key] ? 0.5 : 1);
  }
  const bookEnd = (e) => (e.alert === 'exit' && e.alertMonth != null ? Math.min(e.start + 12, e.alertMonth) : e.start + 12);
  // projected combined ratio of a YoA part-way through: catastrophes so far at their cost after your protection,
  // plus the expected catastrophe load still to run (halved on shielded scenarios). prot: {years, ilw, reinsCall}
  function projectYoA(entries, market, yoa, month, au, prot) {
    let P = 0, loss = 0;
    for (const e of entries) {
      if (e.yoa !== yoa) continue;
      P += e.P;
      loss += e.P * (e.deal.comm + dealLR(e.deal, market) * (e.alert === 'ignore' ? 1.35 : 1) * fxLR(e, prot && prot.fx));
      const Y = prot && prot.years && prot.years[Math.floor(Math.max(month, e.start) / 12)];
      let exp = 0; for (const r in e.deal.rds) exp += e.deal.rds[r] * RDS_P[r] * (Y && (Y.outwards || []).includes(r) ? 0.5 : 1);
      loss += e.P * exp * clamp((bookEnd(e) - Math.max(month, e.start)) / 12, 0, 1);
    }
    for (const f of (prot && prot.fx) || []) if (f.y === yoa && f.month <= month && f.synd) loss += f.synd;
    for (const ev of market.events) {
      if (ev.month > month) continue;
      const mult = protMult(ev, prot);
      for (const e of entries) {
        if (e.yoa !== yoa || ev.month < e.start || ev.month >= bookEnd(e)) continue;
        loss += e.P * (e.deal.rds[ev.rds] || 0) * ev.sev * mult;
      }
    }
    return P > 0 ? loss / P + 0.08 : 1;
  }

  // grades on the final score; thresholds from the simulation put careful play at roughly 15/35/30/15/5%
  const GRADES = [[45000, 'Lloyd’s darling'], [28000, 'Solid franchise'], [15000, 'Keep calm and carry on'], [0, 'PMD on speed-dial']];
  function grade(score, runoff) {
    if (runoff !== null && runoff !== undefined) return 'Run-off';
    const g = GRADES.find(([min]) => score >= min);
    return g ? g[1] : 'Remediation plan';
  }

  const EVENT_BY_ID = Object.fromEntries(EVENTS.map((e) => [e.id, e]));

  // The week's draw: six slots (two a year, never the same group twice in a year) and the order events are tried in.
  function eventPlan(season) {
    const r = rng('events|' + season);
    const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const g = shuffle(Object.keys(EVENT_GROUPS)).concat(shuffle(Object.keys(EVENT_GROUPS)).slice(0, 2));
    if (g[4] === g[5]) g[5] = Object.keys(EVENT_GROUPS).find((k) => k !== g[4]);
    const slots = [];
    for (let y = 0; y < YEARS; y++) for (let s = 0; s < 2; s++) slots.push({ y, month: EVENT_MONTHS[s][r() < 0.5 ? 0 : 1], group: g[2 * y + s] });

  }
  // What an event needs to know about the game at that moment; numbers are the same for everyone with the same book.
  // o: {season, slot, y, month (absolute), au, market, entries, split, members, capacity, buysShields, rival}
  function eventCtx(o) {

    const byP = (a) => a.slice().sort((x, y) => y.P - x.P)[0] || null;
    const sumBy = (key) => { const t = {}; cur.forEach((e) => { const k = key(e); t[k] = (t[k] || 0) + e.P; }); return t; };
    const cls = sumBy((e) => e.deal.cls), brk = sumBy((e) => e.deal.broker);
    const top = Object.keys(cls).sort((a, b) => cls[b] - cls[a])[0] || null;
    const brokerId = Object.keys(brk).sort((a, b) => brk[b] - brk[a])[0] || 'hal';
    const Y = o.market.years[o.y];
    const inPlan = Object.keys(o.split);
    const hot = inPlan.slice().sort((a, b) => Y.rateIdx[b] - Y.rateIdx[a])[0] || null;
    const longT = {}; o.entries.filter((e) => e.yoa >= o.y - 1 && e.yoa <= o.y && LONG_TAIL.includes(e.deal.cls)).forEach((e) => { const k = e.deal.cls + '|' + e.yoa; longT[k] = (longT[k] || 0) + e.P; });
    const longKey = Object.keys(longT).sort((a, b) => longT[b] - longT[a])[0];
    const rr = rng('event|' + o.season + '|' + o.slot);

      a: 1 - mem.reduce((s, x) => s + x.share, 0), hasNames: mem.some((x) => x.kind === 'names'),
      book: byP(cur), binder: byP(cur.filter((e) => e.deal.structure === 'binder')),
      top, topP: top ? cls[top] : 0, stop: top ? round1(0.025 * cls[top]) : 0,
      brokerId, brokerName: BROKERS[brokerId].name, brokerFirm: BROKERS[brokerId].firm, brokerP: brk[brokerId] || 0,
      hot, hotIn: !!hot, gwpRatio: written / cap, big: round1(0.08 * cap), small: round1(0.04 * cap), warBig: round1(0.06 * cap), warSmall: round1(0.03 * cap),
      long: longKey ? longKey.split('|')[0] : null, longY: longKey ? +longKey.split('|')[1] : o.y, resAmt: longKey ? clamp(round1(0.05 * longT[longKey]), 0.4, 2.5) : 0,
      claim: clamp(round1(0.07 * (byP(cur) || { P: 10 }).P), 0.5, 2.5),

  function pickEvent(plan, slot, c, used) {

  const evStr = (v, c) => (typeof v === 'function' ? v(c) : v);

  function describeFx(f) {

    if (f.synd) out.push('−' + fmtM1(f.synd) + ' (a syndicate cost)');
    (f.lr || []).forEach((l) => out.push((l.mult > 1 ? 'loss ratio +' : 'loss ratio −') + Math.round(Math.abs(l.mult - 1) * 100) + '% on ' + (l.cls ? CLASSES[l.cls].short : 'that book') + ' this year'));
    if (f.scale) out.push('premium −' + Math.round((1 - f.scale.f) * 100) + '% on ' + (f.scale.cls ? CLASSES[f.scale.cls].short : 'that book'));
    if (f.add) out.push('+' + fmtM1(f.add.P) + ' of ' + CLASSES[f.add.cls].short + ' premium');

    if (f.goodwill) out.push('your next PMD letter becomes a warning');

  // the card as shown: answers in a seeded order for rule events, effects listed up front for trade events
  function eventView(ev, c) {

  // an answer's effects, with any risk decided by the week's roll; the cost of a risk lands at year end
  function eventFx(ev, i, c) {
    const a = ev.a[i], f = Object.assign({}, a.fx(c));

    for (const k of ['agency', 'synd', 'lr', 'pmd', 'goodwill', 'add', 'scale', 'shield', 'snub']) if (f[k] != null) res[k] = f[k];

    if (f.risk) {

  // how an automated player answers: 'best' (careful), 'mixed' (casual), 'random', 'bold' (Kraken)
  function eventPick(ev, c, policy, r) {
    const tagged = (t) => ev.a.findIndex((a) => a.tag === t);
    if (policy === 'random') return Math.floor(r() * 3);
    if (policy === 'bold') return ev.kind === 'rule' ? tagged(r() < 0.5 ? 'bad' : 'ok') : tagged('bold');

  // a fresh book for the 'add' effect: the class at its current rates, a little better after the loss that hardened it
  function eventDeal(c, cls, P, prefer) {
    const r = rng('evdeal|' + c.season + '|' + c.slot + '|' + cls);
    const C = CLASSES[cls];
    const pool = prefer ? C.templates.filter((t) => t.label.toLowerCase().includes(prefer)) : C.templates;
    const tmpl = (pool.length ? pool : C.templates)[Math.floor(r() * (pool.length || C.templates.length))];
    const b = BROKERS[c.brokerId] || BROKERS.hal;
    const qBase = clamp(Math.exp(r.normal(b.qBias - 0.03, 0.18)), 0.6, 1.6);

  // an answer's lasting effects on the game state: costs and loss ratios for scoring, new or rescaled books,
  // and what carries into later months (next year's shield price, a broker's snub, goodwill)
  function applyEventFx(f, c, st) {
    if (f.synd || f.agency || f.lr) st.fx.push({ y: f.y, month: f.month, synd: f.synd || 0, agency: f.agency || 0, lr: f.lr || null });
    if (f.later && (f.later.synd || f.later.agency)) st.fx.push({ y: f.y, month: f.later.month, synd: f.later.synd || 0, agency: f.later.agency || 0 });

    if (f.scale) for (const e of st.entries) if (e.yoa === f.y && ((f.scale.id && e.deal.id === f.scale.id) || (f.scale.cls && e.deal.cls === f.scale.cls))) e.P = round1(e.P * f.scale.f);

  // ---------- automated players (rivals and the balance sim) ----------
  function estimateQ(deal, au, noise) {
    let est = 1;

  // ---------- pointer drag helper (tap and keyboard fall back to onTap) ----------
  // opts.ignore: selector for child controls that keep their own clicks (pointer capture would swallow them)
  function draggable(node, opts) {
    let id = null, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0, moved = false;
    const th = opts.threshold || 6;
    node.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (opts.enabled && !opts.enabled())) return;
      if (opts.ignore && e.target.closest && e.target.closest(opts.ignore)) return;
      id = e.pointerId; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); moved = false; vx = vy = 0;
      try { node.setPointerCapture(id); } catch (err) { /* capture unsupported */ }
      opts.onDown && opts.onDown(e);
    });
    node.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > th) { moved = true; opts.onStart && opts.onStart(e); }
      const now = performance.now(), dt = Math.max(8, now - lt);
      vx = ((e.clientX - lx) / dt) * 1000; vy = ((e.clientY - ly) / dt) * 1000; lx = e.clientX; ly = e.clientY; lt = now;
      if (moved && opts.onMove) opts.onMove(dx, dy, e);
    });
    const end = (e, cancelled) => {
      if (e.pointerId !== id) return;
      id = null;
      if (!moved) { if (!cancelled && opts.onTap) opts.onTap(e); return; }
      opts.onEnd && opts.onEnd(e.clientX - sx, e.clientY - sy, vx, vy, e, cancelled);
    };
    node.addEventListener('pointerup', (e) => end(e, false));
    node.addEventListener('pointercancel', (e) => end(e, true));
    node.addEventListener('click', (e) => { if (e.detail === 0 && opts.onTap) opts.onTap(e); });
  }

    for (const n of document.elementsFromPoint(x, y)) {
      if (ignore && (n === ignore || ignore.contains(n))) continue;
      const hit = n.closest && n.closest(selector);
      if (hit) return hit;
    }
    return null;
  }

  // ---------- journey bar: where you are in the game ----------
  const JW_TOTAL = JOURNEY.reduce((s, j) => s + j.w, 0);
  const Journey = {
    el: $('#journey'), k: undefined, f: -1,
    init() {
      const groups = Object.keys(JGROUPS).map((g) => {
        const steps = JOURNEY.filter((j) => j.g === g);
        return '<span class="jg ' + g + '" style="flex:' + steps.reduce((s, j) => s + j.w, 0) + '"><span class="jgl">' + esc(JGROUPS[g][2] || JGROUPS[g][0]) + '</span><span class="jsegs">' +
          steps.map((j) => '<span class="jseg" data-k="' + j.k + '" style="flex:' + j.w + '" title="' + esc(j.name) + '"><i></i><em>' + esc(j.label) + '</em></span>').join('') + '</span></span>';

      this.el.innerHTML = '<button class="jbar" id="jbar" aria-label="Show the road ahead">' + groups + '</button><span class="jcap" id="jcap"></span>';
      this.el.querySelector('#jbar').addEventListener('click', () => showRoadmap());
    },
    sync(name) {
      this.el.hidden = name === 'title';
      const map = { build: 'triage', pitch: 'boc', grab: 'capital', tape: 'tape', close: 'close', results: 'done' };
      if (name === 'roadmap') this.set(null, 0);
      else if (name === 'year') this.set('y' + G.y, 0);
      else if (map[name]) this.set(map[name], name === 'close' ? 0.4 : 0.5);
    },
    set(k, f) {
      if (k === this.k && Math.abs(f - this.f) < 0.005) return;
      this.k = k; this.f = f;
      const idx = k === 'done' ? JOURNEY.length : k ? JOURNEY.findIndex((j) => j.k === k) : -1;
      let doneW = 0;
      JOURNEY.forEach((j, i) => {
        const seg = this.el.querySelector('.jseg[data-k="' + j.k + '"]');
        seg.className = 'jseg' + (i < idx ? ' done' : i === idx ? ' now' : '');
        seg.firstElementChild.style.width = (i < idx ? 100 : i === idx ? Math.max(6, f * 100) : 0) + '%';
        doneW += i < idx ? j.w : i === idx ? j.w * f : 0;
      });
      const left = Math.round(((JW_TOTAL - doneW) / JW_TOTAL) * 7);
      const togo = left >= 1 ? 'about ' + left + ' min to go' : 'nearly there';
      let cap;
      if (idx < 0) cap = 'The road ahead · <b>about 7 minutes</b>';
      else if (k === 'done') cap = '<b>Game complete</b>';
      else {
        const j = JOURNEY[idx];
        if (j.g === 'pre') cap = 'Pre-launch · <b>step ' + (idx + 1) + ' of 4: ' + esc(j.name) + '</b>';
        else if (j.g === 'live') cap = 'Active syndicate · <b>year ' + (idx - 3) + ' of 3</b> (YoA ' + esc(j.label) + ')';
        else cap = '<b>The close</b>';
        cap += ' · ' + togo;
      }
      this.el.querySelector('#jcap').innerHTML = cap;
    }
  };

  // ---------- leaderboard (shared via the db capability when available) ----------
  const LB = {
    db: null, user: null, uid: null, rows: [], unsub: null, live: false, names: {}, listeners: new Set(),
    async init() {
      const C = window.claude;
      if (!C || typeof C.use !== 'function') return;
      try {
        const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
        if (!db) return;
        this.db = db; this.user = user;
        this.uid = user ? await user.id() : null;
        this.live = true;
        this.unsub = db.collection('scores').where('season', '==', WEEK).orderBy('score', 'desc').limit(25)
          .onSnapshot((snap) => {
            this.rows = snap.docs.map((d) => Object.assign({ uid: d.id }, d.data()));
            this.resolveNames().then(() => this.listeners.forEach((fn) => fn()));
          }, () => { this.live = false; this.listeners.forEach((fn) => fn()); });
      } catch (e) { this.live = false; }
    },
    async resolveNames() {
      if (!this.user || !this.user.profiles) return;
      const ids = this.rows.map((r) => r.uid).filter((id) => !(id in this.names));
      if (!ids.length) return;
      try {
        const ps = await this.user.profiles(ids);
        for (const id of ids) this.names[id] = (ps && ps[id] && ps[id].name) || '';
      } catch (e) { /* names stay blank */ }
    },
    async submit(entry) {
      // local board and personal best always
      const key = 'lsl-local-' + WEEK;
      const local = store.get(key, []);
      local.push(Object.assign({ uid: 'local-' + Date.now(), me: true }, entry));
      local.sort((a, b) => b.score - a.score);
      store.set(key, local.slice(0, 10));
      const pb = store.get('lsl-pb-' + WEEK, null);
      if (!pb || entry.score > pb.score) store.set('lsl-pb-' + WEEK, entry);
      if (!this.db || !this.uid) return { shared: false };
      try {
        const ref = this.db.doc('scores/' + this.uid);
        const cur = await ref.get();
        const old = cur.exists ? cur.data() : null;
        if (old && old.season === WEEK && old.score >= entry.score) return { shared: true, best: false };
        await ref.set(entry);
        return { shared: true, best: true };
      } catch (e) { return { shared: false, error: e && e.code }; }
    },
    displayName(row) {
      if (row.uid && row.uid === this.uid) return 'You';
      return this.names[row.uid] || 'Someone';
    },
    ghostCurve() {
      const pref = store.get('lsl-ghost', null);
      if (this.live && this.rows.length) {
        const row = (pref && this.rows.find((r) => r.uid === pref)) || this.rows.find((r) => r.uid !== this.uid) || this.rows[0];
        if (row && Array.isArray(row.curve)) return { label: row.uid === this.uid ? 'Your best' : (this.displayName(row) + ' (ghost)'), curve: row.curve, score: row.score };
      }
      const pb = store.get('lsl-pb-' + WEEK, null);
      if (pb && Array.isArray(pb.curve)) return { label: 'Your best (ghost)', curve: pb.curve, score: pb.score };
      return null;
    }
  };

      // ring

  // ----- Step 3: Making it Happen, capital grab -----
  const HAND_SVG = '<svg viewBox="0 0 120 70" aria-hidden="true"><rect x="0" y="22" width="62" height="26" rx="4" fill="#1d2733"/><rect x="54" y="20" width="10" height="30" fill="#f2efe8"/><path d="M64 18c10-2 22 0 30 4l18-2c4 0 4 6 0 7l-14 2 14 3c4 1 3 7-1 7l-14-1 10 4c3 2 1 6-2 6l-14-3c-10 2-20 2-27-1z" fill="#e0b896"/></svg>';
  const SRC_COLOR = { corporate: '#d3a649', names: '#e9d3a0', pe: '#f0a35c', family: '#c9e08a', qs: '#9fd0ff', agency: '#d3a649' };

  // Floating capital tokens: flick or drag them into the vault (or tap) before rival hands snatch them.
  // Used by the opening Capital Grab and by the mini grab when coming into line.
  function makeCapitalField(o) {
    const F = { tokens: [], elapsed: 0, closed: false };
    F.spawn = (offer) => {
      const fw = o.field.clientWidth, fh = o.field.clientHeight;
      const size = fw < 400 ? 92 : 112;
      const line = offer.kind === 'line';
      const amtTxt = line ? Math.round(offer.line * 100) + '% share' : offer.qs ? '−25% ECA' : '£' + offer.amt.toFixed(0) + 'm';
      const rateTxt = line ? 'fee ' + +(offer.fee * 100).toFixed(2) + '% · PC ' + +(offer.pc * 100).toFixed(1) + '%' : offer.qs ? 'cedes 25%' : Math.round(offer.rate * 100) + '% a year';
      const n = el('<button class="token' + (line ? ' line' : '') + (offer.trap ? ' trap' : '') + (offer.qs ? ' qs' : '') + '" style="--tc:' + (offer.color || SRC_COLOR[offer.src]) + '" title="' + esc(offer.hint || offer.label) + '"><b>' + amtTxt + '</b><span>' + esc(offer.label) + '</span><em>' + rateTxt + '</em></button>');
      o.field.appendChild(n);
      const tok = { o: offer, n, age: 0, x: 8 + rand() * Math.max(10, fw - size - 16), y: fh + 10, size, fh, dragging: false, gone: false };
      F.tokens.push(tok);
      draggable(n, {
        enabled: () => !tok.gone && !F.closed,
        onStart: () => { tok.dragging = true; },
        onMove: (dx, dy, e) => { n.style.transform = 'translate(' + (tok.x + dx) + 'px,' + (tok.y + dy) + 'px) scale(1.06)'; o.vault.classList.toggle('drop', !!dropTarget(e.clientX, e.clientY, '#' + o.vault.id, n)); },
        onEnd: (dx, dy, vx, vy, e, cancelled) => {
          tok.dragging = false; o.vault.classList.remove('drop');
          tok.x += dx; tok.y += dy;
          if (!cancelled && (dropTarget(e.clientX, e.clientY, '#' + o.vault.id, n) || vx > 700)) F.grab(tok);
        },
        onTap: () => F.grab(tok)
      });
      if (o.auto) setTimeout(() => { if (!tok.gone && o.auto(offer)) F.grab(tok); }, 400 / SPEED);
    };
    F.grab = (tok) => {
      if (tok.gone || F.closed) return;
      if (o.canGrab && !o.canGrab(tok.o)) { tok.n.classList.remove('nope'); void tok.n.offsetWidth; tok.n.classList.add('nope'); Sound.blip(false); return; }
      tok.gone = true;
      const [vx, vy] = centre(o.vault); const [tx, ty] = centre(tok.n);
      tok.n.animate([{ transform: 'translate(' + tok.x + 'px,' + tok.y + 'px) scale(1)' }, { transform: 'translate(' + (tok.x + vx - tx) + 'px,' + (tok.y + vy - ty) + 'px) scale(.2)', opacity: 0.2 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => tok.n.remove(), 400);
      Sound.kaching(); FX.burst(vx, vy, 'coins', 16);
      o.onGrab(tok.o);
    };
    F.snatch = (tok) => {
      tok.gone = true;
      const fw = o.field.clientWidth;
      const fromLeft = tok.x < fw / 2;
      const h = el('<div class="hand">' + HAND_SVG + '</div>');
      h.style.top = tok.y + tok.size / 2 - 35 + 'px';
      h.style.left = fromLeft ? '-130px' : fw + 10 + 'px';
      if (!fromLeft) h.firstElementChild.style.transform = 'scaleX(-1)';
      o.field.appendChild(h);
      const reach = fromLeft ? tok.x + 10 : -(fw - tok.x - tok.size + 20);
      requestAnimationFrame(() => { h.style.transform = 'translateX(' + (fromLeft ? reach + 130 : reach - 10) + 'px)'; });
      setTimeout(() => { tok.n.classList.add('taken'); h.style.transform = 'translateX(0)'; }, 420);
      setTimeout(() => { tok.n.remove(); h.remove(); }, 900);
      if (o.onSnatch) o.onSnatch(tok.o);
    };
    F.update = (dt) => {
      if (F.closed) return;
      F.elapsed += dt;
      for (const offer of o.offers) if (!offer.spawned && F.elapsed >= offer.appearAt) { offer.spawned = true; F.spawn(offer); }
      for (const tok of F.tokens) {
        if (tok.gone || tok.dragging) continue;
        tok.age += dt;
        const k = tok.age / tok.o.life;
        tok.y = lerp(tok.fh - tok.size * 0.6, -tok.size * 0.3, Math.min(1, k)) + Math.sin(tok.age * 2 + tok.x) * 4;
        tok.n.style.transform = 'translate(' + tok.x + 'px,' + tok.y + 'px)';
        if (k >= 1) F.snatch(tok);
      }
    };
    F.exhausted = () => F.elapsed > 6 && o.offers.every((x) => x.spawned) && F.tokens.every((t) => t.gone);
    F.close = () => { F.closed = true; };
    return F;
  }

    paint() {

      if (cover > 1 - L + 0.005) segs.push(['surplus', Math.min(0.14, cover - (1 - L)), '', 'Surplus capital: still costs a return']);
      r.querySelector('#stampbar').innerHTML = segs.map(([k, h, c, t]) => '<i class="vseg ' + k + '" style="height:' + ((h / S) * 100).toFixed(2) + '%' + (c ? ';background:' + c : '') + '" title="' + esc(t) + '"></i>').join('');

        '<div class="stephead"><div><span class="eyebrow">Step 3 · Making it Happen</span><h2>Red Tape Rush</h2></div>' +

        '<div class="tape" id="tape"></div></section>');

      return root;
    },
    show(fm) {
      fm.state = 'live';
      const n = el('<div class="form"><h4>' + esc(fm.f.title) + '</h4><div>Miss it: <b>' + esc(fm.f.miss) + '</b></div><div class="life"><i></i></div>' +
        '<div class="signbox"><canvas></canvas><span>Sign here ✕</span></div><div class="row"><span>' + G.no + ' · ' + esc(E.AUS[G.au].name) + '</span><button class="btn signbtn">Sign</button></div></div>');
      this.root.querySelector('#tape').appendChild(n);
      fm.n = n;
      const box = n.querySelector('.signbox'), cv = n.querySelector('canvas');
      const fit = () => { cv.width = box.clientWidth * 2; cv.height = box.clientHeight * 2; };
      fit();
      const g = cv.getContext('2d'); g.scale(2, 2); g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = '#1b2a6b';
      let last = null;
      box.addEventListener('pointerdown', (e) => { if (fm.state !== 'live') return; try { box.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } const r = box.getBoundingClientRect(); last = [e.clientX - r.left, e.clientY - r.top]; Sound.scratch(); });
      box.addEventListener('pointermove', (e) => {
        if (!last || fm.state !== 'live') return;
        const r = box.getBoundingClientRect(); const p = [e.clientX - r.left, e.clientY - r.top];
        g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
        fm.len += Math.hypot(p[0] - last[0], p[1] - last[1]); last = p;
        if (fm.len > 120) this.sign(fm, false);
      });
      box.addEventListener('pointerup', () => { last = null; });
      n.querySelector('.signbtn').addEventListener('click', () => this.sign(fm, true));
      if (AUTO) setTimeout(() => this.sign(fm, true), 500 / SPEED);
    },
    sign(fm, auto) {
      if (fm.state !== 'live') return;
      fm.state = 'signed';
      if (auto) {
        const cv = fm.n.querySelector('canvas'), g = cv.getContext('2d');
        g.beginPath(); const w = cv.width / 2, h = cv.height / 2;
        for (let i = 0; i <= 40; i++) { const x = 10 + i * (w - 30) / 40, y = h * 0.55 + Math.sin(i * 0.9) * h * 0.25 * (1 - i / 50); i ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.stroke();
      }
      Sound.scratch();
      fm.n.classList.add('done');
      slamStamp(fm.n, 'Signed', { pos: 'right:10px;top:12px', rot: 8, shake: false, blue: true });
    },
    update(dt) {
      if (this.done) return;
      this.elapsed += dt;
      for (const fm of this.forms) {
        if (fm.state === 'wait' && this.elapsed >= fm.at) this.show(fm);
        if (fm.state === 'live') {
          fm.age += dt;
          fm.n.querySelector('.life i').style.transform = 'scaleX(' + Math.max(0, 1 - fm.age / fm.life) + ')';
          if (fm.age >= fm.life) { fm.state = 'missed'; fm.n.classList.add('missed'); slamStamp(fm.n, 'Missed', { pos: 'right:10px;top:12px', rot: -8, shake: false }); Sound.blip(false); }
        }
      }
      if (this.forms.every((f) => f.state === 'signed' || f.state === 'missed')) this.finish();
    },
    finish() {
      if (this.done) return;
      this.done = true;
      for (const fm of this.forms) {

      }
      recomputeCapital();
      setTimeout(() => this.permission(), 700 / SPEED);
    },
    permission() {

        '<dt>Syndicate</dt><dd>' + G.no + ' · ' + esc(G.name) + '</dd><dt>Year of account</dt><dd>' + yoaName(0) + '</dd>' +
        '<dt>Funds at Lloyd’s</dt><dd>£' + G.fal.toFixed(1) + 'm (yours £' + G.alignedFal.toFixed(1) + 'm)</dd><dt>ECA</dt><dd>£' + G.eca.toFixed(1) + 'm</dd><dt>Capacity</dt><dd>£' + G.capacity.toFixed(0) + 'm</dd>' +
        '<dt>Members</dt><dd>Your agency ' + Math.round(G.aligned * 100) + '%' + G.members.map((x) => ' · ' + esc(x.short) + ' ' + Math.round(x.share * 100) + '%').join('') + '</dd></dl></div></div>');
      const o = overlay(body);
      setTimeout(() => {
        slamStamp(body.querySelector('#ptu'), 'Permission to underwrite<small>Council of Lloyd’s</small>', { pos: 'left:12%;top:40%', rot: -8 });
        setTimeout(() => { Sound.bell(2); const [x, y] = centre(body); FX.burst(x, y, 'confetti', 60); }, 300);

          e.forecasted = true;
          toast('Forecast: ' + E.RDS[e.rds].name, (E.RDS[e.rds].forecast || '') + ' Check your RDS Board.', 'var(--bad)', 5);
          this.tick('FORECAST · ' + (E.RDS[e.rds].forecast || E.RDS[e.rds].name).toUpperCase());
          this.eventPin(e);
          this.root.querySelector('#rdsBtn').classList.add('hot');
        }
      }
      const ev = G.market.events.find((e) => e.month === abs && !e.done);
      if (ev && m < 12) { this.eventPin(ev); this.openRDS({ mode: 'event', e: ev }); return true; }
      for (let s = 2 * y; s < 2 * y + 2; s++) if (m === G.evPlan.slots[s].month && !this.flags['ev' + s]) { this.flags['ev' + s] = true; if (this.openEvent(s)) return true; }
      if (m === 2 && !this.flags.q1) { this.flags.q1 = true; this.q1Review(); return true; }
      if (m === 4 && !this.flags.alert) { this.flags.alert = true; if (this.triggerAlert()) return true; }
      if (m === 6 && !this.flags.mid) { this.flags.mid = true; this.startMid(); return true; }
      if (m === 8 && y < 2 && !this.flags.sbf) { this.flags.sbf = true; this.openPlanning(); return true; }
      if (m === 11 && y < 2 && !this.flags.cil) { this.flags.cil = true; this.openCIL(); return true; }
      if (m >= 12 && !this.flags.annual) { this.flags.annual = true; this.openAnnual(); return true; }
      return false;
    },
    showFF() {
      const box = this.root.querySelector('#slotArea');
      this.root.querySelector('#brokerRow').innerHTML = '';
      this.root.querySelector('#clock').hidden = true;
      const abs = this.abs();
      const live = G.entries.filter((e) => e.start <= abs && e.start + 12 > abs && !(e.alert === 'exit' && e.alertMonth <= abs));
      const onRisk = live.reduce((s, e) => s + e.P, 0);
      const w = this.worstRDS();
      box.innerHTML = '<div class="ffpanel"><span class="eyebrow">Fast-forwarding</span><div class="ffmonth" id="ffMonth">' + MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y) + '</div>' +
        '<p>On risk: <b class="num">' + fmtM(onRisk) + '</b> across ' + live.length + ' portfolios' + (w ? ' · biggest RDS: <b>' + esc(E.RDS[w.r].name) + '</b> at ' + Math.round(w.pct * 100) + '% of appetite' : '') + '.</p></div>';
    },
    setActions(on) {
      const a = this.root.querySelector('#actions');
      a.style.visibility = on ? 'visible' : 'hidden';
    },

    // ---- the race and the HUD ----
    renderDerby() {
      const lanes = [['you', 'You · ' + G.no], ['nemesis', E.RIVALS[G.nemesis].name], ['rival2', E.RIVALS[G.rival2].name]];
      if (G.ghost) lanes.push(['ghost', G.ghost.label]);
      this.root.querySelector('#derby').innerHTML = lanes.map(([k, name]) => '<button class="lane ' + k + '" data-lane="' + k + '" style="--lc:' + LANE_COLORS[k] + '"><span class="ln">' + esc(name) + '</span><span class="track"><span class="zero"></span><span class="runner">' + (k === 'you' ? 'U' : k === 'ghost' ? '' : name[0]) + '</span></span><span class="lv num">£0.0m</span></button>').join('');
      this.root.querySelectorAll('.lane').forEach((ln) => ln.addEventListener('click', () => { const k = ln.dataset.lane; if (k === 'nemesis' || k === 'rival2') this.trash(k); }));
    },
    trash(k) {
      const id = k === 'nemesis' ? G.nemesis : G.rival2;
      const rv = E.RIVALS[id];
      const line = pick(rv.talk);
      const lane = this.root.querySelector('.lane.' + k);
      if (!lane) return;
      lane.querySelectorAll('.talk').forEach((t) => t.remove());
      const b = el('<span class="talk"><span class="bubble">' + esc(line) + '</span></span>');
      lane.appendChild(b);
      setTimeout(() => b.remove(), 3500);
      this.tick(rv.name.toUpperCase() + ': “' + line + '”');
    },
    curveAt(curve, abs) {
      if (!curve || !curve.length) return 0;
      const i = Math.min(curve.length - 1, Math.floor(abs)), f = abs - Math.floor(abs);
      if (abs >= curve.length) return curve[curve.length - 1];
      return lerp(i > 0 ? curve[i - 1] : 0, curve[i], f);
    },
    live() { return E.scoreGame(G.entries, gameOpts()); },
    updateRace() {
      const res = this.live();
      this.res = res;
      const abs = this.abs();
      const vals = { you: this.curveAt(res.curve, abs), nemesis: this.curveAt(G.rivalRuns[G.nemesis].curve, abs), rival2: this.curveAt(G.rivalRuns[G.rival2].curve, abs) };
      if (G.ghost) vals.ghost = this.curveAt(G.ghost.curve, abs);
      const all = Object.values(vals);
      const lo = Math.min(-15, ...all) - 3, hi = Math.max(15, ...all) + 3;
      const pos = (v) => ((v - lo) / (hi - lo)) * 100;
      for (const k in vals) {
        const ln = this.root.querySelector('.lane.' + k); if (!ln) continue;
        ln.querySelector('.runner').style.left = pos(vals[k]) + '%';
        ln.querySelector('.zero').style.left = pos(0) + '%';
        ln.querySelector('.lv').textContent = fmtM(vals[k], true);
      }
      // capital: FAL plus funds held in the syndicate, against the solvency line
      const Y = this.Y;
      const i = Math.max(0, Math.min(res.uwCurve.length - 1, Math.floor(abs) - 1));
      const uwNow = abs < 1 ? 0 : res.uwCurve[i] || 0;
      const capNow = Y.fal + falExtra() + uwNow, scale = Y.eca * 1.6;
      this.cap = { fal: Y.fal, mine: Y.alignedFal != null ? Y.alignedFal : Y.fal, held: uwNow, calls: falExtra(), now: capNow };
      this.root.querySelector('#hCap').textContent = '£' + capNow.toFixed(0) + 'm';
      const cb = this.root.querySelector('#hCapBar');
      cb.style.width = Math.max(0, Math.min(100, (capNow / scale) * 100)) + '%';
      cb.style.background = capNow < Y.eca * E.SOLVENCY_LINE ? 'var(--bad)' : capNow < Y.eca - 0.05 ? 'var(--warn)' : 'var(--good)';
      this.root.querySelector('#hCapLine').style.left = ((Y.eca * E.SOLVENCY_LINE) / scale) * 100 + '%';
      this.root.querySelector('#hEcaLine').style.left = (Y.eca / scale) * 100 + '%';
      const bt = yoaTot(this.y), gr = bt / Y.capacity;
      this.root.querySelector('#hGwp').textContent = '£' + bt.toFixed(0) + '/' + Y.capacity.toFixed(0) + 'm';
      const gb = this.root.querySelector('#hGwpBar');
      gb.style.width = Math.min(100, (bt / (Y.capacity * 1.3)) * 100) + '%';
      gb.style.background = gr > 1.2 ? 'var(--bad)' : gr > E.ON_PLAN.hi ? 'var(--warn)' : gr >= E.ON_PLAN.lo ? 'var(--good)' : 'var(--crane)';
      this.root.querySelector('#hGwpLine').style.left = (1 / 1.3) * 100 + '%';
      // plan and written side by side, in plan order; classes outside the plan are hatched
      const md = this.mixData();
      this.root.querySelector('#hPlan').innerHTML = md.rows.filter((r) => r.plan > 0).map((r) => '<i style="width:' + r.plan * 100 + '%;--c:' + clsColor(r.k) + '"></i>').join('');
      this.root.querySelector('#hBound').innerHTML = md.bt ? md.rows.filter((r) => r.wrote > 0).map((r) => '<i class="' + (r.off ? 'offplan' : '') + '" style="width:' + r.wrote * 100 + '%;--c:' + clsColor(r.k) + '"></i>').join('') : '';
      const dr = Math.round(md.drift), hd = this.root.querySelector('#hDrift');
      hd.innerHTML = md.bt ? dr + '% off<span class="wide"> plan</span>' : 'nothing yet';
      // stay neutral until enough is written to judge (the Q1 review ignores the mix below 30% of plan)
      hd.style.color = !md.bt || md.bt < Y.capacity * 0.3 ? '' : dr <= E.ON_PLAN.drift ? 'var(--good)' : dr <= 35 ? 'var(--warn)' : '#ffb3a6';
      const wr = this.worstRDS();
      const rb = this.root.querySelector('#rdsBtn');
      this.root.querySelector('#rdsTxt').innerHTML = wr ? 'RDS ' + Math.round(wr.pct * 100) + '%<small>of appetite</small>' : 'RDS';
      const rdsWhat = wr ? 'Biggest disaster scenario: ' + E.RDS[wr.r].name + ' at ' + Math.round(wr.pct * 100) + '% of your appetite' : 'Realistic Disaster Scenarios: nothing on risk yet';
      rb.title = rdsWhat; rb.setAttribute('aria-label', rdsWhat + '. Open the RDS Board');
      rb.classList.toggle('over', !!wr && wr.pct > 1);
      rb.style.setProperty('--heat', wr ? Math.min(1, wr.pct).toFixed(2) : 0);
      if (this.phase === 'ff') { const fm = this.root.querySelector('#ffMonth'); if (fm) fm.textContent = MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y); }
      return vals;
    },
    // this year's written mix against the plan; drift is the share of written premium sitting in different classes from the plan
    mixData(extra) {
      const w = E.weights(this.Y.split), bound = {};
      yoaEntries(this.y).forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
      if (extra) bound[extra.cls] = (bound[extra.cls] || 0) + extra.P;
      const bt = Object.values(bound).reduce((s, v) => s + v, 0);
      const rows = Object.keys(w).concat(Object.keys(bound).filter((k) => !(k in w))).map((k) => ({ k, plan: w[k] || 0, wrote: bt ? (bound[k] || 0) / bt : 0, off: !(k in w) }));
      return { rows, bt, drift: bt ? rows.reduce((s, r) => s + Math.abs(r.wrote - r.plan), 0) * 50 : 0 };
    },
    drift() { return this.mixData().drift; },
    // a small card under a HUD gauge; tapping the same gauge again closes it
    hudPop(anchor, cls, html) {
      const old = this.root.querySelector('.popover.' + cls);
      this.root.querySelectorAll('.popover').forEach((p) => p.remove());
      if (old) return null;
      const p = el('<div class="popover hudpop ' + cls + '" role="dialog">' + html + '<div class="row"><button class="btn ghost" data-a="close">Close</button></div></div>');
      const hud = this.root.querySelector('.hud');
      hud.style.position = 'relative';
      hud.appendChild(p);
      p.style.top = 'calc(100% + 6px)';
      p.style.left = Math.max(0, Math.min(anchor.offsetLeft, hud.clientWidth - p.offsetWidth)) + 'px';
      p.querySelector('[data-a="close"]').addEventListener('click', () => p.remove());
      const off = (e) => {
        if (p.isConnected && (p.contains(e.target) || anchor.contains(e.target))) return;
        p.remove(); removeEventListener('pointerdown', off, true);
      };
      setTimeout(() => addEventListener('pointerdown', off, true), 0);
      return p;
    },
    capInfo() {
      const Y = this.Y, c = this.cap || { fal: Y.fal, mine: Y.fal, held: 0, calls: 0, now: Y.fal };
      const row = (l, v, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + l + '</td><td class="num">' + v + '</td></tr>';
      this.hudPop(this.root.querySelector('#capGauge'), 'cappop', '<h4>Capital · YoA ' + yoaName(this.y) + '</h4><table>' +
        row('Funds at Lloyd’s (FAL)' + (c.fal - c.mine > 0.05 ? '<small> yours ' + fmtM(c.mine) + ', members ' + fmtM(c.fal - c.mine) + '</small>' : ''), fmtM(c.fal)) +
        row('Funds in Syndicate<small> results held in your open years</small>', fmtM(c.held, true)) +
        (c.calls > 0.05 ? row('Cash calls paid', fmtM(c.calls)) : '') +
        row('Capital now', fmtM(c.now), 'tot') +
        row('ECA<small> what Lloyd’s requires for this stamp (SCR × 1.35)</small>', fmtM(Y.eca)) +
        row('Solvency line<small> 60% of ECA</small>', fmtM(Y.eca * E.SOLVENCY_LINE)) + '</table>' +
        '<p>Fall below the solvency line after a catastrophe and Lloyd’s makes a cash call. In November, your capital must cover next year’s ECA (coming into line).</p>');
    },
    gwpInfo() {
      const Y = this.Y, bt = yoaTot(this.y), edges = [85, 115, 120].includes(Math.round((bt / Y.capacity) * 100));
      const pc = (x) => (edges ? (x * 100).toFixed(1) : Math.round(x * 100)) + '%';
      this.hudPop(this.root.querySelector('#gwpGauge'), 'gwppop', '<h4>Premium · YoA ' + yoaName(this.y) + '</h4>' +
        '<p>Gross written premium (GWP) so far: <b class="num">' + fmtM(bt) + '</b> of your <b class="num">£' + Y.capacity.toFixed(0) + 'm</b> stamp (' + pc(bt / Y.capacity) + ').</p>' +
        '<ul class="rules"><li><b>85–115%</b> (shaded): on plan. With your mix within ' + E.ON_PLAN.drift + '%, the year earns <b>+£0.5m (+500 points)</b>.</li><li><b>Over 120%</b> (red tick): a PMD letter, <b>−£1.0m (−1,000 points)</b>.</li><li><b>130%</b>: the end of the bar. No more lines this year.</li></ul>');
    },
    mixInfo() {
      const md = this.mixData(), dr = Math.round(md.drift);
      const pc = (x) => Math.round(x * 100) + '%';
      const rows = md.rows.map((r) => {
        const d = Math.round((r.wrote - r.plan) * 100);
        return '<tr><td><i style="background:' + clsColor(r.k) + '"></i>' + esc(E.CLASSES[r.k].short) + (r.off ? ' <small>not in plan</small>' : '') + '</td><td class="num">' + pc(r.plan) + '</td><td class="num">' + (md.bt ? pc(r.wrote) : '–') + '</td>' +
          '<td class="num ' + (d > 2 ? 'over' : d < -2 ? 'under' : '') + '">' + (md.bt ? (d > 0 ? '+' : d < 0 ? '−' : '±') + Math.abs(d) : '') + '</td></tr>';
      }).join('');
      this.hudPop(this.root.querySelector('#mixGauge'), 'mixpop', '<h4>Your mix vs plan · YoA ' + yoaName(this.y) + '</h4>' +
        '<table><thead><tr><th>Class</th><th>Plan</th><th>Written</th><th>Gap</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<p>' + (md.bt ? '<b>' + dr + '%</b> of the premium you’ve written is in different classes from your plan.' : 'Nothing written yet this year.') + ' Within ' + E.ON_PLAN.drift + '% (green), with premium at 85–115% of the stamp: on plan, <b>+£0.5m (+500 points)</b>. Over 35% at the Q1 review: a PMD letter.</p>');
    },
    rdsState(abs) {
      const at = abs == null ? Math.floor(this.abs()) : abs;
      const gross = E.rdsExposure(G.entries, at);
      const appetite = E.rdsAppetite(this.Y.split, this.Y.capacity, this.Y.fal);
      const out = this.Y.outwards || [];
      const rows = Object.keys(gross).map((r) => ({ r, gross: gross[r], net: gross[r] * (out.includes(r) ? 0.5 : 1), appetite: appetite[r], shielded: out.includes(r) }));
      rows.forEach((x) => { x.pct = x.net / x.appetite; });
      return { rows: rows.sort((a, b) => b.gross - a.gross), appetite };
    },
    worstRDS() {
      const st = this.rdsState();
      let w = null; for (const x of st.rows) if (!w || x.pct > w.pct) w = x;
      return w;
    },

    // ---- ticker ----
    tick(msg) {
      this.tickQ.push(msg);
      if (this.tickQ.length > 4) this.tickQ.splice(0, this.tickQ.length - 4);
      if (!this.tickBusy) this.runTicker();
    },
    runTicker() {
      const box = this.root && this.root.querySelector('#ticker');
      if (!box || !this.tickQ.length) { this.tickBusy = false; return; }
      this.tickBusy = true;
      const s = el('<span>' + esc(this.tickQ.shift()) + '</span>');
      box.innerHTML = ''; box.appendChild(s);
      const w = box.clientWidth, sw = s.offsetWidth;
      const a = s.animate([{ transform: 'translateX(' + w + 'px)' }, { transform: 'translateX(' + -sw + 'px)' }], { duration: REDUCED ? 4000 : ((w + sw) / 90) * 1000, easing: 'linear' });
      a.onfinish = () => this.runTicker();
    },

    // ---- the renewal windows: 1.1 rush and the 1.7 window ----
    startRush() {
      const y = this.y, Y = this.Y;
      if (y === 0 && G.racehorse && !G.entries.some((e) => e.deal.forced)) {
        const e = { deal: Object.assign({}, E.RACEHORSE), P: 2.5, start: 0, yoa: 0, line: 1 };
        G.entries.push(e); this.addBinder(e);
      }
      const renewed = yoaEntries(y).filter((e) => e.deal.window === '1.1').reduce((s, e) => s + e.P, 0);
      const n = E.deckSize(G.au, y, '1.1');
      this.deck = E.makeDeck(G.season, Y.split, G.au, y, '1.1', E.deckScale(Y.capacity, '1.1', renewed, n), 'player', G.market);
      // a broker you refused (or half-refused) on commission keeps some slips away
      const sn = G.snub[y];
      if (sn) {
        const before = this.deck.length;
        this.deck = this.deck.filter((d, i) => d.broker !== sn.broker || (sn.half && i % 2 === 0));
        if (this.deck.length < before) toast(E.BROKERS[sn.broker].name + ' is sulking', (before - this.deck.length) + (before - this.deck.length > 1 ? ' slips' : ' slip') + ' went to a more generous market.', 'var(--warn)', 4);
      }
      this.deckIdx = 0;
      this.clockMax = this.clock = Math.max(18, 32 - (y === 0 ? (G.rushPenalty || 0) : 0));
      if (y === 0 && G.rushPenalty) toast('Late permission: −' + (32 - this.clockMax) + 's on the clock', (G.rushWhy || []).join('. ') + '.', 'var(--warn)', 5);
      this.nextAt = this.t + 0.6;
      this.setPhase('rush', '31 December · the 1.1 renewals');
      this.root.querySelector('#clock').hidden = false;
      this.paintClock();
      this.setActions(true);
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">Brokers are queuing at your box…</p>';
      if (G.favours.lunch) this.root.querySelector('.favour[data-f="lunch"]').classList.remove('used');
    },
    startMid() {
      const y = this.y, Y = this.Y;
      const renewed = yoaEntries(y).filter((e) => e.deal.window === '1.7').reduce((s, e) => s + e.P, 0);
      const n = E.deckSize(G.au, y, '1.7');
      this.deck = E.makeDeck(G.season, Y.split, G.au, y, '1.7', E.deckScale(Y.capacity, '1.7', renewed, n), 'player', G.market);
      this.deckIdx = 0;
      this.clockMax = this.clock = 16;
      this.nextAt = this.t + 0.4;
      this.setPhase('mid17', '1 July · the mid-year window');
      this.root.querySelector('#clock').hidden = false;
      this.paintClock();
      this.setActions(true);
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">A few mid-year renewals…</p>';
      toast('1.7 renewals', 'A small window for mid-year business, mostly property cat.', 'var(--brass)');
    },
    paintClock() {
      const c = this.root.querySelector('#clock');
      const s = Math.max(0, Math.ceil(this.clock));
      if (this.phase === 'rush') c.textContent = s > 0 ? '23:59:' + String(60 - s).padStart(2, '0') : '00:00:00';
      else c.textContent = '1 JUL · ' + s + 's';
      c.classList.toggle('hot', this.clock < 6);
      if (this.phase === 'rush') this.journey();
    },
    endWindow() {
      const left = this.deck.length - this.deckIdx + (this.cur && !this.cur.busy ? 1 : 0);
      if (this.cur && !this.cur.busy) this.walk(true);
      this.root.querySelector('#clock').hidden = true;
      this.setActions(false);
      if (this.phase === 'rush') {
        Sound.bell(2);
        const [x, y] = centre(this.root.querySelector('#box')); FX.burst(x, y, 'confetti', 80);
        toast('Happy New Year from the Room', left > 0 ? left + ' slips missed the midnight deadline.' : 'Every slip got an answer before midnight.', 'var(--brass)');
        this.tick('00:00 · 1 JANUARY ' + yoaName(this.y) + ' · YOA ' + yoaName(this.y) + ' INCEPTS · ' + G.no + ' WROTE ' + fmtM(yoaTot(this.y)).toUpperCase());
        setTimeout(() => { this.clearDeal(); this.openRDS({ mode: 'outwards' }); }, 900 / SPEED);
        this.setPhase('outwards', '1 January · buy your outwards');
      } else {
        this.clearDeal();
        this.resumeFF();
      }
    },
    present() {
      if (this.deckIdx >= this.deck.length) return;
      const d0 = this.deck[this.deckIdx++];
      const d = Object.assign({}, d0, { tells: Object.assign({}, d0.tells) });
      if (G.hotLeft > 0) { d.q = Math.max(0.55, d.q * 0.9); d.base = E.round1(d.base * 1.15); G.hotLeft--; d.hot = true; }
      const b = E.BROKERS[d.broker];
      const room = this.Y.capacity * 1.3 - yoaTot(this.y);
      let blocked = null;
      if (d.structure === 'binder' && this.y === 0 && this.phase === 'rush' && G.atlasBlock) blocked = 'Coverholder not yet approved in ATLAS. Decline only.';
      else if (room < 0.5) blocked = 'Stamp capacity full. Decline only.';
      this.cur = { d, patience: 1, total: 13 * b.patience * (G.au === 'veteran' ? 1.4 : 1), revealed: [false, false, false], shownAt: this.t, lunch: false, blocked, busy: false };
      const row = this.root.querySelector('#brokerRow');
      row.innerHTML = '<div class="face">' + face(d.broker) + '</div><div class="who"><span class="bname">' + esc(b.name) + '<small>' + esc(b.firm) + '</small></span><div class="bubble">' + esc(E.brokerLine(d)) + '</div><div class="patience"><i id="pat"></i></div></div>';
      this.renderSlip();
      this.root.querySelectorAll('.actions [data-line]').forEach((btn) => { btn.disabled = !!blocked && btn.dataset.line !== '0'; });
      Sound.tick();
      if (!store.get('lsl-coached-v2', false) && !AUTO) this.coach();
      if (AUTO) setTimeout(() => {
        if (this.cur && this.cur.d === d && !this.cur.busy) {
          const pol = E.POLICIES[AUTO] || E.POLICIES.skilled;
          const bound = {}; yoaEntries(this.y).forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
          const line = pol(d, { au: G.au, r: E.rng('auto|' + d.id), boundTot: yoaTot(this.y), capacity: this.Y.capacity, rdsLoad: E.rdsExposure(G.entries, this.abs()), appetite: E.rdsAppetite(this.Y.split, this.Y.capacity, this.Y.fal), bound, w: E.weights(this.Y.split) });
          this.decide(blocked ? 0 : line);
        }
      }, 700 / SPEED);
    },
    coach() {
      store.set('lsl-coached-v2', true);
      this.over = true;
      const box = this.root.querySelector('#box');
      const c = el('<div class="coach" role="dialog"><h4>Your first slip</h4><p><b>Drag the slip</b>: left to decline, down for a small line, right for a big line. Or use the buttons, or ← ↓ →.</p><p>Tap the <b>small print</b> to read it, but the broker’s patience drops. The <b>RDS line</b> shows which disaster scenario it adds to.</p><button class="btn primary">Got it</button></div>');
      box.appendChild(c);
      c.querySelector('button').addEventListener('click', () => { c.remove(); this.over = false; });
      c.querySelector('button').focus({ preventScroll: true });
    },
    tellHTML(i) {
      const d = this.cur.d, c = E.CLASSES[d.cls], open = this.cur.revealed[i];
      const names = ['Loss history', 'Rate change', 'Growth'];
      if (!open) return '<button class="tell" data-t="' + i + '">' + names[i] + '<span class="redact"></span></button>';
      let v, cls = '';
      if (i === 0) { v = d.tells.hist; cls = v === 'Clean' ? 'good' : v === 'Ugly' ? 'bad' : ''; }
      if (i === 1) { v = (d.tells.rate > 0 ? '+' : '') + d.tells.rate + '%'; const ref = c.rate * 0.5; cls = d.tells.rate > ref + 3 ? 'good' : d.tells.rate < ref - 3 ? 'bad' : ''; }
      if (i === 2) { v = '+' + d.tells.growth + '%'; cls = d.tells.growth > 40 ? 'bad' : d.tells.growth < 15 ? 'good' : ''; }
      return '<button class="tell ' + cls + '" data-t="' + i + '" disabled>' + names[i] + '<b>' + v + '</b></button>';
    },
    insightHTML() {
      const c = this.cur, d = c.d;
      if (c.lunch) return '<div class="insight" style="--c:' + (d.q < 0.95 ? 'var(--good)' : d.q < 1.05 ? 'var(--warn)' : 'var(--bad)') + '"><span class="pip"></span>Over a long lunch: this book is ' + qualityWord(d.q) + '. Price adequacy ' + Math.round(100 / d.q) + '%.</div>';
      if (G.au === 'quant') return '<div class="insight" style="--c:' + (d.adequacy >= 103 ? 'var(--good)' : d.adequacy <= 95 ? 'var(--bad)' : 'var(--warn)') + '"><span class="pip"></span>The Quant: price adequacy ' + d.adequacy + '%</div>';
      if (G.au === 'forensic') return '<div class="insight" style="--c:' + ({ A: 'var(--good)', B: 'var(--good)', C: 'var(--warn)', D: 'var(--bad)' })[d.grade] + '"><span class="pip"></span>The Forensic: audit grade ' + d.grade + '</div>';
      if (G.au === 'veteran') {
        const t = { good: ['var(--good)', 'Gut feel: the broker isn’t bluffing.'], meh: ['var(--warn)', 'Gut feel: nothing either way.'], bad: ['var(--bad)', 'Gut feel: you’ve seen this one before. It ended badly.'] }[d.gut];
        return '<div class="insight" style="--c:' + t[0] + '"><span class="pip"></span>' + t[1] + '</div>';
      }
      return '<div class="insight"><span class="pip"></span>The Rainmaker: “I know their cousin. Lovely family.”</div>';
    },
    rdsLine(d) {
      const st = this.rdsState(this.phase === 'mid17' ? 12 * this.y + 6 : 12 * this.y);
      const main = Object.keys(d.rds).sort((a, b) => d.rds[b] - d.rds[a])[0];
      if (!main) return '';
      const f = d.rds[main];
      const row = st.rows.find((x) => x.r === main);
