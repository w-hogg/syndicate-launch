  // ---------- deals ----------
  function tellsFor(q, c, r) {
    const z = (q - 1) / 0.2 + r.normal(0, 0.8);
    const hist = z < -0.4 ? 'Clean' : z > 0.6 ? 'Ugly' : 'Patchy';
    const rate = Math.round(-(q - 1) * 35 + r.normal(0, 4) + c.rate * 0.5);
    const growth = Math.max(0, Math.round(15 + (q - 1) * 120 + r.normal(0, 18)));
    const adequacy = Math.round(100 / q + r.normal(0, 3));
    const gq = q + r.normal(0, 0.05);
    const grade = gq < 0.85 ? 'A' : gq < 1.0 ? 'B' : gq < 1.15 ? 'C' : 'D';
    const gutScore = (q - 1) + r.normal(0, 0.08);
    const gut = gutScore < -0.06 ? 'good' : gutScore > 0.08 ? 'bad' : 'meh';
    return { tells: { hist, rate, growth }, adequacy, grade, gut };
  }
  const cycleQ = (qBase, idx) => clamp(qBase * Math.exp(-0.9 * idx), 0.5, 1.8);

  // Slips per window: renewals carry most of the book after year 1, so later 1.1 rushes are shorter.
  const deckSize = (auId, year, win) => (win === '1.1' ? (year > 0 ? 7 : 10) : 3) + (auId === 'rainmaker' ? (win === '1.1' ? (year > 0 ? 2 : 3) : 1) : 0);
  // A deck of new business for one renewal window of one year. scale sizes the slips to the plan.
  function makeDeck(season, split, auId, year, win, scale, tag, market) {
    const r = rng('deck|' + season + '|' + splitKey(split) + '|' + auId + '|' + year + '|' + win + '|' + (tag || 'player'));
    const mk = market || weekMarket(season);
    const Y = mk.years[year];
    const w = weights(split);
    const inMix = Object.keys(w);
    const offMix = Object.keys(CLASSES).filter(k => !inMix.includes(k));
    const hasProperty = inMix.some(k => PROPERTY.includes(k));
    const rain = auId === 'rainmaker';
    const n = deckSize(auId, year, win);
    const deck = [];
    for (let i = 0; i < n; i++) {
      const off = r() < 0.15;
      const brokerId = r.weighted([['hal', 20], ['seb', 20], ['fiona', hasProperty ? 15 : 0], ['reggie', 15], ['dev', 15], ['bot', 15]]);
      const b = BROKERS[brokerId];
      let cls;
      if (brokerId === 'fiona') cls = r.weighted(PROPERTY.map(k => [k, w[k] || 0.01]));
      else if (off) cls = r.pick(offMix);
      else cls = r.weighted(inMix.map(k => [k, w[k] * (win === '1.7' && PROPERTY.concat(['energy', 'marine']).includes(k) ? 2.5 : 1)]));
      const c = CLASSES[cls];
      let pool = c.templates.filter(t => t.window === win);
      if (!pool.length) pool = c.templates;
      let tmpl = r.pick(pool);
      if (brokerId === 'fiona') tmpl = c.templates.find(t => t.rds.flw && t.window === win) || tmpl;
      const qBase = clamp(Math.exp(r.normal(b.qBias + (rain ? 0.01 : 0), 0.22)), 0.6, 1.6);
      const q = cycleQ(qBase, Y.rateIdx[cls]);
      const base = round1((5 + 7 * r()) * b.size * (rain ? 1.15 : 1) * scale);
      const comm = clamp(c.comm + r.normal(0, 0.03) + b.commAdj, 0.08, 0.42);
      deck.push(Object.assign({
        id: 'y' + year + 'w' + win + 'd' + i + (tag ? '-' + tag : ''), cls, off: !inMix.includes(cls), label: tmpl.label, tmpl: tmpl.i, rds: tmpl.rds, lrAdj: tmpl.lrAdj,
        structure: tmpl.structure, window: win, year, broker: brokerId, qBase, q, base: Math.max(0.5, base), comm
      }, tellsFor(q, c, r)));
    }
    return deck;
  }

  // Next year's renewal of a bound portfolio: quality drifts, the market moves, the broker quotes a rate change.
  function renewalOffer(entry, market, year) {
    const d = entry.deal;
    const r = rng('renew|' + market.season + '|' + d.id + '|' + year);
    const c = CLASSES[d.cls];
    const qBase = clamp(d.qBase * Math.exp(r.normal(0, 0.07)), 0.55, 1.7);
    const prevIdx = market.years[year - 1].rateIdx[d.cls], idx = market.years[year].rateIdx[d.cls];
    const q = cycleQ(qBase, idx);
    const offered = Math.round((idx - prevIdx) * 100 + r.normal(0, 3));
    return Object.assign({}, d, tellsFor(q, c, r), {
      id: d.id.replace(/^y\d/, 'y' + year) + 'r', year, qBase, q, renewal: true, offeredRate: offered,
      comm: clamp(d.comm + r.normal(0, 0.01), 0.08, 0.42)
    });
  }

  function brokerLine(deal) {
    const q = deal.q;
    if (deal.renewal) return deal.offeredRate >= 0 ? 'Renewal at ' + (deal.offeredRate > 0 ? '+' : '') + deal.offeredRate + '%. Same again?' : 'Renewal at ' + deal.offeredRate + '%. Market’s soft, sorry.';
    switch (deal.broker) {
      case 'hal': return q < 0.95 ? 'This one’s a good’un, I promise.' : q > 1.1 ? 'I’d be careful with this one.' : 'Fair risk, fair price.';
      case 'seb': return 'Cracking risk, honestly.';
      case 'fiona': return 'Sunshine and low-rise, darling. What could go wrong?';
      case 'reggie': return 'Shall we discuss it over lunch?';
      case 'dev': return 'It’s Friday, it’s four o’clock, it’s yours.';
      case 'bot': return 'BEEP. CAPACITY REQUESTED. BEEP.';
    }
    return '';
  }

  const RACEHORSE = {
    id: 'y0racehorse', cls: 'specie', off: true, label: 'The founder’s racehorse (bloodstock binder)', rds: { hst: 1 }, lrAdj: 0.1, structure: 'binder', window: '1.1', year: 0,
    broker: 'reggie', qBase: 1.55, q: 1.55, base: 2.5, comm: 0.3, tells: { hist: 'Ugly', rate: -12, growth: 0 }, adequacy: 64, grade: 'D', gut: 'bad', forced: true
  };

  // attritional loss ratio of a deal in the year it was written
  function dealLR(deal, market) {
    const c = CLASSES[deal.cls];
    const Y = market.years[deal.year || 0];
    return Math.max(0.05, c.lr * deal.q * (1 + Y.shock[deal.cls]) + (deal.lrAdj || 0));
  }
  // RDS appetite agreed in the business plan: at least your FAL, or 110% of the gross exposure your plan implies
  function rdsAppetite(split, capacity, fal) {
    const w = weights(split);
    const planned = {};
    for (const c in w) {
      const ts = CLASSES[c].templates;
      for (const t of ts) for (const r in t.rds) planned[r] = (planned[r] || 0) + capacity * w[c] * t.rds[r] / ts.length;
    }
    const out = {};
    for (const r in RDS) out[r] = Math.max(APPETITE * fal, 1.1 * (planned[r] || 0));
    return out;
  }
  // gross loss estimate for each RDS from the live book at a month (absolute)
  function rdsExposure(entries, month) {
    const out = {};
    for (const e of entries) {
      if (e.start > month || e.start + 12 <= month) continue;
      if (e.alert === 'exit' && e.alertMonth <= month) continue;
      for (const r in e.deal.rds) out[r] = (out[r] || 0) + e.P * e.deal.rds[r];
    }
    return out;
  }

  // ---------- scoring over three years ----------
  // entries: [{deal, P, start (absolute month), yoa, alert, alertMonth}]  (policy runs 12 months from start)
  // o: {market, au, qs, years:[{fal, capital:[{amt,rate}], eca, capacity, split, outwards:[rdsId], outwardsCost}],
  //     ilw:{eventKey:true}, reinsCall:{eventKey:true}, pmd, cashCallChoice:(info)=>'pay'|'runoff', audits}
  function scoreGame(entries, o) {
    const m = o.market, au = o.au;
    const nYears = o.years.length;
    const T = 12 * YEARS;
    const curve = [], uwCurve = [];
    const per = [];
    for (let y = 0; y < YEARS; y++) per.push({ yoa: y, gwp: 0, comm: 0, attr: 0, cat: 0, res: 0, expenses: 0, outwards: 0, ilw: 0, audits: 0, fixed: 0, uwGross: 0, qsTake: 0, uw: 0, capCost: 0, cashCallCost: 0, value: 0, bound: {}, onPlan: false });
    const lines = entries.map(b => ({
      b, lr: dealLR(b.deal, m) * (b.alert === 'ignore' ? 1.35 : 1), cat: 0,
      end: b.alert === 'exit' ? b.alertMonth : b.start + 12
    }));
    for (const l of lines) if (l.b.alert === 'audit' && au !== 'forensic') { per[l.b.yoa].audits += 0.3; }
    const evByMonth = {};
    m.events.forEach(e => { (evByMonth[e.month] = evByMonth[e.month] || []).push(e); });
    let cumUW = 0, worstUW = 0, cashCallCost = 0, runoff = null;
    const cashCalls = [];
    const falNow = (y) => (o.years[Math.min(y, nYears - 1)] || {}).fal || 0;
    let falExtra = 0;
    const net = (x) => x * (o.qs ? 1 - QS_SHARE : 1);
    for (let mo = 0; mo < T; mo++) {
      const y = Math.floor(mo / 12);
      if (y >= nYears) break;
      let uw = 0;
      const Yo = o.years[y];
      if (mo % 12 === 0) {
        const fx = fixedCosts(Yo.capacity || PLAN_GWP, au);
        per[y].fixed = fx;
        per[y].outwards = Yo.outwardsCost || 0;
        uw -= per[y].audits + per[y].outwards;
      }
      uw -= per[y].fixed / 12;
      for (const l of lines) {
        if (mo < l.b.start || mo >= l.end) continue;
        uw += l.b.P * (1 - l.b.deal.comm - l.lr) / 12;
      }
      for (const e of (evByMonth[mo] || [])) {
        const shielded = (Yo.outwards || []).includes(e.rds);
        let gross = 0;
        for (const l of lines) {
          if (mo < l.b.start || mo >= l.end) continue;
          const f = l.b.deal.rds[e.rds];
          if (!f) continue;
          gross += l.b.P * f;
          let loss = l.b.P * f * e.sev;
          if (shielded) loss *= 0.5;
          if (o.ilw && o.ilw[e.key]) loss *= 0.5;
          if (o.reinsCall && o.reinsCall[e.key]) loss *= 0.5;
          l.cat += loss; uw -= loss;
          per[l.b.yoa].cat += loss;
        }
        if (o.ilw && o.ilw[e.key]) { const c = gross * ILW_COST; per[y].ilw += c; uw -= c; }
      }
      cumUW += net(uw);
      worstUW = Math.min(worstUW, cumUW);
      // solvency check after an event month: FAL plus funds held in the syndicate (open-year profits or losses)
      if (evByMonth[mo]) {
        const capitalNow = falNow(y) + falExtra + cumUW;
        const line = SOLVENCY_LINE * (Yo.eca || 0);
        if (capitalNow < line) {
          const topUp = line - capitalNow;
          const choice = o.cashCallChoice ? o.cashCallChoice({ month: mo, year: y, topUp, capitalNow, line, cost: topUp * CASH_CALL_COST }) : 'pay';
          cashCalls.push({ month: mo, year: y, topUp, choice });
          if (choice === 'runoff') runoff = mo;
          else { falExtra += topUp; const cc = topUp * CASH_CALL_COST; cashCallCost += cc; per[y].cashCallCost += cc; }
        }
      }
      const capAccrued = o.years.slice(0, y).reduce((s, Y) => s + Y.capital.reduce((a, c) => a + c.amt * c.rate, 0), 0)
        + Yo.capital.reduce((a, c) => a + c.amt * c.rate, 0) * ((mo % 12) + 1) / 12;
      curve.push(round1(cumUW - capAccrued - cashCallCost));
      uwCurve.push(cumUW);
      if (runoff !== null) break;
    }
    // per-YoA totals; exposure beyond the game (or after run-off) is projected at expected loss, without new catastrophes
    const lastMo = runoff !== null ? runoff + 1 : Math.min(T, 12 * nYears);
    for (const l of lines) {
      const P = per[l.b.yoa];
      const span = l.end - l.b.start;
      const earnedIn = clamp(Math.min(l.end, lastMo) - l.b.start, 0, span);
      const frac = runoff !== null ? earnedIn / 12 : span / 12;
      P.gwp += l.b.P * frac; P.comm += l.b.P * frac * l.b.deal.comm; P.attr += l.b.P * frac * l.lr;
      if (runoff === null && l.b.start + 12 > T) {
        const left = (l.b.start + 12 - T) / 12;
        let exp = 0; for (const r in l.b.deal.rds) exp += l.b.deal.rds[r] * RDS_P[r];
        P.cat += l.b.P * exp * left;
      }
      if (runoff === null && l.end === l.b.start + 12) {
        let rd = m.years[l.b.yoa].resDev[l.b.deal.cls] * l.b.P;
        if (au === 'quant') rd *= 0.5;
        P.res += rd;
      }
      P.bound[l.b.deal.cls] = (P.bound[l.b.deal.cls] || 0) + l.b.P;
    }
    let total = 0, onPlanYears = 0, gwpAll = 0, lossAll = 0;
    for (let y = 0; y < nYears; y++) {
      const P = per[y], Yo = o.years[y];
      if (runoff !== null && 12 * y > runoff) { P.skipped = true; continue; }
      const yearFrac = runoff !== null && runoff < 12 * y + 12 ? (runoff - 12 * y + 1) / 12 : 1;
      P.fixed *= yearFrac;
      P.expenses = P.fixed + P.outwards + P.ilw + P.audits;
      P.uwGross = P.gwp - P.comm - P.attr - P.cat - P.res - P.expenses;
      P.qsTake = o.qs ? P.uwGross * QS_SHARE : 0;
      P.uw = P.uwGross - P.qsTake;
      P.capCost = Yo.capital.reduce((a, c) => a + c.amt * c.rate, 0) * yearFrac + P.cashCallCost;
      P.value = P.uw - P.capCost;
      P.cor = P.gwp > 0 ? (P.comm + P.attr + P.cat + P.res + P.expenses) / P.gwp : 0;
      P.fal = Yo.fal;
      P.roc = Yo.fal > 0 ? P.uw / Yo.fal : 0;
      const bt = Object.values(P.bound).reduce((a, b) => a + b, 0);
      const w = weights(Yo.split);
      let drift = 0;
      for (const k of new Set([...Object.keys(w), ...Object.keys(P.bound)])) drift += Math.abs((bt ? (P.bound[k] || 0) / bt : 0) - (w[k] || 0));
      P.drift = drift * 50; P.boundTot = bt;
      P.onPlan = runoff === null && bt >= Yo.capacity * 0.9 && bt <= Yo.capacity * 1.1 && P.drift <= 10;
      if (P.onPlan) onPlanYears++;

    }
    const pmd = o.pmd || 0;
    const score = Math.round(total * 1000 + onPlanYears * 500 - pmd * 1000);
    if (runoff !== null) while (curve.length < T) { curve.push(curve[curve.length - 1]); uwCurve.push(uwCurve[uwCurve.length - 1]); }
    const uwAll = per.reduce((s, P) => s + (P.skipped ? 0 : P.uw), 0);
    const falAvg = o.years.reduce((s, Y) => s + (Y.fal || 0), 0) / Math.max(1, nYears);
    return {
      per, value: total, score, onPlanYears, pmd, cashCalls, cashCallCost, runoff, curve, uwCurve,
      gwp: gwpAll, cor: gwpAll > 0 ? lossAll / gwpAll : 0, roc: falAvg > 0 ? uwAll / (falAvg * nYears) : 0,
      lines: lines.map(l => ({ id: l.b.deal.id, yoa: l.b.yoa, cls: l.b.deal.cls, P: l.b.P, lr: l.lr, cat: l.cat }))
    };
  }

  // Lloyd's verdict on next year's business plan
  function pmdVerdict(projCOR, ask) {
    if (projCOR > 1.15) return { mult: 0.8, stamp: 'Remediation plan', note: 'Projected combined ratio ' + Math.round(projCOR * 100) + '%. Shrink by 20%.' };
    if (projCOR > 1.05) return { mult: Math.min(ask, 1), stamp: ask > 1 ? 'Hold' : 'Approved', note: ask > 1 ? 'No growth until the numbers improve.' : 'Approved.' };
    if (projCOR > 0.95 && ask > 1.25) return { mult: 1.25, stamp: 'Capped at +25%', note: 'Growth capped while the plan beds in.' };
    return { mult: ask, stamp: 'Approved', note: 'Approved as submitted.' };
  }
  // projected combined ratio of a YoA part-way through its first year
  function projectYoA(entries, market, yoa, month, au) {
    let P = 0, loss = 0;
    for (const e of entries) {
      if (e.yoa !== yoa) continue;
      P += e.P;
      loss += e.P * (e.deal.comm + dealLR(e.deal, market) * (e.alert === 'ignore' ? 1.35 : 1));
      let exp = 0; for (const r in e.deal.rds) exp += e.deal.rds[r] * RDS_P[r];
      const left = clamp((e.start + 12 - month) / 12, 0, 1);

    if (roc >= 0.25) return 'Lloyd’s darling';
    if (roc >= 0.15) return 'Solid franchise';
    if (roc >= 0.05) return 'Keep calm and carry on';

  // ---------- automated players (rivals and the balance sim) ----------
  function estimateQ(deal, au, noise) {
    let est = 1;
    est += deal.tells.hist === 'Clean' ? -0.1 : deal.tells.hist === 'Ugly' ? 0.13 : 0;
    est += -(deal.tells.rate - CLASSES[deal.cls].rate * 0.5) / 35 * 0.45;

    if (noise) est += noise;

  const POLICIES = {
    decline: () => 0,
    small: () => 1,
    big: () => 2,
    skilled: (deal, ctx) => {
      const est = estimateQ(deal, ctx.au, 0);
      const cost = deal.comm - CLASSES[deal.cls].comm;
      let edge = est + cost * 1.5;
      if (ctx.rdsLoad) {
        let worst = 0; for (const r in deal.rds) worst = Math.max(worst, ((ctx.rdsLoad[r] || 0) + deal.base * deal.rds[r]) * 0.6 / ctx.appetite[r]);

    aggressive: (deal, ctx) => { const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.1)); return est < 1.15 ? 2 : 1; },
    cautious: (deal, ctx) => { const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.05)); return est < 0.98 ? 1 : 0; },
    medium: (deal, ctx) => {
      const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.08));

  // last year's revealed performance of a portfolio: (attritional + cat) / premium vs the class norm
  function bookTrafficLight(entry, market, lineCat) {
    const c = CLASSES[entry.deal.cls];

    const norm = c.lr + c.cat;
    const ratio = actual / norm;
    return { ratio, light: ratio < 0.9 ? 'good' : ratio < 1.15 ? 'warn' : 'bad', lr: actual };
  }

  // Deck sizing: slips are scaled so a sensible player can fill the window's share of the plan.
  function deckScale(capacity, win, renewedP, n) {
    const target = Math.max(capacity * (win === '1.1' ? 0.25 : 0.08), capacity * WINDOW_SHARE[win] - (renewedP || 0));
    return target / (0.84 * n * 9.2);

        const avail = falCarry + (before.uwCurve[12 * y - 2] || 0);

        for (const e of entries.filter(e => e.yoa === y - 1 && e.alert !== 'exit')) {
          const lineCat = (prevScore.lines.find(l => l.id === e.deal.id) || {}).cat || 0;
          const tl = bookTrafficLight(e, market, lineCat);
          let mult = 1;
          if (cfg.renew === 'smart') {

            const off = renewalOffer(e, market, y);
            if (tl.light === 'good' && off.offeredRate > 0) mult = 1.5;
          }

          const P = round1(e.P * mult * (1 + deal.offeredRate / 100));
          const ne = { deal, P, start: 12 * y + (deal.window === '1.7' ? 6 : 0), yoa: y };
          yearEntries.push(ne); boundTot += P;
        }
      }
      const renewed11 = yearEntries.filter(e => e.deal.window === '1.1').reduce((s, e) => s + e.P, 0);
      const renewed17 = yearEntries.filter(e => e.deal.window === '1.7').reduce((s, e) => s + e.P, 0);
      for (const win of ['1.1', '1.7']) {
        const n = deckSize(cfg.au, y, win);
        const deck = makeDeck(cfg.season, split, cfg.au, y, win, deckScale(cap, win, win === '1.1' ? renewed11 : renewed17, n), cfg.tag, market);
        const offer = win === '1.1' ? Math.min(deck.length, cfg.deals11 || Math.round(deck.length * 0.9)) : deck.length;
        const load = rdsExposure(entries.concat(yearEntries), 12 * y + (win === '1.7' ? 6 : 0));
        const appet = rdsAppetite(split, cap, fal);
        for (let i = 0; i < offer; i++) {
          const deal = deck[i];
          const line = policy(deal, { au: cfg.au, r, boundTot, capacity: cap, rdsLoad: cfg.policy === 'skilled' ? load : null, appetite: appet });
          if (!line) continue;
          const room = cap * 1.3 - boundTot;
          const P = Math.min(deal.base * line, room);
          if (P < 0.5) continue;
          const ne = { deal, P: round1(P), start: 12 * y + (win === '1.7' ? 6 : 0), yoa: y };
          yearEntries.push(ne); boundTot += ne.P;
          for (const rr in deal.rds) load[rr] = (load[rr] || 0) + ne.P * deal.rds[rr];
        }
      }
      if (y === 0 && cfg.racehorse) yearEntries.push({ deal: Object.assign({}, RACEHORSE), P: 2.5, start: 0, yoa: 0 });
      entries.push(...yearEntries);
      // alerts in April and September: the worst book turns
      [3, 8].forEach(am => {
        const cands = yearEntries.filter(b => b.start <= 12 * y + am - 1 && !b.alert);
        if (!cands.length) return;
        const worst = cands.reduce((a, b) => (b.deal.q > a.deal.q ? b : a));
        worst.alertMonth = 12 * y + am;
        worst.alert = cfg.audit ? (worst.deal.q > 1.25 ? 'exit' : 'audit') : 'ignore';
      });
      // outwards: two annual shields on the biggest RDS exposures
      const expo = rdsExposure(entries, 12 * y);
      const top = Object.keys(expo).sort((a, b) => expo[b] - expo[a]).slice(0, 2);
      const outwards = cfg.outwards ? top : [];
      const outwardsCost = outwards.reduce((s, rr) => s + shieldCost(rr, expo[rr]), 0);
      // Q1 review: a PMD letter if any net RDS is over appetite
      const appetite = rdsAppetite(split, cap, fal);
      if (Object.keys(expo).some(rr => expo[rr] * (outwards.includes(rr) ? 0.5 : 1) > appetite[rr])) { pmd++; pmdWhy.push('rds'); }
      if (cfg.ilw) for (const e of Y.events) {
        if (!e.warn || outwards.includes(e.rds)) continue;
        const ex = rdsExposure(entries, e.month)[e.rds] || 0;
        if (ex > fal * 0.25) ilw[e.key] = true;
      }
      if (boundTot > cap * 1.2) { pmd++; pmdWhy.push('gwp'); }
      years.push({ fal, capital: capList.map(c => Object.assign({}, c)), eca, capacity: cap, split: Object.assign({}, split), outwards, outwardsCost });
      // the business plan for next year
      if (y < YEARS - 1) {
        const proj = projectYoA(entries, market, y, 12 * y + 8, cfg.au);
        let ask = { static: 1, cycle: proj < 0.95 ? 1.25 : 1, grow: 1.25, large: 1.5 }[cfg.plan || 'static'];
        const v = pmdVerdict(proj, ask);
        capacity = Math.round(capacity * v.mult);
        if (cfg.plan === 'cycle') {
          const out = market.years[y].outlook;
          const inMix = Object.keys(split);
          const best = Object.keys(CLASSES).filter(c => inMix.includes(c) || inMix.length < 4).sort((a, b) => out[b] - out[a])[0];
          const worst = inMix.filter(c => c !== best && split[c] > 1).sort((a, b) => out[a] - out[b])[0];
          if (best && worst && out[best] - out[worst] >= 8) { for (let k = 0; k < 2 && split[worst] > 1; k++) { split[worst]--; split[best] = (split[best] || 0) + 1; } }
        }

    }
    const res = scoreGame(entries, { market, au: cfg.au, qs: !!cfg.qs, years, ilw, reinsCall, pmd, cashCallChoice: () => cfg.cashCall || 'pay' });
    res.entries = entries; res.years = years; res.pmdWhy = pmdWhy;
    return res;
  }

  const RIVALS = {
    kraken: { name: 'Kraken Re', no: 9174, mix: 'natcat', au: 'rainmaker', policy: 'aggressive', capitalMode: 'loose', outwards: false, ilw: false, audit: false, renew: 'all', plan: 'large',
      blurb: 'PE-backed Nat Cat. Binds everything.',
      talk: ['Nice binder… shame about the bordereaux.', 'We wrote that before you finished reading it.', 'Cat models are for people who can’t feel the wind.', 'Our PE backers say hi.', 'Is that a small line? Adorable.'] },
    raven: { name: 'Raven', no: 9301, mix: 'mat', au: 'veteran', policy: 'skilled', capitalMode: 'tight', outwards: true, ilw: true, audit: true, renew: 'smart', plan: 'cycle',
      blurb: 'Veteran MAT house. Leads the consortia.',
      talk: ['We were leading that consortium before you were born.', 'Lovely day for cargo.', 'Read the small print, dear boy. Always.', 'The Room remembers.', 'Lunch? We’ve already had it.'] },
    firewall: { name: 'Firewall', no: 9099, mix: 'cyber', au: 'quant', policy: 'medium', capitalMode: 'tight', outwards: true, ilw: false, audit: false, renew: 'smart', plan: 'grow',
      blurb: 'Cyber pure-play. Rides the cyber cycle.',
      talk: ['Have you tried turning your syndicate off and on again?', 'Our model says you’re 82% likely to regret that.', 'Patch your underwriting.', 'We accept payment in basis points.', 'Latency is a state of mind.'] },
    hearthstone: { name: 'Hearthstone', no: 9188, mix: 'composite', au: 'forensic', policy: 'cautious', capitalMode: 'tight', outwards: true, ilw: true, audit: true, renew: 'smart', plan: 'static',
      blurb: 'Names-backed composite. Slow and steady.',
      talk: ['Steady as she goes.', 'Our Names have been here since 1890.', 'We audited your binder for you. You’re welcome.', 'Diversification is a lifestyle.', 'Patience, young syndicate.'] },
    longtail: { name: 'Longtail', no: 9150, mix: 'castreaty', au: 'quant', policy: 'medium', capitalMode: 'tight', outwards: false, ilw: false, audit: true, renew: 'all', plan: 'grow',
      blurb: 'Casualty treaty specialist. Sleeps well (for now).',
      talk: ['See you at the three-year close.', 'IBNR is just a feeling.', 'Social inflation? Never heard of her.', 'We reserve the right to reserve.', 'Short-tail is for tourists.'] }
  };
  const NEMESIS = { natcat: 'kraken', propdf: 'kraken', castreaty: 'longtail', finpro: 'longtail', cyber: 'firewall', mat: 'raven', specialty: 'raven', ah: 'hearthstone', frontier: 'raven', composite: 'hearthstone' };

  function rivalRun(rivalId, season, market) {
    const rv = RIVALS[rivalId];
    const res = simulateGame({
      season, market, split: MIX_BY_ID[rv.mix].split, au: rv.au, policy: rv.policy, tag: 'rival-' + rivalId,
      capitalMode: rv.capitalMode, outwards: rv.outwards, ilw: rv.ilw, audit: rv.audit, renew: rv.renew, plan: rv.plan, cashCall: 'pay'

    MIXES, MIX_BY_ID, AUS, BROKERS, MODIFIERS, RIVALS, NEMESIS, RACEHORSE,
    PLAN_GWP, FIXED_COSTS, ECU, SOLVENCY_LINE, CASH_CALL_COST, QS_SHARE, OUTWARDS_LOAD, ILW_COST, APPETITE, WINDOW_SHARE, CAPACITY_STEPS,

  // ---------- pointer drag helper (tap and keyboard fall back to onTap) ----------
  function draggable(node, opts) {
    let id = null, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0, moved = false;
    const th = opts.threshold || 6;
    node.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (opts.enabled && !opts.enabled())) return;
      id = e.pointerId; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); moved = false; vx = vy = 0;
      try { node.setPointerCapture(id); } catch (err) { /* capture unsupported */ }
      opts.onDown && opts.onDown(e);
    });
    node.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > th) { moved = true; opts.onStart && opts.onStart(e); }
      const now = performance.now(), dt = Math.max(8, now - lt);
      vx = ((e.clientX - lx) / dt) * 1000; vy = ((e.clientY - ly) / dt) * 1000; lx = e.clientX; ly = e.clientY; lt = now;
      if (moved && opts.onMove) opts.onMove(dx, dy, e);
    });
    const end = (e, cancelled) => {
      if (e.pointerId !== id) return;
      id = null;
      if (!moved) { if (!cancelled && opts.onTap) opts.onTap(e); return; }
      opts.onEnd && opts.onEnd(e.clientX - sx, e.clientY - sy, vx, vy, e, cancelled);
    };
    node.addEventListener('pointerup', (e) => end(e, false));
    node.addEventListener('pointercancel', (e) => end(e, true));
    node.addEventListener('click', (e) => { if (e.detail === 0 && opts.onTap) opts.onTap(e); });
  }
  function dropTarget(x, y, selector, ignore) {
    for (const n of document.elementsFromPoint(x, y)) {
      if (ignore && (n === ignore || ignore.contains(n))) continue;
      const hit = n.closest && n.closest(selector);
      if (hit) return hit;
    }
    return null;
  }

  // ---------- leaderboard (shared via the db capability when available) ----------
  const LB = {
    db: null, user: null, uid: null, rows: [], unsub: null, live: false, names: {}, listeners: new Set(),
    async init() {
      const C = window.claude;
      if (!C || typeof C.use !== 'function') return;
      try {
        const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
        if (!db) return;
        this.db = db; this.user = user;
        this.uid = user ? await user.id() : null;
        this.live = true;
        this.unsub = db.collection('scores').where('season', '==', SEASON).orderBy('score', 'desc').limit(25)
          .onSnapshot((snap) => {
            this.rows = snap.docs.map((d) => Object.assign({ uid: d.id }, d.data()));
            this.resolveNames().then(() => this.listeners.forEach((fn) => fn()));
          }, () => { this.live = false; this.listeners.forEach((fn) => fn()); });
      } catch (e) { this.live = false; }
    },
    async resolveNames() {
      if (!this.user || !this.user.profiles) return;
      const ids = this.rows.map((r) => r.uid).filter((id) => !(id in this.names));
      if (!ids.length) return;
      try {
        const ps = await this.user.profiles(ids);
        for (const id of ids) this.names[id] = (ps && ps[id] && ps[id].name) || '';
      } catch (e) { /* names stay blank */ }
    },
    async submit(entry) {
      // local board and personal best always
      const key = 'lsl-local-' + SEASON;
      const local = store.get(key, []);
      local.push(Object.assign({ uid: 'local-' + Date.now(), me: true }, entry));
      local.sort((a, b) => b.score - a.score);
      store.set(key, local.slice(0, 10));
      const pb = store.get('lsl-pb-' + SEASON, null);
      if (!pb || entry.score > pb.score) store.set('lsl-pb-' + SEASON, entry);
      if (!this.db || !this.uid) return { shared: false };
      try {
        const ref = this.db.doc('scores/' + this.uid);
        const cur = await ref.get();
        const old = cur.exists ? cur.data() : null;
        if (old && old.season === SEASON && old.score >= entry.score) return { shared: true, best: false };
        await ref.set(entry);
        return { shared: true, best: true };
      } catch (e) { return { shared: false, error: e && e.code }; }
    },
    displayName(row) {
      if (row.uid && row.uid === this.uid) return 'You';
      return this.names[row.uid] || 'Someone';
    },
    ghostCurve() {
      const pref = store.get('lsl-ghost', null);
      if (this.live && this.rows.length) {
        const row = (pref && this.rows.find((r) => r.uid === pref)) || this.rows.find((r) => r.uid !== this.uid) || this.rows[0];
        if (row && Array.isArray(row.curve)) return { label: row.uid === this.uid ? 'Your best' : (this.displayName(row) + ' (ghost)'), curve: row.curve, score: row.score };
      }
      const pb = store.get('lsl-pb-' + SEASON, null);
      if (pb && Array.isArray(pb.curve)) return { label: 'Your best (ghost)', curve: pb.curve, score: pb.score };
      return null;
    }
  };

  // ----- Step 3: Making it Happen, capital grab -----
  const HAND_SVG = '<svg viewBox="0 0 120 70" aria-hidden="true"><rect x="0" y="22" width="62" height="26" rx="4" fill="#1d2733"/><rect x="54" y="20" width="10" height="30" fill="#f2efe8"/><path d="M64 18c10-2 22 0 30 4l18-2c4 0 4 6 0 7l-14 2 14 3c4 1 3 7-1 7l-14-1 10 4c3 2 1 6-2 6l-14-3c-10 2-20 2-27-1z" fill="#e0b896"/></svg>';
  const SRC_COLOR = { corporate: '#d3a649', names: '#e9d3a0', pe: '#f0a35c', family: '#c9e08a', qs: '#9fd0ff', agency: '#d3a649' };

  // Floating capital tokens: flick or drag them into the vault (or tap) before rival hands snatch them.
  // Used by the opening Capital Grab and by the mini grab when coming into line.
  function makeCapitalField(o) {
    const F = { tokens: [], elapsed: 0, closed: false };
    F.spawn = (offer) => {
      const fw = o.field.clientWidth, fh = o.field.clientHeight;
      const size = fw < 400 ? 92 : 112;
      const amtTxt = offer.qs ? '−25% ECA' : '£' + offer.amt.toFixed(0) + 'm';
      const rateTxt = offer.qs ? 'cedes 25%' : Math.round(offer.rate * 100) + '% a year';
      const n = el('<button class="token' + (offer.trap ? ' trap' : '') + (offer.qs ? ' qs' : '') + '" style="--tc:' + SRC_COLOR[offer.src] + '" title="' + esc(offer.hint || offer.label) + '"><b>' + amtTxt + '</b><span>' + esc(offer.label) + '</span><em>' + rateTxt + '</em></button>');
      o.field.appendChild(n);
      const tok = { o: offer, n, age: 0, x: 8 + rand() * Math.max(10, fw - size - 16), y: fh + 10, size, fh, dragging: false, gone: false };
      F.tokens.push(tok);
      draggable(n, {
        enabled: () => !tok.gone && !F.closed,
        onStart: () => { tok.dragging = true; },
        onMove: (dx, dy, e) => { n.style.transform = 'translate(' + (tok.x + dx) + 'px,' + (tok.y + dy) + 'px) scale(1.06)'; o.vault.classList.toggle('drop', !!dropTarget(e.clientX, e.clientY, '#' + o.vault.id, n)); },
        onEnd: (dx, dy, vx, vy, e, cancelled) => {
          tok.dragging = false; o.vault.classList.remove('drop');
          tok.x += dx; tok.y += dy;
          if (!cancelled && (dropTarget(e.clientX, e.clientY, '#' + o.vault.id, n) || vx > 700)) F.grab(tok);
        },
        onTap: () => F.grab(tok)
      });
      if (o.auto) setTimeout(() => { if (!tok.gone && o.auto(offer)) F.grab(tok); }, 400 / SPEED);
    };
    F.grab = (tok) => {
      if (tok.gone || F.closed) return;
      tok.gone = true;
      const [vx, vy] = centre(o.vault); const [tx, ty] = centre(tok.n);
      tok.n.animate([{ transform: 'translate(' + tok.x + 'px,' + tok.y + 'px) scale(1)' }, { transform: 'translate(' + (tok.x + vx - tx) + 'px,' + (tok.y + vy - ty) + 'px) scale(.2)', opacity: 0.2 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
      setTimeout(() => tok.n.remove(), 400);
      Sound.kaching(); FX.burst(vx, vy, 'coins', 16);
      o.onGrab(tok.o);
    };
    F.snatch = (tok) => {
      tok.gone = true;
      const fw = o.field.clientWidth;
      const fromLeft = tok.x < fw / 2;
      const h = el('<div class="hand">' + HAND_SVG + '</div>');
      h.style.top = tok.y + tok.size / 2 - 35 + 'px';
      h.style.left = fromLeft ? '-130px' : fw + 10 + 'px';
      if (!fromLeft) h.firstElementChild.style.transform = 'scaleX(-1)';
      o.field.appendChild(h);
      const reach = fromLeft ? tok.x + 10 : -(fw - tok.x - tok.size + 20);
      requestAnimationFrame(() => { h.style.transform = 'translateX(' + (fromLeft ? reach + 130 : reach - 10) + 'px)'; });
      setTimeout(() => { tok.n.classList.add('taken'); h.style.transform = 'translateX(0)'; }, 420);
      setTimeout(() => { tok.n.remove(); h.remove(); }, 900);
      if (o.onSnatch) o.onSnatch(tok.o);
    };
    F.update = (dt) => {
      if (F.closed) return;
      F.elapsed += dt;
      for (const offer of o.offers) if (!offer.spawned && F.elapsed >= offer.appearAt) { offer.spawned = true; F.spawn(offer); }
      for (const tok of F.tokens) {
        if (tok.gone || tok.dragging) continue;
        tok.age += dt;
        const k = tok.age / tok.o.life;
        tok.y = lerp(tok.fh - tok.size * 0.6, -tok.size * 0.3, Math.min(1, k)) + Math.sin(tok.age * 2 + tok.x) * 4;
        tok.n.style.transform = 'translate(' + tok.x + 'px,' + tok.y + 'px)';
        if (k >= 1) F.snatch(tok);
      }
    };
    F.exhausted = () => F.elapsed > 6 && o.offers.every((x) => x.spawned) && F.tokens.every((t) => t.gone);
    F.close = () => { F.closed = true; };
    return F;
  }

        '<div class="actions" id="actions"><button class="btn danger" data-line="0"><span>← Decline</span></button><button class="btn" data-line="1"><span>↓ Small line</span></button><button class="btn primary" data-line="2"><span>Big line →</span></button></div></div>' +
        '<div class="side"><div class="favours" id="favours">' + fav + '</div><div class="shelf" id="shelf" aria-label="Your book, by year of account"></div></div>' +
        '<div class="ticker" id="ticker" aria-live="off"></div>' +
        '</div></section>');
      this.root = root;
      root.querySelectorAll('.actions [data-line]').forEach((b) => b.addEventListener('click', () => this.decide(+b.dataset.line)));
      root.querySelector('#rdsBtn').addEventListener('click', () => { if (this.phase === 'ff' || this.phase === 'rush' || this.phase === 'mid17') this.openRDS({ mode: 'view' }); });
      root.querySelectorAll('.favour').forEach((n) => this.wireFavour(n));
      this.onKey = (e) => {
        if (paused || this.over) return;
        const k = e.key.toLowerCase();
        if (k === 'arrowleft' || k === 'a') { e.preventDefault(); this.decide(0); }
        else if (k === 'arrowdown' || k === 's') { e.preventDefault(); this.decide(1); }
        else if (k === 'arrowright' || k === 'd') { e.preventDefault(); this.decide(2); }
        else if (k === 'r') this.revealNext();
        else if (k === 'p') root.querySelector('#rdsBtn').click();
        else if (['1', '2', '3'].includes(k)) this.useFavour(['lunch', 'reins', 'poach'][+k - 1]);
      };
      addEventListener('keydown', this.onKey);
      return root;
    },
    mounted() {
      this.renderDerby();
      this.renderShelf();
      this.paintPlanner();
      this.updateRace();
      Sound.murmur(true);
      this.tick('YOA ' + yoaName(this.y) + ' · ' + G.market.years[this.y].modifier.text.toUpperCase() + ' · ' + G.no + ' ' + G.name.toUpperCase() + ' IS OPEN FOR BUSINESS');
      this.setActions(false);
      if (this.y > 0) this.openReview(); else this.startRush();
    },
    exit() { removeEventListener('keydown', this.onKey); Sound.murmur(false); },

    // ---- time ----
    abs() {
      const base = 12 * this.y;
      if (this.phase === 'mid17') return base + 6;
      if (this.phase === 'review' || this.phase === 'rush' || this.phase === 'outwards' || this.phase === 'start') return base;
      return base + Math.min(12, this.month + this.mt);
    },
    setPhase(p, label) {
      this.phase = p;
      const ph = this.root.querySelector('#plPhase');
      if (ph && label) ph.textContent = label;
    },
    paintPlanner() {
      const r = this.root;
      const f = Math.min(1, (this.abs() - 12 * this.y) / 12);
      r.querySelector('#plHead').style.left = (f * 100).toFixed(2) + '%';
      r.querySelectorAll('.pl-m').forEach((d) => {
        const m = +d.dataset.m;
        d.classList.toggle('done', m < Math.floor(f * 12));
        d.classList.toggle('now', m === Math.min(11, Math.floor(f * 12)));
      });
      const chips = [];
      for (let k = 0; k < 3; k++) {
        const st = k < this.y ? 'open' : k === this.y ? 'now' : 'future';
        chips.push('<span class="yoachip ' + st + '" title="' + (st === 'future' ? 'Not written yet' : 'Open year of account') + '">YoA ' + yoaName(k).slice(2) + '</span>');
      }
      r.querySelector('#yoaChips').innerHTML = chips.join('');
    },
    eventPin(e) {
      const bar = this.root.querySelector('#plBar');
      if (!bar || bar.querySelector('[data-ev="' + e.key + '"]')) return;
      const at = ((e.month - 12 * this.y) + 0.5) / 12;
      const p = el('<span class="pl-ev" data-ev="' + e.key + '" style="left:' + (at * 100).toFixed(2) + '%" title="' + esc(E.RDS[e.rds].name) + '"></span>');
      bar.appendChild(p);
    },

    // ---- fast-forward and the beats of the year ----
    startFF() {
      this.setPhase('ff', MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y));
      this.setActions(false);
      this.showFF();
      if (!this.runBeats()) this.setPhase('ff');
    },
    resumeFF() {
      this.over = false; this.overlayTick = null;
      this.setPhase('ff');
      this.setActions(false);
      this.showFF();
      this.updateRace();
      this.runBeats();
    },
    runBeats() {
      const y = this.y, m = this.month, abs = 12 * y + m;
      for (const e of G.market.years[y].events.concat(y < 2 ? G.market.years[y + 1].events : [])) {
        if (e.warn && !e.forecasted && e.month === abs + 1) {
          e.forecasted = true;
          toast('Forecast: ' + E.RDS[e.rds].name, (E.RDS[e.rds].forecast || '') + ' Check your RDS Board.', 'var(--bad)', 5);
          this.tick('FORECAST · ' + (E.RDS[e.rds].forecast || E.RDS[e.rds].name).toUpperCase());
          this.eventPin(e);
          this.root.querySelector('#rdsBtn').classList.add('hot');
        }
      }
      const ev = G.market.events.find((e) => e.month === abs && !e.done);
      if (ev && m < 12) { this.eventPin(ev); this.openRDS({ mode: 'event', e: ev }); return true; }
      if (m === 2 && !this.flags.q1) { this.flags.q1 = true; this.q1Review(); return true; }
      if (m === 4 && !this.flags.alert) { this.flags.alert = true; if (this.triggerAlert()) return true; }
      if (m === 6 && !this.flags.mid) { this.flags.mid = true; this.startMid(); return true; }
      if (m === 8 && y < 2 && !this.flags.sbf) { this.flags.sbf = true; this.openPlanning(); return true; }
      if (m === 11 && y < 2 && !this.flags.cil) { this.flags.cil = true; this.openCIL(); return true; }
      if (m >= 12 && !this.flags.annual) { this.flags.annual = true; this.openAnnual(); return true; }
      return false;
    },
    showFF() {
      const box = this.root.querySelector('#slotArea');
      this.root.querySelector('#brokerRow').innerHTML = '';
      this.root.querySelector('#clock').hidden = true;
      const abs = this.abs();
      const live = G.entries.filter((e) => e.start <= abs && e.start + 12 > abs && !(e.alert === 'exit' && e.alertMonth <= abs));
      const onRisk = live.reduce((s, e) => s + e.P, 0);
      const w = this.worstRDS();
      box.innerHTML = '<div class="ffpanel"><span class="eyebrow">Fast-forwarding</span><div class="ffmonth" id="ffMonth">' + MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y) + '</div>' +
        '<p>On risk: <b class="num">' + fmtM(onRisk) + '</b> across ' + live.length + ' portfolios' + (w ? ' · biggest RDS: <b>' + esc(E.RDS[w.r].name) + '</b> at ' + Math.round(w.pct * 100) + '% of appetite' : '') + '.</p></div>';
    },
    setActions(on) {
      const a = this.root.querySelector('#actions');
      a.style.visibility = on ? 'visible' : 'hidden';
    },

    // ---- the race and the HUD ----
    renderDerby() {
      const lanes = [['you', 'You · ' + G.no], ['nemesis', E.RIVALS[G.nemesis].name], ['rival2', E.RIVALS[G.rival2].name]];
      if (G.ghost) lanes.push(['ghost', G.ghost.label]);
      this.root.querySelector('#derby').innerHTML = lanes.map(([k, name]) => '<button class="lane ' + k + '" data-lane="' + k + '" style="--lc:' + LANE_COLORS[k] + '"><span class="ln">' + esc(name) + '</span><span class="track"><span class="zero"></span><span class="runner">' + (k === 'you' ? 'U' : k === 'ghost' ? '' : name[0]) + '</span></span><span class="lv num">£0.0m</span></button>').join('');
      this.root.querySelectorAll('.lane').forEach((ln) => ln.addEventListener('click', () => { const k = ln.dataset.lane; if (k === 'nemesis' || k === 'rival2') this.trash(k); }));
    },
    trash(k) {
      const id = k === 'nemesis' ? G.nemesis : G.rival2;
      const rv = E.RIVALS[id];
      const line = pick(rv.talk);
      const lane = this.root.querySelector('.lane.' + k);
      if (!lane) return;
      lane.querySelectorAll('.talk').forEach((t) => t.remove());
      const b = el('<span class="talk"><span class="bubble">' + esc(line) + '</span></span>');
      lane.appendChild(b);
      setTimeout(() => b.remove(), 3500);
      this.tick(rv.name.toUpperCase() + ': “' + line + '”');
    },
    curveAt(curve, abs) {
      if (!curve || !curve.length) return 0;
      const i = Math.min(curve.length - 1, Math.floor(abs)), f = abs - Math.floor(abs);
      if (abs >= curve.length) return curve[curve.length - 1];
      return lerp(i > 0 ? curve[i - 1] : 0, curve[i], f);
    },
    live() { return E.scoreGame(G.entries, gameOpts()); },
    updateRace() {
      const res = this.live();
      this.res = res;
      const abs = this.abs();
      const vals = { you: this.curveAt(res.curve, abs), nemesis: this.curveAt(G.rivalRuns[G.nemesis].curve, abs), rival2: this.curveAt(G.rivalRuns[G.rival2].curve, abs) };
      if (G.ghost) vals.ghost = this.curveAt(G.ghost.curve, abs);
      const all = Object.values(vals);
      const lo = Math.min(-15, ...all) - 3, hi = Math.max(15, ...all) + 3;
      const pos = (v) => ((v - lo) / (hi - lo)) * 100;
      for (const k in vals) {
        const ln = this.root.querySelector('.lane.' + k); if (!ln) continue;
        ln.querySelector('.runner').style.left = pos(vals[k]) + '%';
        ln.querySelector('.zero').style.left = pos(0) + '%';
        ln.querySelector('.lv').textContent = fmtM(vals[k], true);
      }
      // capital: FAL plus funds held in the syndicate, against the solvency line
      const Y = this.Y;
      const i = Math.max(0, Math.min(res.uwCurve.length - 1, Math.floor(abs) - 1));
      const uwNow = abs < 1 ? 0 : res.uwCurve[i] || 0;
      const capNow = Y.fal + falExtra() + uwNow, scale = Y.eca * 1.6;
      this.root.querySelector('#hCap').textContent = '£' + capNow.toFixed(0) + 'm';
      const cb = this.root.querySelector('#hCapBar');
      cb.style.width = Math.max(0, Math.min(100, (capNow / scale) * 100)) + '%';
      cb.style.background = capNow < Y.eca * E.SOLVENCY_LINE ? 'var(--bad)' : capNow < Y.eca ? 'var(--warn)' : 'var(--good)';
      this.root.querySelector('#hCapLine').style.left = ((Y.eca * E.SOLVENCY_LINE) / scale) * 100 + '%';
      const bt = yoaTot(this.y);
      this.root.querySelector('#hGwp').textContent = '£' + bt.toFixed(0) + '/' + Y.capacity.toFixed(0) + 'm';
      this.root.querySelector('#hGwpBar').style.width = Math.min(100, (bt / (Y.capacity * 1.3)) * 100) + '%';
      this.root.querySelector('#hGwpLine').style.left = (1 / 1.3) * 100 + '%';
      const w = E.weights(Y.split);
      this.root.querySelector('#hPlan').innerHTML = Object.keys(w).map((k) => '<span style="width:' + w[k] * 100 + '%;background:' + clsColor(k) + '"></span>').join('');
      const bound = {}; yoaEntries(this.y).forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
      this.root.querySelector('#hBound').innerHTML = bt ? Object.keys(bound).map((k) => '<span style="width:' + (bound[k] / bt) * 100 + '%;background:' + clsColor(k) + '"></span>').join('') : '';
      this.root.querySelector('#hDrift').textContent = bt ? Math.round(this.drift()) + ' pts off' : 'on plan';
      const wr = this.worstRDS();
      const rb = this.root.querySelector('#rdsBtn');
      this.root.querySelector('#rdsTxt').textContent = wr ? 'RDS ' + Math.round(wr.pct * 100) + '%' : 'RDS';
      rb.classList.toggle('over', !!wr && wr.pct > 1);
      rb.style.setProperty('--heat', wr ? Math.min(1, wr.pct).toFixed(2) : 0);
      if (this.phase === 'ff') { const fm = this.root.querySelector('#ffMonth'); if (fm) fm.textContent = MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y); }
      return vals;
    },
    drift() {
      const bt = yoaTot(this.y); if (!bt) return 0;
      const w = E.weights(this.Y.split), bound = {};
      yoaEntries(this.y).forEach((b) => { bound[b.deal.cls] = (bound[b.deal.cls] || 0) + b.P; });
      let d = 0; for (const k of new Set([...Object.keys(w), ...Object.keys(bound)])) d += Math.abs((bound[k] || 0) / bt - (w[k] || 0));
      return d * 50;
    },
    rdsState(abs) {
      const at = abs == null ? Math.floor(this.abs()) : abs;
      const gross = E.rdsExposure(G.entries, at);
      const appetite = E.rdsAppetite(this.Y.split, this.Y.capacity, this.Y.fal);
      const out = this.Y.outwards || [];
      const rows = Object.keys(gross).map((r) => ({ r, gross: gross[r], net: gross[r] * (out.includes(r) ? 0.5 : 1), appetite: appetite[r], shielded: out.includes(r) }));
      rows.forEach((x) => { x.pct = x.net / x.appetite; });
      return { rows: rows.sort((a, b) => b.gross - a.gross), appetite };
    },
    worstRDS() {
      const st = this.rdsState();
      let w = null; for (const x of st.rows) if (!w || x.pct > w.pct) w = x;
      return w;
    },

    // ---- ticker ----
    tick(msg) {
      this.tickQ.push(msg);
      if (this.tickQ.length > 4) this.tickQ.splice(0, this.tickQ.length - 4);
      if (!this.tickBusy) this.runTicker();
    },
    runTicker() {
      const box = this.root && this.root.querySelector('#ticker');
      if (!box || !this.tickQ.length) { this.tickBusy = false; return; }
      this.tickBusy = true;
      const s = el('<span>' + esc(this.tickQ.shift()) + '</span>');
      box.innerHTML = ''; box.appendChild(s);
      const w = box.clientWidth, sw = s.offsetWidth;
      const a = s.animate([{ transform: 'translateX(' + w + 'px)' }, { transform: 'translateX(' + -sw + 'px)' }], { duration: REDUCED ? 4000 : ((w + sw) / 90) * 1000, easing: 'linear' });
      a.onfinish = () => this.runTicker();
    },

    // ---- the renewal windows: 1.1 rush and the 1.7 window ----
    startRush() {
      const y = this.y, Y = this.Y;
      if (y === 0 && G.racehorse && !G.entries.some((e) => e.deal.forced)) {
        const e = { deal: Object.assign({}, E.RACEHORSE), P: 2.5, start: 0, yoa: 0, line: 1 };
        G.entries.push(e); this.addBinder(e);
      }
      const renewed = yoaEntries(y).filter((e) => e.deal.window === '1.1').reduce((s, e) => s + e.P, 0);
      const n = E.deckSize(G.au, y, '1.1');
      this.deck = E.makeDeck(SEASON, Y.split, G.au, y, '1.1', E.deckScale(Y.capacity, '1.1', renewed, n), 'player', G.market);
      this.deckIdx = 0;
      this.clockMax = this.clock = Math.max(18, 32 - (y === 0 ? (G.rushPenalty || 0) : 0));
      this.nextAt = this.t + 0.6;
      this.setPhase('rush', '31 December · the 1.1 renewals');
      this.root.querySelector('#clock').hidden = false;
      this.paintClock();
      this.setActions(true);
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">Brokers are queuing at your box…</p>';
      if (G.favours.lunch) this.root.querySelector('.favour[data-f="lunch"]').classList.remove('used');
    },
    startMid() {
      const y = this.y, Y = this.Y;
      const renewed = yoaEntries(y).filter((e) => e.deal.window === '1.7').reduce((s, e) => s + e.P, 0);
      const n = E.deckSize(G.au, y, '1.7');
      this.deck = E.makeDeck(SEASON, Y.split, G.au, y, '1.7', E.deckScale(Y.capacity, '1.7', renewed, n), 'player', G.market);
      this.deckIdx = 0;
      this.clockMax = this.clock = 16;
      this.nextAt = this.t + 0.4;
      this.setPhase('mid17', '1 July · the mid-year window');
      this.root.querySelector('#clock').hidden = false;
      this.paintClock();
      this.setActions(true);
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">A few mid-year renewals…</p>';
      toast('1.7 renewals', 'A small window for mid-year business, mostly property cat.', 'var(--brass)');
    },
    paintClock() {
      const c = this.root.querySelector('#clock');
      const s = Math.max(0, Math.ceil(this.clock));
      if (this.phase === 'rush') c.textContent = s > 0 ? '23:59:' + String(60 - s).padStart(2, '0') : '00:00:00';
      else c.textContent = '1 JUL · ' + s + 's';
      c.classList.toggle('hot', this.clock < 6);
    },
    endWindow() {
      const left = this.deck.length - this.deckIdx + (this.cur && !this.cur.busy ? 1 : 0);
      if (this.cur && !this.cur.busy) this.walk(true);
      this.root.querySelector('#clock').hidden = true;
      this.setActions(false);
      if (this.phase === 'rush') {
        Sound.bell(2);
        const [x, y] = centre(this.root.querySelector('#box')); FX.burst(x, y, 'confetti', 80);
        toast('Happy New Year from the Room', left > 0 ? left + ' slips missed the midnight deadline.' : 'Every slip got an answer before midnight.', 'var(--brass)');
        this.tick('00:00 · 1 JANUARY ' + yoaName(this.y) + ' · YOA ' + yoaName(this.y) + ' INCEPTS · ' + G.no + ' WROTE ' + fmtM(yoaTot(this.y)).toUpperCase());
        setTimeout(() => { this.clearDeal(); this.openRDS({ mode: 'outwards' }); }, 900 / SPEED);
        this.setPhase('outwards', '1 January · buy your outwards');
      } else {
        this.clearDeal();
        this.resumeFF();
      }
    },
    present() {
      if (this.deckIdx >= this.deck.length) return;
      const d0 = this.deck[this.deckIdx++];
      const d = Object.assign({}, d0, { tells: Object.assign({}, d0.tells) });
      if (G.hotLeft > 0) { d.q = Math.max(0.55, d.q * 0.9); d.base = E.round1(d.base * 1.15); G.hotLeft--; d.hot = true; }
      const b = E.BROKERS[d.broker];
      const room = this.Y.capacity * 1.3 - yoaTot(this.y);
      let blocked = null;
      if (d.structure === 'binder' && this.y === 0 && this.phase === 'rush' && G.atlasBlock) blocked = 'Coverholder not yet approved in ATLAS. Decline only.';
      else if (room < 0.5) blocked = 'Stamp capacity full. Decline only.';
      this.cur = { d, patience: 1, total: 13 * b.patience * (G.au === 'veteran' ? 1.4 : 1), revealed: [false, false, false], shownAt: this.t, lunch: false, blocked, busy: false };
      const row = this.root.querySelector('#brokerRow');
      row.innerHTML = '<div class="face">' + face(d.broker) + '</div><div class="who"><span class="bname">' + esc(b.name) + '<small>' + esc(b.firm) + '</small></span><div class="bubble">' + esc(E.brokerLine(d)) + '</div><div class="patience"><i id="pat"></i></div></div>';
      this.renderSlip();
      this.root.querySelectorAll('.actions [data-line]').forEach((btn) => { btn.disabled = !!blocked && btn.dataset.line !== '0'; });
      Sound.tick();
      if (!store.get('lsl-coached-v2', false) && !AUTO) this.coach();
      if (AUTO) setTimeout(() => {
        if (this.cur && this.cur.d === d && !this.cur.busy) {
          const pol = E.POLICIES[AUTO] || E.POLICIES.skilled;
          const line = pol(d, { au: G.au, r: Math.random, boundTot: yoaTot(this.y), capacity: this.Y.capacity, rdsLoad: E.rdsExposure(G.entries, this.abs()), appetite: E.rdsAppetite(this.Y.split, this.Y.capacity, this.Y.fal) });
          this.decide(blocked ? 0 : line);
        }
      }, 700 / SPEED);
    },
    coach() {
      store.set('lsl-coached-v2', true);
      this.over = true;
      const box = this.root.querySelector('#box');
      const c = el('<div class="coach" role="dialog"><h4>Your first slip</h4><p><b>Drag the slip</b>: left to decline, down for a small line, right for a big line. Or use the buttons, or ← ↓ →.</p><p>Tap the <b>small print</b> to read it, but the broker’s patience drops. The <b>RDS line</b> shows which disaster scenario it adds to.</p><button class="btn primary">Got it</button></div>');
      box.appendChild(c);
      c.querySelector('button').addEventListener('click', () => { c.remove(); this.over = false; });
      c.querySelector('button').focus({ preventScroll: true });
    },
    tellHTML(i) {
      const d = this.cur.d, c = E.CLASSES[d.cls], open = this.cur.revealed[i];
      const names = ['Loss history', 'Rate change', 'Growth'];
      if (!open) return '<button class="tell" data-t="' + i + '">' + names[i] + '<span class="redact"></span></button>';
      let v, cls = '';
      if (i === 0) { v = d.tells.hist; cls = v === 'Clean' ? 'good' : v === 'Ugly' ? 'bad' : ''; }
      if (i === 1) { v = (d.tells.rate > 0 ? '+' : '') + d.tells.rate + '%'; const ref = c.rate * 0.5; cls = d.tells.rate > ref + 3 ? 'good' : d.tells.rate < ref - 3 ? 'bad' : ''; }
      if (i === 2) { v = '+' + d.tells.growth + '%'; cls = d.tells.growth > 40 ? 'bad' : d.tells.growth < 15 ? 'good' : ''; }
      return '<button class="tell ' + cls + '" data-t="' + i + '" disabled>' + names[i] + '<b>' + v + '</b></button>';
    },
    insightHTML() {
      const c = this.cur, d = c.d;
      if (c.lunch) return '<div class="insight" style="--c:' + (d.q < 0.95 ? 'var(--good)' : d.q < 1.05 ? 'var(--warn)' : 'var(--bad)') + '"><span class="pip"></span>Over a long lunch: this book is ' + qualityWord(d.q) + '. Price adequacy ' + Math.round(100 / d.q) + '%.</div>';
      if (G.au === 'quant') return '<div class="insight" style="--c:' + (d.adequacy >= 103 ? 'var(--good)' : d.adequacy <= 95 ? 'var(--bad)' : 'var(--warn)') + '"><span class="pip"></span>The Quant: price adequacy ' + d.adequacy + '%</div>';
      if (G.au === 'forensic') return '<div class="insight" style="--c:' + ({ A: 'var(--good)', B: 'var(--good)', C: 'var(--warn)', D: 'var(--bad)' })[d.grade] + '"><span class="pip"></span>The Forensic: audit grade ' + d.grade + '</div>';
      if (G.au === 'veteran') {
        const t = { good: ['var(--good)', 'Gut feel: the broker isn’t bluffing.'], meh: ['var(--warn)', 'Gut feel: nothing either way.'], bad: ['var(--bad)', 'Gut feel: you’ve seen this one before. It ended badly.'] }[d.gut];
        return '<div class="insight" style="--c:' + t[0] + '"><span class="pip"></span>' + t[1] + '</div>';
      }
      return '<div class="insight"><span class="pip"></span>The Rainmaker: “I know their cousin. Lovely family.”</div>';
    },
    rdsLine(d) {
      const st = this.rdsState(this.phase === 'mid17' ? 12 * this.y + 6 : 12 * this.y);
      const main = Object.keys(d.rds).sort((a, b) => d.rds[b] - d.rds[a])[0];
      if (!main) return '';
      const f = d.rds[main];
      const row = st.rows.find((x) => x.r === main);
      const cur = row ? row.net : 0, ap = st.appetite[main];
      const addS = d.base * f * (row && row.shielded ? 0.5 : 1);
      const pctNow = cur / ap, pctBig = (cur + addS * 2) / ap;
      const col = pctBig > 1 ? 'var(--bad)' : pctBig > 0.8 ? 'var(--warn)' : 'var(--good)';
      return '<div class="rdsline" title="Gross loss to this RDS if the full scenario happened">' + icon(E.RDS[main].icon) +
        '<span>RDS: <b>' + esc(E.RDS[main].name) + '</b> +' + fmtM(addS) + ' / +' + fmtM(addS * 2) + ' → ' + Math.round(pctBig * 100) + '% of appetite</span>' +
        '<span class="rdsmini"><i style="width:' + Math.min(100, pctNow * 100) + '%"></i><i class="add" style="left:' + Math.min(100, pctNow * 100) + '%;width:' + Math.max(0, Math.min(100, pctBig * 100) - Math.min(100, pctNow * 100)) + '%;background:' + col + '"></i></span></div>';
    },
    renderSlip() {
      const c = this.cur, d = c.d, cl = E.CLASSES[d.cls];
      const area = this.root.querySelector('#slotArea');
      const when = this.phase === 'mid17' ? '1 Jul ' + yoaName(this.y) : '1 Jan ' + yoaName(this.y);
      area.innerHTML = '<div class="slip" id="slip"><div class="holes"><i></i><i></i><i></i><i></i></div>' +
        '<div class="sh"><span>' + esc(STRUCT[d.structure] || d.structure) + ' · ' + d.window + '</span><span>Incepts ' + when + '</span></div>' +
        '<h3>' + esc(d.label) + '</h3>' +
        '<div class="clsrow"><span class="tag" style="--c:' + clsColor(d.cls) + '"><i></i>' + esc(cl.name) + '</span>' + (d.off ? '<span class="tag off">Off plan</span>' : '') + (d.hot ? '<span class="tag">Hot box</span>' : '') + '</div>' +
        '<div class="terms"><div><span>Small line</span><b class="num">£' + d.base.toFixed(1) + 'm</b></div><div><span>Big line</span><b class="num">£' + (d.base * 2).toFixed(1) + 'm</b></div>' +
        '<div><span>Commission</span><b class="num">' + Math.round(d.comm * 100) + '%</b></div><div><span>Market rates</span><b class="num">' + (cl.rate > 0 ? '+' : '') + cl.rate + '%</b></div></div>' +
        this.rdsLine(d) +
        '<div class="smallprint"><span class="lbl">Small print · tap to read (costs patience)</span><div class="tells">' + [0, 1, 2].map((i) => this.tellHTML(i)).join('') + '</div></div>' +
        '<div id="ins">' + this.insightHTML() + '</div>' +
        (c.blocked ? '<div class="insight" style="--c:var(--bad);margin-top:6px"><span class="pip"></span>' + esc(c.blocked) + '</div>' : '') +
        '<div class="stamp ghoststamp" id="gs"></div></div>';
      const slip = area.querySelector('#slip');
      slip.querySelectorAll('.tell').forEach((t) => t.addEventListener('click', (e) => { e.stopPropagation(); this.reveal(+t.dataset.t); }));
      const gs = slip.querySelector('#gs');
      const dir = (dx, dy) => (Math.abs(dy) > Math.abs(dx) && dy > 0 ? 1 : dx > 0 ? 2 : 0);
      draggable(slip, {
        enabled: () => this.cur && !this.cur.busy && !this.over,
        onStart: () => slip.classList.add('dragging'),
        onMove: (dx, dy) => {
          slip.style.transform = 'translate(' + dx + 'px,' + Math.max(-40, dy) + 'px) rotate(' + dx / 18 + 'deg)';
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          gs.textContent = ['Decline', 'Small line', 'Big line'][k];
          gs.style.borderColor = gs.style.color = k === 0 ? 'var(--stamp)' : k === 1 ? '#1b2a6b' : '#1d7a4c';
          gs.style.opacity = Math.min(0.95, dist / 110);
        },
        onEnd: (dx, dy, vx, vy, e, cancelled) => {
          slip.classList.remove('dragging');
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          if (!cancelled && (dist > 95 || (k === 2 && vx > 900) || (k === 0 && vx < -900) || (k === 1 && vy > 900)) && !(k > 0 && this.cur.blocked)) { gs.style.opacity = 0; this.decide(k); }
          else {
            if (k > 0 && this.cur && this.cur.blocked) toast('Can’t bind this one', this.cur.blocked, 'var(--bad)');
            slip.classList.add('back'); slip.style.transform = ''; gs.style.opacity = 0;
            setTimeout(() => slip.classList.remove('back'), 320);
          }
        }
      });
    },
    reveal(i) {
      const c = this.cur; if (!c || c.busy || c.revealed[i]) return;
      c.revealed[i] = true; c.patience = Math.max(0.04, c.patience - 0.15);
      Sound.tick();
      const t = this.root.querySelector('.tell[data-t="' + i + '"]');
      if (t) t.replaceWith(el(this.tellHTML(i)));
    },
    revealNext() { if (!this.cur) return; const i = this.cur.revealed.indexOf(false); if (i >= 0) this.reveal(i); },
    decide(line) {
      const c = this.cur; if (!c || c.busy || this.over) return;
      if (line > 0 && c.blocked) { toast('Can’t bind this one', c.blocked, 'var(--bad)'); return; }
      c.busy = true;
      const d = c.d;
      G.decisionTimes.push(this.t - c.shownAt);
      const slip = this.root.querySelector('#slip');
      if (line === 0) {
        Sound.crumple();
        if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(-120px,140px) scale(.15) rotate(-260deg)', opacity: 0 }], { duration: 480, easing: 'ease-in', fill: 'forwards' });
        if (rand() < 0.5) { G.walked.push({ d, to: G.nemesis }); this.tick(E.RIVALS[G.nemesis].name + ' scratched the ' + d.label.toLowerCase() + ' you declined.'); }
      } else {
        const room = this.Y.capacity * 1.3 - yoaTot(this.y);
        const P = E.round1(Math.max(0.5, Math.min(d.base * line, room)));
        const entry = { deal: d, P, start: 12 * this.y + (this.phase === 'mid17' ? 6 : 0), yoa: this.y, line };
        G.entries.push(entry);
        if (line === 2) G.bigLines++;
        if (this.phase === 'rush' && this.clock < 3) G.midnightScratch = true;
        if (d.q < 0.95) G.streak++; else G.streak = 0;
        if (G.streak >= 3) {
          G.streak = 0; G.hotLeft = 2;
          toast('Hot box!', 'Three good binds in a row. Better brokers are queueing.', 'var(--brass)');
          const box = this.root.querySelector('#box'); box.classList.add('hotbox'); setTimeout(() => box.classList.remove('hotbox'), 15000 / SPEED);
        }
        if (slip) {
          slamStamp(slip, 'Scratched<small>Synd ' + G.no + ' · ' + (line === 2 ? '20' : '10') + '% line · £' + P.toFixed(1) + 'm</small>', { pos: 'right:6%;top:34%', rot: -8, shake: false, blue: line === 1 });
          Sound.kaching();
          const [x, yy] = centre(slip); FX.burst(x, yy, 'coins', line === 2 ? 26 : 14);
          setTimeout(() => {
            const shelf = this.root.querySelector('#shelf'); if (!shelf || !slip.isConnected) return;
            const [sx, sy] = centre(shelf);
            slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(' + (sx - x) + 'px,' + (sy - yy) + 'px) scale(.08)', opacity: 0.3 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
          }, 380 / SPEED);
        }
        this.addBinder(entry);
        this.checkGWP();
        toast('+£' + P.toFixed(1) + 'm premium', d.label, clsColor(d.cls), 1.6);
      }
      setTimeout(() => this.clearDeal(), 700 / SPEED);
      this.nextAt = this.t + 0.8;
      this.updateRace();
    },
    walk(silent) {
      const c = this.cur; if (!c || c.busy) return;
      c.busy = true;
      G.walked.push({ d: c.d, to: G.nemesis });
      const b = this.root.querySelector('#brokerRow .bubble'); if (b) b.textContent = 'Fine. I’ll take it to ' + E.RIVALS[G.nemesis].name + '.';
      const slip = this.root.querySelector('#slip');
      if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(140%) rotate(12deg)', opacity: 0 }], { duration: 520, easing: 'ease-in', fill: 'forwards' });
      Sound.whoosh();
      G.decisionTimes.push(c.total);
      if (!silent) this.tick(E.RIVALS[G.nemesis].name + ' picked up the ' + c.d.label.toLowerCase() + '. You took too long.');
      setTimeout(() => this.clearDeal(), 800 / SPEED);
      this.nextAt = this.t + 1.0;
    },
    clearDeal() {
      this.cur = null;
      if (!this.root || (this.phase !== 'rush' && this.phase !== 'mid17')) return;
      this.root.querySelector('#brokerRow').innerHTML = '';
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">' + (this.deckIdx >= this.deck.length ? 'That’s every broker for this window.' : 'Next broker approaching…') + '</p>';
    },
    checkGWP() {
      const bt = yoaTot(this.y), key = 'gwp' + this.y;
      if (!G.pmdFlags[key] && bt > this.Y.capacity * 1.2) { G.pmdFlags[key] = true; this.pmdLetter('your YoA ' + yoaName(this.y) + ' premium is running at ' + pct(bt / this.Y.capacity) + ' of plan.'); }
    },
    pmdLetter(text) {
      G.pmd++; G.pmdNotes.push(text);
      const l = el('<div class="letter" role="status"><h4>Lloyd’s Performance Management</h4>Dear Active Underwriter,<br>We note that ' + esc(text) + ' Please explain.<br><b>−1,000 points</b></div>');
      this.root.querySelector('#box').appendChild(l);
      Sound.thud();
      setTimeout(() => l.remove(), 6000 / Math.min(SPEED, 2));
    },
    q1Review() {
      this.setPhase('q1', '1 March · Q1 review');
      const st = this.rdsState(12 * this.y + 2);
      const over = st.rows.filter((x) => x.pct > 1);
      const drift = this.drift();
      const box = this.root.querySelector('#slotArea');
      box.innerHTML = '<div class="ffpanel" id="q1panel" style="position:relative"><span class="eyebrow">Lloyd’s Q1 review</span><div class="ffmonth">YoA ' + yoaName(this.y) + '</div><p>' +
        (over.length ? esc(E.RDS[over[0].r].name) + ' is at ' + Math.round(over[0].pct * 100) + '% of your agreed appetite.' : 'RDS within appetite.') + ' Mix ' + Math.round(drift) + ' points from plan.</p></div>';
      const panel = box.querySelector('#q1panel');
      if (over.length) this.pmdLetter('your net ' + E.RDS[over[0].r].name + ' exposure is ' + Math.round(over[0].pct * 100) + '% of the appetite in your plan.');
      else if (drift > 35 && yoaTot(this.y) > this.Y.capacity * 0.3) this.pmdLetter('your business mix has drifted ' + Math.round(drift) + ' points from your SBF.');
      else slamStamp(panel, 'On track<small>Q1 review</small>', { pos: 'right:8%;top:22%', rot: -7, shake: false, blue: true });
      this.over = true;
      setTimeout(() => this.resumeFF(), (over.length ? 2600 : 1500) / SPEED);
    },

    // ---- the bookcase: one shelf per year of account ----
    renderShelf() {
      const shelf = this.root.querySelector('#shelf');
      shelf.innerHTML = '';
      for (let k = 0; k <= this.y; k++) shelf.appendChild(el('<div class="shelfgroup" data-y="' + k + '"><span class="yoalbl">' + yoaName(k) + '</span></div>'));
      G.entries.forEach((e) => this.addBinder(e, true));
      if (!G.entries.length) shelf.appendChild(el('<span class="empty">Your book is empty. Bind something.</span>'));
    },
    addBinder(entry, quiet) {
      const shelf = this.root.querySelector('#shelf');
      const empty = shelf.querySelector('.empty'); if (empty) empty.remove();
      let grp = shelf.querySelector('.shelfgroup[data-y="' + entry.yoa + '"]');
      if (!grp) { grp = el('<div class="shelfgroup" data-y="' + entry.yoa + '"><span class="yoalbl">' + yoaName(entry.yoa) + '</span></div>'); shelf.appendChild(grp); }
      const w = Math.max(12, Math.min(40, entry.P * 2.2));
      const n = el('<button class="binder' + (quiet ? ' quiet' : '') + '" style="--c:' + clsColor(entry.deal.cls) + ';--w:' + w + 'px" aria-label="' + esc(entry.deal.label) + '"><span class="lbl">' + esc(E.CLASSES[entry.deal.cls].short) + '</span><span class="st"></span></button>');
      entry.node = n;
      n.addEventListener('click', (e) => { e.stopPropagation(); this.binderInfo(entry); });
      grp.appendChild(n);
      shelf.scrollLeft = shelf.scrollWidth;
      this.paintBinder(entry);
    },
    lineCat(entry) {
      const l = this.res && this.res.lines.find((x) => x.id === entry.deal.id && x.yoa === entry.yoa);
      return l ? l.cat : 0;
    },
    paintBinder(entry) {
      const n = entry.node; if (!n) return;
      const st = n.querySelector('.st');
      st.className = 'st';
      if (this.abs() - entry.start >= 2 || entry.alert || entry.yoa < this.y) st.classList.add(E.bookTrafficLight(entry, G.market, this.lineCat(entry)).light);
      n.classList.toggle('scorched', !!entry.catHit);
      n.classList.toggle('exited', entry.alert === 'exit' || !!entry.shredded);
    },
    binderInfo(entry) {
      this.root.querySelectorAll('.popover').forEach((p) => p.remove());
      const d = entry.deal;
      const pending = entry.alertPending;
      const tl = E.bookTrafficLight(entry, G.market, this.lineCat(entry));
      const p = el('<div class="popover" role="dialog"><h4>' + esc(d.label) + '</h4><div>' + esc(E.CLASSES[d.cls].name) + ' · YoA ' + yoaName(entry.yoa) + ' · incepts ' + d.window + '<br>£' + entry.P.toFixed(1) + 'm written' + (entry.catHit ? ' · hit by a catastrophe' : '') + (entry.alert ? ' · ' + ({ audit: 'audited', exit: 'exited', ignore: 'alert ignored' })[entry.alert] : '') + (entry.shredded ? ' · not renewed' : '') + '<br>Loss ratio so far: ' + Math.round(tl.lr * 100) + '%</div>' +
        (pending ? '<div><b>' + esc(entry.alertMsg) + '</b></div><div class="row"><button class="btn primary" data-a="audit">Audit' + (G.au === 'forensic' ? ' (free)' : ' (£0.3m)') + '</button><button class="btn danger" data-a="exit">Exit the book</button></div>' : '<div class="row"><button class="btn ghost" data-a="close">Close</button></div>') + '</div>');
      const box = this.root.querySelector('.side');
      box.style.position = 'relative';
      p.style.left = '0'; p.style.bottom = '100%';
      box.appendChild(p);
      p.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => { const a = b.dataset.a; p.remove(); if (a !== 'close') this.resolveAlert(entry, a); }));
      setTimeout(() => { const off = (e) => { if (!p.contains(e.target)) { p.remove(); removeEventListener('pointerdown', off, true); } }; addEventListener('pointerdown', off, true); }, 0);
    },
    triggerAlert() {
      const abs = this.abs();
      const cands = G.entries.filter((b) => b.start < abs && b.start + 12 > abs && !b.alert && !b.alertPending && !b.catHit && !b.deal.forced);
      if (!cands.length) return false;
      const worst = cands.reduce((a, b) => (b.deal.q > a.deal.q ? b : a));
      worst.alertPending = true; worst.alertMonth = Math.floor(abs);
      worst.alertMsg = pick(['Bordereaux are three months late.', 'The book grew 60% overnight.', 'Claims notifications have doubled.', 'The coverholder has changed its name. Again.']);
      G.alerts.push(worst);
      if (worst.node) { worst.node.classList.add('smoking'); worst.node.appendChild(el('<span class="smoke"></span>')); }
      toast('Portfolio alert', worst.deal.label + ': ' + worst.alertMsg + (G.au === 'forensic' ? ' The Forensic says audit it (free).' : ' Tap the smoking binder.'), 'var(--bad)', 6);
      this.alerting = worst; this.alertT = 10;
      this.setPhase('alert', MONTHS[this.month] + ' · portfolio alert');
      const box = this.root.querySelector('#slotArea');
      box.innerHTML = '<div class="ffpanel"><span class="eyebrow">Portfolio alert</span><div class="ffmonth">' + esc(worst.deal.label) + '</div><p>' + esc(worst.alertMsg) + ' Tap the smoking binder on your shelf: audit it, or exit the book. <b class="num" id="alT">10s</b></p></div>';
      if (AUTO) setTimeout(() => this.resolveAlert(worst, worst.deal.q > 1.25 ? 'exit' : 'audit'), 600 / SPEED);
      return true;
    },
    resolveAlert(entry, choice) {
      if (!entry.alertPending) return;
      entry.alertPending = false; entry.alert = choice;
      if (entry.node) { entry.node.classList.remove('smoking'); entry.node.querySelectorAll('.smoke').forEach((s) => s.remove()); }
      if (choice === 'audit') { toast('Audited', 'The coverholder has been reminded what a bordereau is.', 'var(--good)'); Sound.blip(true); }
      if (choice === 'exit') { toast('Book exited', 'You hand back the unearned premium and walk away.', 'var(--warn)'); Sound.crumple(); }
      if (choice === 'ignore') toast('Alert ignored', entry.deal.label + ' is getting worse.', 'var(--bad)');
      this.paintBinder(entry);
      if (this.alerting === entry) { this.alerting = null; if (this.phase === 'alert') this.resumeFF(); }
    },

    // ---- favours ----
    wireFavour(n) {
      const k = n.dataset.f;
      draggable(n, {
        enabled: () => G.favours[k],
        onStart: () => n.classList.add('dragging'),
        onMove: (dx, dy) => { n.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 25 + 'deg)'; },
        onEnd: (dx, dy, vx, vy, e) => { n.classList.remove('dragging'); n.style.transform = ''; if (dropTarget(e.clientX, e.clientY, FAVOURS[k][2], n)) this.useFavour(k); },
        onTap: () => this.useFavour(k)
      });
    },
    useFavour(k) {
      if (!G.favours[k]) return;
      if (k === 'lunch') {
        if (!this.cur || this.cur.busy) { toast('No slip on the table', 'Save the lunch for a broker.', 'var(--warn)'); return; }
        this.cur.lunch = true;
        const ins = this.root.querySelector('#ins'); if (ins) ins.innerHTML = this.insightHTML();
        toast('Long Lunch', 'Three courses later, the truth comes out.', 'var(--brass)');
      }
      if (k === 'reins') { G.armedReins = true; toast('Reinsurance Call armed', 'The next catastrophe hit is halved.', 'var(--brass)'); }
      if (k === 'poach') {
        const w = [...G.walked].reverse().find((x) => x.to === G.nemesis && !x.poached && x.d.year === this.y);
        if (!w) { toast('Nothing to poach yet', E.RIVALS[G.nemesis].name + ' hasn’t taken anything of yours this year.', 'var(--warn)'); return; }
        const room = this.Y.capacity * 1.3 - yoaTot(this.y);
        if (room < 0.5) { toast('No room', 'Your stamp capacity is full.', 'var(--warn)'); return; }
        w.poached = true;
        const entry = { deal: w.d, P: E.round1(Math.min(w.d.base, room)), start: 12 * this.y + (w.d.window === '1.7' ? 6 : 0), yoa: this.y, line: 1, poached: true };
        G.entries.push(entry); this.addBinder(entry); this.checkGWP();
        this.tick(E.RIVALS[G.nemesis].name.toUpperCase() + ': “That was OURS.”');
        toast('Poached!', w.d.label + ' is now yours.', 'var(--brass)');
      }
      G.favours[k] = false;
      Sound.blip(true);
      const n = this.root.querySelector('.favour[data-f="' + k + '"]'); if (n) n.classList.add('used');
      this.updateRace();
    },

    // ---- main loop ----
    update(dt) {
      if (this.overlayTick) { this.overlayTick(dt); return; }
      if (this.over) return;
      this.t += dt;
      if (this.phase === 'rush' || this.phase === 'mid17') {
        this.clock -= dt; this.paintClock();
        const c = this.cur;
        if (c && !c.busy) {
          c.patience -= dt / c.total;
          const pat = this.root.querySelector('#pat');
          if (pat) { pat.style.transform = 'scaleX(' + Math.max(0, c.patience) + ')'; pat.style.background = c.patience < 0.3 ? 'var(--bad)' : c.patience < 0.6 ? 'var(--warn)' : 'var(--good)'; }
          if (c.patience <= 0) this.walk();
        }
        if (!this.cur && this.t >= this.nextAt && this.deckIdx < this.deck.length && this.clock > 1.2) this.present();
        if (this.clock <= 0 || (!this.cur && this.deckIdx >= this.deck.length && this.t > this.nextAt + 0.6)) { this.clock = 0; this.endWindow(); }
      } else if (this.phase === 'ff') {
        this.mt += dt / FF_MONTH;
        while (this.mt >= 1 && this.phase === 'ff') {
          this.mt -= 1; this.month++;
          if (this.month >= 12) { this.mt = 0; this.month = 12; }
          G.entries.forEach((e) => this.paintBinder(e));
          this.updateRace();
          if (this.runBeats()) break;
        }
        this.paintPlanner();
      } else if (this.phase === 'alert') {
        this.alertT -= dt;
        const t = this.root.querySelector('#alT'); if (t) t.textContent = Math.max(0, Math.ceil(this.alertT)) + 's';
        if (this.alertT <= 0 && this.alerting) this.resolveAlert(this.alerting, 'ignore');
      }
      this.raceT -= dt;
      if (this.raceT <= 0) { this.raceT = 0.4; this.updateRace(); }
      this.talkT -= dt;
      if (this.talkT <= 0) { this.talkT = 16 + rand() * 10; this.trash(rand() < 0.6 ? 'nemesis' : 'rival2'); }
    }
  };

  // ----- The Year Planner, part 2: renewals, the RDS Board, the business plan, coming into line, the annual report -----
  const SEV_WORD = (s) => (s > 0.85 ? 'extreme' : s > 0.6 ? 'severe' : 'moderate');
  const corColor = (c) => (c < 0.95 ? 'var(--good)' : c < 1.05 ? 'var(--warn)' : 'var(--bad)');
  const STEP_LABEL = { shrink: ['Shrink', '−20%'], hold: ['Hold', '±0%'], grow: ['Grow', '+25%'], large: ['Go large', '+50%'] };

  Object.assign(SCENES.year, {
    // a modal sheet that freezes the year while it is open
    sheet(html, cls) {
      const body = el('<div class="' + (cls || '') + '">' + html + '</div>');
      const o = overlay(body);
      this.over = true;
      return { o, body, close: () => { o.remove(); this.over = false; this.overlayTick = null; } };
    },
    focusLater(node) { setTimeout(() => { if (node && node.isConnected) node.focus({ preventScroll: true }); }, 200); },

    // ---- the RDS Board ----
    rdsRowsHTML(st, hit, only) {
      const rows = only ? st.rows.filter((x) => x.r === hit) : st.rows.slice();
      if (hit && !rows.some((x) => x.r === hit)) rows.push({ r: hit, gross: 0, net: 0, appetite: st.appetite[hit], shielded: (this.Y.outwards || []).includes(hit), pct: 0 });
      if (!rows.length) return '<p class="muted sm">No exposure yet. Bind something and it shows up here.</p>';
      const scale = Math.max(...rows.map((x) => Math.max(x.gross, x.appetite))) * 1.04;
      let out = '';
      for (const g of Object.keys(E.RDS_GROUPS)) {
        const gr = rows.filter((x) => E.RDS[x.r].group === g).sort((a, b) => b.gross - a.gross);
        if (gr.length) out += '<div class="rdsgroup"><h5>' + esc(E.RDS_GROUPS[g]) + '</h5>' + gr.map((x) => this.rdsRowHTML(x, scale, hit)).join('') + '</div>';
      }
      return out;
    },
    rdsRowHTML(x, scale, hit) {
      const R = E.RDS[x.r];
      const w = (v) => Math.max(0, Math.min(100, (v / scale) * 100)).toFixed(1) + '%';
      const over = x.gross > 0 && x.net > x.appetite;
      return '<button class="rdsrow' + (over ? ' over' : '') + (x.shielded ? ' shielded' : '') + (hit === x.r ? ' threat' : '') + '" data-r="' + x.r + '">' +
        '<span class="ri">' + icon(R.icon) + '</span><span class="rn"><b>' + esc(R.name) + '</b><small>' +
        (x.gross > 0 ? fmtM(x.gross) + ' gross · ' + fmtM(x.net) + ' net · ' + Math.round(x.pct * 100) + '% of appetite' : 'No exposure') + '</small></span>' +
        '<span class="rs">' + (x.shielded ? icon('shield') : '') + '</span>' +
        '<span class="rbar"><i class="g" style="width:' + w(x.gross) + '"></i><i class="n" style="width:' + w(x.net) + '"></i><span class="ap" style="left:' + w(x.appetite) + '"></span></span></button>';
    },
    openRDS(opt) {
      if (opt.mode === 'event') return this.catastrophe(opt.e);
      if (opt.mode === 'outwards') return this.outwards();
      if (this.over || this.overlayTick) return;
      this.root.querySelector('#rdsBtn').classList.remove('hot');
      const st = this.rdsState();
      const S = this.sheet('<span class="eyebrow">' + MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y) + ' · Realistic Disaster Scenarios</span><h3>RDS Board</h3>' +
        '<p class="muted sm">Your gross loss if each scenario happened in full, against the appetite in your business plan (the white line). Solid bars are net of your shields.</p>' +
        '<div class="rdsboard">' + this.rdsRowsHTML(st) + '</div>' +
        '<div class="boardfoot stickfoot"><span class="muted sm">' + (G.armedReins ? 'Reinsurance Call armed: it halves the next catastrophe hit.' : (this.Y.outwards || []).length ? 'Shields on: ' + this.Y.outwards.map((r) => esc(E.RDS[r].name)).join(', ') + '.' : 'No shields this year.') + '</span><button class="btn" data-close>Close</button></div>', 'rdssheet');
      const close = () => S.close();
      S.body.querySelector('[data-close]').addEventListener('click', close);
      S.o.addEventListener('click', (ev) => { if (ev.target === S.o) close(); });
      this.focusLater(S.body.querySelector('[data-close]'));
    },

    // 1 January: two annual cat XL shields
    outwards() {
      const y = this.y, at = 12 * y;
      this.Y.outwards = []; this.Y.outwardsCost = 0;
      const st = this.rdsState(at);
      const cost = (r) => E.shieldCost(r, (st.rows.find((x) => x.r === r) || { gross: 0 }).gross);
      const S = this.sheet('<span class="eyebrow">1 January ' + yoaName(y) + ' · outwards</span><h3>Buy your cat XL</h3>' +
