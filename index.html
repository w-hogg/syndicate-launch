<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--PAGE-->
<title>Lime Street Launch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@600;700;800;900&family=Courier+Prime:wght@400;700&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: a one-screen arcade stage. Scenes stack in a centred column (max 1180px);
   the Room (year) becomes a two-column grid on wide screens. One committed dark look: "after hours in the Room". */
:root {
  --night: #0c131b;
  --night-2: #111b26;
  --steel: #182431;
  --steel-2: #203041;
  --girder: #33475c;
  --ink: #e8edf2;
  --ink-2: #a8b5c3;
  --ink-3: #74879b;
  --crane: #3b7bff;
  --crane-2: #a8c6ff;
  --slip: #ece5d3;
  --slip-2: #ddd2b8;
  --slip-ink: #23272c;
  --slip-rule: #c9bb98;
  --stamp: #cf3524;
  --brass: #d3a649;
  --brass-2: #f2d48e;
  --good: #3bb47c;
  --warn: #e3a33b;
  --bad: #e5543f;
  --seg-re: #9283f7;
  --seg-pr: #ee8c3d;
  --seg-ca: #2fb7a6;
  --seg-mat: #4fc3e6;
  --seg-sp: #e862a3;
  --f-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-slip: 'Courier Prime', 'Courier New', Courier, monospace;
  --f-mast: 'UnifrakturMaguntia', 'Old English Text MT', 'Times New Roman', serif;
  --t-xs: 0.72rem;
  --t-s: 0.84rem;
  --t-m: 1rem;
  --t-l: 1.25rem;
  --t-xl: 1.7rem;
  --t-xxl: 2.5rem;
  --radius: 10px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; background: var(--night); }
body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font: 400 15px/1.45 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
img, svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--crane-2); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 700 var(--t-xs)/1 var(--f-ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.display { font-family: var(--f-display); font-weight: 800; letter-spacing: 0.01em; line-height: 0.95; text-transform: uppercase; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app frame ---------- */
.app { position: relative; height: 100%; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; }
.bar {
  display: flex; align-items: center; gap: 10px; padding-block: 10px 6px; min-height: 44px;
}
.bar .brand { font: 800 1.05rem/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.bar .brand svg { width: 22px; height: 22px; }
.bar .step { margin-left: auto; font: 600 var(--t-xs)/1 var(--f-ui); color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.iconbtn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--girder); background: var(--steel); display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { border-color: var(--crane); }
.stage { position: relative; flex: 1; min-height: 0; }
.scene { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.scene.scroll { overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--girder);
  background: var(--steel-2); color: var(--ink); font: 700 var(--t-s)/1 var(--f-ui); letter-spacing: 0.04em;
  text-transform: uppercase; cursor: pointer; transition: transform .12s, background .12s, border-color .12s; user-select: none;
}
.btn:hover { border-color: var(--crane); }
.btn:active { transform: translateY(1px) scale(.98); }
.btn.primary { background: var(--crane); border-color: var(--crane); color: #fff; }
.btn.primary:hover { background: #2f6cf0; }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #1b1407; }
.btn.danger { background: transparent; border-color: var(--bad); color: #ffb3a6; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.kbd { font: 600 0.68rem/1 var(--f-ui); border: 1px solid currentColor; border-radius: 4px; padding: 2px 4px; opacity: .7; }

/* ---------- timer pill ---------- */
.timer { display: inline-flex; align-items: center; gap: 8px; font: 700 var(--t-s)/1 var(--f-ui); color: var(--ink-2); }
.timer .track { width: 90px; height: 6px; border-radius: 3px; background: var(--steel-2); overflow: hidden; }
.timer .fill { height: 100%; width: 100%; background: var(--brass); transform-origin: left; }
.timer.hot .fill { background: var(--bad); }

/* ---------- title ---------- */
.title-scene { align-items: center; justify-content: space-between; text-align: center; padding-block: clamp(20px, 6vh, 64px) 14px; gap: 14px; }
.sky { position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: 16px;
  background:
    radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 33% 9%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 71% 14%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 86% 28%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 52% 22%, #fff4 50%, transparent 51%),
    linear-gradient(180deg, #08101a 0%, #10213a 55%, #1a2f4a 100%);
}
.skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 64%; opacity: .85; display: flex; justify-content: center; align-items: flex-end; z-index: 1; pointer-events: none; }
.skyline svg { height: 100%; width: auto; max-width: 100%; overflow: visible; }
.lift { animation: lift var(--d, 9s) ease-in-out infinite alternate; }
@keyframes lift { from { transform: translateY(0); } to { transform: translateY(var(--h, -180px)); } }
.window-on { animation: flicker var(--fd, 7s) steps(1) infinite; }
@keyframes flicker { 0%, 92% { opacity: 1; } 93%, 100% { opacity: .25; } }
.crane-jib { transform-box: fill-box; transform-origin: 8% 50%; animation: jib 14s ease-in-out infinite alternate; }
@keyframes jib { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
.title-card { position: relative; z-index: 2; display: grid; gap: 12px; justify-items: center; padding: 18px 18px 10px; max-width: 640px; }
.title-card::before { content: ""; position: absolute; inset: -30px -80px; z-index: -1; background: radial-gradient(closest-side, #0a111bf0 55%, #0a111b00); }
.title-bottom { position: relative; z-index: 2; display: grid; gap: 12px; justify-items: center; width: 100%; }
.title-card h1 { font: 900 clamp(3rem, 12vw, 6.4rem)/0.84 var(--f-display); text-transform: uppercase; letter-spacing: 0.01em; text-shadow: 0 4px 0 #0006; }
.title-card h1 span { color: var(--brass-2); display: block; }
.title-card p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.led { position: relative; z-index: 2; width: min(640px, 100%); overflow: hidden; border-radius: 6px; background: #05080c; border: 1px solid #1d2a38; padding: 8px 0; }
.led span { display: inline-block; white-space: nowrap; padding-left: 100%; font: 700 0.95rem/1 var(--f-slip); color: #ffb648; letter-spacing: 0.08em; text-shadow: 0 0 6px #ff9a2a88; animation: marquee 24s linear infinite; }
@keyframes marquee { to { transform: translateX(-100%); } }
.title-actions { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.disclaimer { position: relative; z-index: 2; font-size: var(--t-xs); color: var(--ink-2); margin: 0; background: #0a111bcc; padding: 3px 10px; border-radius: 999px; }

/* ---------- step header ---------- */
.stephead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; padding-block: 6px 12px; }
.stephead h2 { font: 800 var(--t-xl)/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; }
.stephead p { margin: 0; color: var(--ink-2); font-size: var(--t-s); flex-basis: 100%; max-width: 70ch; }
.stephead .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* ---------- build ---------- */
.build-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .build-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--steel); border: 1px solid var(--girder); border-radius: 14px; padding: 14px; min-width: 0; }
.panel > .eyebrow { display: block; margin-bottom: 10px; }
.namebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.synno { font: 800 1.4rem/1 var(--f-display); color: var(--brass-2); letter-spacing: 0.04em; white-space: nowrap; }
.namebar input { flex: 1 1 180px; min-width: 0; height: 40px; border-radius: 8px; border: 1px solid var(--girder); background: var(--night-2); color: var(--ink); padding: 0 12px; font: 600 1rem var(--f-ui); }
.mixes { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .mixes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .mixes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1080px) { .mixes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mixcard {
  position: relative; text-align: left; display: grid; gap: 6px; padding: 10px 10px 10px 12px; border-radius: 10px;
  border: 1px solid var(--girder); background: var(--night-2); cursor: pointer; min-width: 0; transition: border-color .15s, transform .15s, background .15s;
}
.mixcard:hover { border-color: var(--crane); transform: translateY(-1px); }
.mixcard[aria-pressed="true"] { border-color: var(--brass); background: #241f12; box-shadow: 0 0 0 1px var(--brass) inset; }
.mixcard .mname { font: 800 1.02rem/1.05 var(--f-display); text-transform: uppercase; letter-spacing: 0.02em; }
.mixcard .mtag { font-size: var(--t-xs); color: var(--ink-2); }
.mixcard .dots { display: flex; gap: 3px; }
.mixcard .dots i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.minibars { display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; font-size: 0.66rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.minibars b { height: 4px; border-radius: 2px; background: var(--steel-2); position: relative; overflow: hidden; display: block; }
.minibars b::after { content: ""; position: absolute; inset: 0; width: var(--v, 50%); background: var(--ink-2); border-radius: 2px; transition: width .4s; }
.planwrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
@media (max-width: 420px) { .planwrap { grid-template-columns: 120px minmax(0, 1fr); gap: 10px; } }
.ring { width: 100%; aspect-ratio: 1; max-width: 150px; }
.ring text { fill: var(--ink); font-family: var(--f-display); font-weight: 800; }
.stacks { display: grid; gap: 6px; min-width: 0; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--night-2); border: 1px dashed transparent; min-width: 0; }
.stack.drop { border-color: var(--brass); }
.stack .cname { font-weight: 700; font-size: var(--t-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; min-width: 0; }
.stack select { min-width: 0; max-width: 100%; background: transparent; color: var(--ink); border: 0; font: 700 var(--t-s) var(--f-ui); padding: 0; cursor: pointer; }
.stack select option { background: var(--steel); }
.stack .ctl { display: flex; gap: 4px; }
.stack .ctl button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--girder); background: var(--steel-2); cursor: pointer; font-weight: 800; line-height: 1; }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 3px; min-height: 18px; }
.chip { width: 18px; height: 18px; border-radius: 50%; background: var(--c); border: 3px dashed #ffffffb0; box-shadow: 0 1px 0 #0008; cursor: grab; touch-action: none; animation: chipIn .35s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--dl, 0s); }
@keyframes chipIn { from { transform: translateY(-30px) scale(.4); opacity: 0; } }
.chip.ghost { position: fixed; z-index: 50; pointer-events: none; width: 26px; height: 26px; }
.addclass { justify-self: start; font-size: var(--t-xs); padding: 0 12px; min-height: 30px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { background: var(--night-2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.stat .eyebrow { display: block; margin-bottom: 4px; }
.stat .v { font: 800 1.35rem/1 var(--f-display); }
.stat .meter { height: 5px; background: var(--steel-2); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.stat .meter i { display: block; height: 100%; background: var(--brass); width: 50%; transition: width .45s cubic-bezier(.3,1.5,.5,1); }
.shimmer { position: relative; overflow: hidden; }
.shimmer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, #ffffff22 50%, transparent 65%); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.aus { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; perspective: 800px; }
@media (min-width: 640px) { .aus { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 900px) { .aus { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.aucard { position: relative; text-align: left; border-radius: 12px; border: 1px solid var(--girder); background: linear-gradient(160deg, var(--steel-2), var(--night-2)); padding: 10px; cursor: pointer; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .12s, border-color .15s; display: grid; gap: 4px; min-width: 0; }
.aucard[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass) inset, 0 10px 24px #0008; }
.aucard .portrait { width: 64px; height: 64px; border-radius: 50%; background: var(--night); overflow: hidden; border: 2px solid var(--girder); }
.aucard[aria-pressed="true"] .portrait { border-color: var(--brass); }
.aucard .aname { font: 800 1.05rem/1 var(--f-display); text-transform: uppercase; }
.aucard .aline { font-size: var(--t-xs); color: var(--brass-2); }
.aucard .aab { font-size: var(--t-xs); color: var(--ink-2); }
.readyrow { display: flex; justify-content: flex-end; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- pitch / BOC ---------- */
.boardroom { position: relative; flex: 1; min-height: 0; display: grid; align-content: center; gap: 14px; overflow-y: auto; }
.panelists { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; padding-top: 52px; }
.panelist.asking .face { border-color: var(--brass); box-shadow: 0 0 0 4px #d3a64944, 0 0 24px #d3a64966; }
.panelist { display: grid; justify-items: center; gap: 4px; text-align: center; position: relative; min-width: 0; }
.panelist .face { width: min(110px, 26vw); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #2a3d52, var(--night-2)); border: 2px solid var(--girder); overflow: hidden; }
.panelist .pname { font: 800 0.9rem/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; }
.panelist .prole { font-size: 0.66rem; color: var(--ink-3); }
.bubble { position: relative; background: var(--slip); color: var(--slip-ink); border-radius: 12px; padding: 8px 10px; font-size: var(--t-xs); max-width: 22ch; box-shadow: 0 6px 16px #0007; animation: pop .25s cubic-bezier(.2,1.6,.4,1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: var(--slip); transform: translateX(-50%) rotate(45deg); }
.panelist .bubble { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); width: max-content; z-index: 3; }
@keyframes pop { from { transform: translateX(-50%) scale(.5); opacity: 0; } }
.table { position: relative; margin: 0 auto; width: min(760px, 100%); background: linear-gradient(180deg, #4a3322, #2d1f15); border-radius: 50% 50% 12px 12px / 30% 30% 12px 12px; padding: 18px 16px 14px; border: 1px solid #6b4a30; box-shadow: inset 0 3px 0 #ffffff14, 0 12px 30px #0009; }
.table.drop { box-shadow: 0 0 0 3px var(--brass), inset 0 3px 0 #ffffff14; }
.question { text-align: center; font: 700 1.05rem/1.3 var(--f-ui); color: #f6ead6; max-width: 52ch; margin: 0 auto; text-wrap: balance; }
.qmeta { display: flex; justify-content: center; gap: 12px; align-items: center; margin-top: 8px; color: #e8cfae; font-size: var(--t-xs); }
.pen { width: 26px; height: 6px; background: var(--brass); border-radius: 3px; display: inline-block; transform-origin: 90% 50%; animation: pentap var(--pt, .6s) ease-in-out infinite alternate; }
@keyframes pentap { from { transform: rotate(-14deg); } to { transform: rotate(10deg); } }
.answers { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); width: min(980px, 100%); margin: 0 auto; }
@media (min-width: 760px) { .answers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.answer { text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--slip); color: var(--slip-ink); border: 0; font: 600 var(--t-s)/1.35 var(--f-ui); cursor: grab; touch-action: none; box-shadow: 0 4px 0 var(--slip-2), 0 8px 18px #0006; display: flex; gap: 10px; align-items: flex-start; min-width: 0; }
.answer .k { font: 800 0.8rem/1 var(--f-display); background: var(--slip-ink); color: var(--slip); border-radius: 4px; padding: 3px 6px; flex: none; }
.answer.dragging { cursor: grabbing; z-index: 30; position: relative; }
.answer.chosen { outline: 3px solid var(--brass); }
.meterwrap { width: min(980px, 100%); margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: var(--t-xs); color: var(--ink-2); }
.applause { height: 10px; border-radius: 5px; background: var(--steel-2); overflow: hidden; position: relative; }
.applause i { position: absolute; inset: 0 auto 0 0; width: 50%; background: linear-gradient(90deg, var(--bad), var(--warn), var(--good)); transition: width .5s cubic-bezier(.3,1.5,.5,1); }
.docwrap { flex: 1; display: grid; place-items: center; gap: 16px; align-content: center; }
.doc { position: relative; width: min(420px, 100%); background: var(--slip); color: var(--slip-ink); border-radius: 4px; padding: 22px 22px 26px; font: 400 0.86rem/1.6 var(--f-slip); box-shadow: 0 18px 40px #000a; background-image: repeating-linear-gradient(180deg, transparent 0 25px, #c9bb9855 25px 26px); }
.doc h3 { font: 700 1rem/1.2 var(--f-slip); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.doc dl { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; margin: 0; }
.doc dt { color: #6a6252; }
.doc dd { margin: 0; font-weight: 700; }
.holdbtn { position: relative; overflow: hidden; touch-action: none; }
.holdbtn i { position: absolute; inset: 0 auto 0 0; width: 0; background: #ffffff33; }

/* ---------- stamps ---------- */
.stamp {
  position: absolute; z-index: 5; pointer-events: none; padding: 6px 12px; border: 4px double var(--stamp); color: var(--stamp);
  font: 900 1.6rem/0.95 var(--f-display); text-transform: uppercase; letter-spacing: 0.04em; text-align: center; border-radius: 6px;
  transform: rotate(var(--rot, -9deg)); mix-blend-mode: multiply; opacity: .92;
}
.stamp small { display: block; font: 700 0.7rem/1.2 var(--f-slip); letter-spacing: 0.06em; }
.stamp.slam { animation: slam .32s cubic-bezier(.2,1.4,.5,1) both; }
@keyframes slam { 0% { transform: rotate(var(--rot, -9deg)) scale(2.4); opacity: 0; } 70% { transform: rotate(var(--rot, -9deg)) scale(.94); opacity: 1; } 100% { transform: rotate(var(--rot, -9deg)) scale(1); } }
.stamp.blue { border-color: var(--crane); color: var(--crane); }

/* ---------- capital grab ---------- */
.grab { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 128px; gap: 12px; }
@media (max-width: 520px) { .grab { grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; } }
.field { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--girder); background: radial-gradient(ellipse at 50% 120%, #1f3550, var(--night-2) 70%); min-height: 0; touch-action: none; }
.token {
  position: absolute; left: 0; top: 0; width: 112px; min-height: 112px; border-radius: 50%; display: grid; place-content: center; text-align: center; gap: 2px; padding: 12px;
  background: radial-gradient(circle at 35% 30%, #fff3, transparent 45%), var(--tc, var(--brass)); color: #15100a; cursor: grab; touch-action: none;
  border: 3px solid #ffffff55; box-shadow: 0 8px 20px #0009; will-change: transform; user-select: none;
}
@media (max-width: 520px) { .token { width: 92px; min-height: 92px; padding: 8px; } }
.token b { font: 900 1.25rem/1 var(--f-display); }
.token span { font: 700 0.58rem/1.15 var(--f-ui); text-transform: uppercase; letter-spacing: 0.03em; }
.token em { font: 700 0.66rem/1 var(--f-slip); font-style: normal; }
.token.trap { box-shadow: 0 0 0 3px #ff5a3c66, 0 0 22px #ff5a3c88; }
.token.qs { --tc: #9fd0ff; }
.token.taken { transition: transform .4s, opacity .4s; opacity: 0; }
.hand { position: absolute; width: 120px; height: 70px; pointer-events: none; z-index: 4; transition: transform .45s cubic-bezier(.3,1.2,.4,1); }
.vault { position: relative; border-radius: 14px; border: 2px solid var(--girder); background: var(--night-2); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.vault.drop { border-color: var(--brass); box-shadow: 0 0 22px #d3a64966; }
.vault .fillv { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, var(--brass-2), var(--brass)); transition: height .45s cubic-bezier(.3,1.4,.5,1); }
.vault .target { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); transition: bottom .5s; }
.vault .target span { position: absolute; right: 4px; top: -18px; font: 700 0.62rem/1 var(--f-ui); background: var(--night); padding: 2px 4px; border-radius: 3px; }
.vault .vlabel { position: relative; z-index: 2; padding: 8px; text-align: center; font: 800 1rem/1 var(--f-display); text-transform: uppercase; background: #0c131bcc; }
.vault .vlabel small { display: block; font: 600 0.62rem/1.3 var(--f-ui); color: var(--ink-2); text-transform: none; }
.grabstats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--t-s); color: var(--ink-2); padding-top: 8px; }
.grabstats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- red tape ---------- */
.tape { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; align-content: start; overflow-y: auto; }
.form { position: relative; background: var(--slip); color: var(--slip-ink); border-radius: 6px; padding: 12px 12px 10px; font: 400 0.8rem/1.4 var(--f-slip); box-shadow: 0 10px 24px #0009; animation: formIn .35s cubic-bezier(.2,1.5,.4,1); min-width: 0; }
@keyframes formIn { from { transform: translateY(40px) rotate(4deg); opacity: 0; } }
.form h4 { margin: 0 0 4px; font: 700 0.86rem/1.2 var(--f-slip); text-transform: uppercase; }
.form .life { height: 4px; background: var(--slip-2); border-radius: 2px; overflow: hidden; margin: 6px 0; }
.form .life i { display: block; height: 100%; background: var(--stamp); width: 100%; transform-origin: left; }
.signbox { position: relative; height: 64px; border-bottom: 2px solid var(--slip-ink); touch-action: none; cursor: crosshair; }
.signbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.signbox span { position: absolute; left: 4px; bottom: 4px; color: #8a7e62; font-size: 0.72rem; pointer-events: none; }
.form .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
.form .signbtn { min-height: 30px; padding: 0 12px; font-size: 0.7rem; background: var(--slip-ink); color: var(--slip); border: 0; }
.form.done { opacity: .75; }
.form.missed { filter: grayscale(.8); opacity: .55; }

/* ---------- year: the Room ---------- */
.room { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto minmax(0, 1fr) auto auto;
  grid-template-areas: "cal" "derby" "hud" "box" "side" "ticker"; }
@media (min-width: 960px) {
  .room { grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto auto auto minmax(0, 1fr) auto;
    grid-template-areas: "cal cal" "derby side" "hud side" "box side" "ticker ticker"; }
}
.cal { grid-area: cal; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px; }
.cal div { position: relative; height: 22px; border-radius: 4px; background: var(--steel); font: 700 0.62rem/22px var(--f-ui); text-align: center; color: var(--ink-3); overflow: hidden; text-transform: uppercase; }
.cal div i { position: absolute; inset: 0 auto 0 0; width: 0; background: #3b7bff33; }
.cal div.now { color: var(--ink); box-shadow: 0 0 0 1px var(--crane) inset; }
.cal div.done { color: var(--ink-2); }
.cal div.ev::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
.derby { grid-area: derby; background: var(--steel); border: 1px solid var(--girder); border-radius: 12px; padding: 8px 10px; display: grid; gap: 4px; }
.lane { position: relative; display: grid; grid-template-columns: 92px minmax(0, 1fr) 56px; gap: 8px; align-items: center; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; }
.lane .ln { font: 700 0.72rem/1 var(--f-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .track { position: relative; height: 16px; border-radius: 8px; background: repeating-linear-gradient(90deg, var(--night-2) 0 18px, #0f1823 18px 20px); }
.lane .zero { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--girder); }
.lane .runner { position: absolute; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--lc); border: 2px solid #0c131b; transition: left .35s linear; display: grid; place-items: center; font: 900 0.6rem/1 var(--f-display); color: #0c131b; }
.lane.ghost .runner { background: transparent; border: 2px dashed var(--lc); }
.lane .lv { font: 700 0.74rem/1 var(--f-ui); text-align: right; font-variant-numeric: tabular-nums; }
.lane.you .ln { color: var(--crane-2); }
.lane .talk { position: absolute; z-index: 6; left: 92px; top: -30px; }
.lane .talk .bubble { transform: none; animation: none; }
.hud { grid-area: hud; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; align-items: stretch; }
.gauge { background: var(--steel); border: 1px solid var(--girder); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.gauge .eyebrow { font-size: 0.6rem; display: flex; justify-content: space-between; gap: 6px; }
.gauge .eyebrow b { color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
.bar2 { position: relative; height: 8px; border-radius: 4px; background: var(--night-2); margin-top: 5px; overflow: hidden; }
.bar2 i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--good); transition: width .4s; }
.bar2 .line { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--bad); }
.mixbars { display: grid; gap: 2px; margin-top: 4px; }
.mixbars div { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--night-2); }
.mixbars span { display: block; height: 100%; transition: width .4s; }
.perilbtn { min-height: 0; height: 100%; border-radius: 10px; padding: 0 12px; display: grid; place-items: center; gap: 2px; background: var(--steel); border: 1px solid var(--girder); cursor: pointer; font: 700 0.6rem/1 var(--f-ui); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.perilbtn svg { width: 22px; height: 22px; }
.perilbtn.hot { border-color: var(--bad); color: #ffd2c9; box-shadow: 0 0 calc(var(--heat, 0) * 24px) #e5543f; animation: throb 1.2s ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.04); } }
.box { grid-area: box; position: relative; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; border-radius: 14px; background: radial-gradient(ellipse at 50% 0%, #1e3048, var(--night-2) 70%); border: 1px solid var(--girder); padding: 10px; overflow: hidden; }
.box.hotbox { box-shadow: 0 0 0 2px var(--brass), 0 0 30px #d3a64955 inset; }
.brokerrow { display: flex; gap: 10px; align-items: flex-end; min-height: 64px; }
.brokerrow .face { flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--night); border: 2px solid var(--girder); overflow: hidden; animation: walkin .5s cubic-bezier(.2,1.2,.4,1); }
@keyframes walkin { from { transform: translateX(-60px); opacity: 0; } }
.brokerrow .who { display: grid; gap: 4px; min-width: 0; flex: 1; }
.brokerrow .bname { font: 800 0.95rem/1 var(--f-display); text-transform: uppercase; }
.brokerrow .bname small { font: 600 0.66rem var(--f-ui); color: var(--ink-3); text-transform: none; margin-left: 6px; }
.brokerrow .bubble { animation: none; max-width: 100%; }
.brokerrow .bubble::after { left: 18px; bottom: auto; top: -6px; }
.patience { height: 5px; border-radius: 3px; background: var(--steel-2); overflow: hidden; }
.patience i { display: block; height: 100%; width: 100%; background: var(--good); transform-origin: left; }
.slotarea { position: relative; min-height: 0; display: grid; place-items: center; }
.slip {
  position: relative; width: min(440px, 100%); max-height: 100%; overflow: hidden; background: var(--slip); color: var(--slip-ink); border-radius: 6px; padding: 12px 14px 12px 34px;
  font: 400 0.82rem/1.45 var(--f-slip); box-shadow: 0 16px 34px #000b; cursor: grab; touch-action: none; user-select: none; will-change: transform;
  background-image: linear-gradient(90deg, transparent 22px, #cf352455 22px 23px, transparent 23px), repeating-linear-gradient(180deg, transparent 0 22px, #c9bb9844 22px 23px);
  animation: slipIn .4s cubic-bezier(.2,1.3,.4,1);
}
@keyframes slipIn { from { transform: translateY(-40px) rotate(-3deg); opacity: 0; } }
.slip.dragging { cursor: grabbing; transition: none; }
.slip.back { transition: transform .3s cubic-bezier(.2,1.4,.4,1); }
.slip .holes { position: absolute; left: 7px; top: 14px; bottom: 14px; display: flex; flex-direction: column; justify-content: space-around; }
.slip .holes i { width: 9px; height: 9px; border-radius: 50%; background: var(--night-2); box-shadow: inset 0 1px 2px #000a; }
.slip .sh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font: 700 0.68rem/1.2 var(--f-slip); text-transform: uppercase; letter-spacing: 0.08em; color: #6a6252; }
.slip h3 { font: 700 1.02rem/1.25 var(--f-slip); margin: 2px 0 6px; }
.slip .clsrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.tag { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 8px; font: 700 0.68rem/1.4 var(--f-ui); background: #23272c14; border: 1px solid #23272c33; color: var(--slip-ink); white-space: nowrap; }
.tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tag svg { width: 14px; height: 14px; }
.tag.off { border-color: var(--stamp); color: var(--stamp); }
.slip .terms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
.slip .terms div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dotted var(--slip-rule); }
.slip .terms b { font-weight: 700; }
.smallprint { margin-top: 8px; display: grid; gap: 4px; }
.smallprint .lbl { font: 700 0.62rem/1 var(--f-ui); letter-spacing: 0.1em; text-transform: uppercase; color: #6a6252; }
.tells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.tell { border: 1px dashed #23272c55; border-radius: 6px; padding: 4px 6px; min-height: 40px; background: transparent; color: var(--slip-ink); text-align: left; cursor: pointer; font: 400 0.7rem/1.25 var(--f-slip); min-width: 0; }
.tell .redact { display: block; height: 10px; margin-top: 4px; background: var(--slip-ink); border-radius: 2px; }
.tell b { display: block; font-size: 0.84rem; }
.tell.good b { color: #1d7a4c; }
.tell.bad b { color: var(--stamp); }
.insight { margin-top: 8px; display: flex; gap: 8px; align-items: center; font: 700 0.74rem/1.3 var(--f-ui); background: #23272c10; border-radius: 6px; padding: 6px 8px; }
.insight .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--c, #888); flex: none; }
.ghoststamp { position: absolute; z-index: 4; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-12deg); opacity: 0; pointer-events: none; }
.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.actions .btn { padding: 0 8px; min-width: 0; }
.actions .btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.waiting { text-align: center; color: var(--ink-3); font-size: var(--t-s); }
.side { grid-area: side; display: grid; gap: 8px; min-height: 0; align-content: start; }
.favours { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.favour { position: relative; border-radius: 10px; border: 1px solid var(--brass); background: linear-gradient(160deg, #2d2412, #1a150b); padding: 8px; text-align: left; cursor: grab; touch-action: none; display: grid; gap: 2px; min-width: 0; color: var(--ink); }
.favour b { font: 800 0.86rem/1 var(--f-display); text-transform: uppercase; color: var(--brass-2); }
.favour span { font-size: 0.64rem; color: var(--ink-2); line-height: 1.25; }
.favour.used { opacity: .3; pointer-events: none; filter: grayscale(1); }
@media (max-width: 959px) {
  .side { grid-template-columns: 118px minmax(0, 1fr); align-items: stretch; }
  .favours { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .favour { padding: 5px 8px; }
  .favour span { display: none; }
  .favour b { font-size: 0.78rem; }
  .shelf { min-height: 0; padding: 6px 6px 10px; }
  .binder { height: 58px; }
  .derby { padding: 6px 8px; gap: 2px; }
  .lane .track { height: 12px; }
  .lane .runner { width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px; font-size: .55rem; }
  .lane { grid-template-columns: 78px minmax(0, 1fr) 50px; }
  .room { gap: 6px; grid-template-rows: auto auto auto minmax(390px, 1fr) auto auto; }
  .brokerrow { min-height: 52px; }
  .brokerrow .face { width: 48px; height: 48px; }
  .slip { padding: 9px 10px 9px 28px; font-size: 0.74rem; line-height: 1.35; }
  .slip h3 { font-size: 0.9rem; margin: 2px 0 4px; }
  .slip .holes { left: 5px; }
  .slip .clsrow { margin-bottom: 4px; }
  .smallprint { margin-top: 5px; }
  .tell { min-height: 34px; padding: 3px 5px; }
  .insight { margin-top: 5px; padding: 5px 7px; font-size: 0.7rem; }
  .box { padding: 8px; gap: 6px; }
}
@media (min-width: 960px) { .slip { width: min(500px, 100%); font-size: 0.88rem; } .slip h3 { font-size: 1.12rem; } }
.favour.dragging { z-index: 40; cursor: grabbing; }
.shelf { position: relative; background: linear-gradient(180deg, transparent 0 calc(100% - 10px), #5b4330 calc(100% - 10px)); border-radius: 10px; border: 1px solid var(--girder); padding: 8px 8px 12px; min-height: 96px; display: flex; gap: 4px; align-items: flex-end; overflow-x: auto; overflow-y: hidden; }
@media (min-width: 960px) { .shelf { flex-wrap: wrap; align-content: flex-end; max-height: 320px; overflow-y: auto; } }
.shelf .empty { color: var(--ink-3); font-size: var(--t-xs); align-self: center; margin: 0 auto; text-align: center; }
.binder { position: relative; flex: none; width: var(--w, 22px); height: 74px; border-radius: 3px 3px 2px 2px; background: linear-gradient(90deg, #0003, transparent 30%, #fff2 50%, transparent 70%, #0003), var(--c); border: 1px solid #0006; cursor: pointer; padding: 0; animation: binderIn .45s cubic-bezier(.2,1.6,.4,1); }
@keyframes binderIn { from { transform: translateY(-80px) rotate(-20deg); opacity: 0; } }
.binder::before { content: ""; position: absolute; left: 50%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid #ffffffaa; }
.binder .lbl { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; font: 700 0.56rem/1 var(--f-ui); color: #0c131bdd; white-space: nowrap; max-height: 44px; overflow: hidden; }
.binder .st { position: absolute; top: -5px; right: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--night); background: var(--ink-3); }
.binder .st.good { background: var(--good); } .binder .st.warn { background: var(--warn); } .binder .st.bad { background: var(--bad); }
.binder.scorched { filter: sepia(.6) brightness(.7); }
.binder.smoking { animation: wobble .5s ease-in-out infinite alternate; outline: 2px solid var(--bad); }
.binder.exited { opacity: .35; }
@keyframes wobble { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
.smoke { position: absolute; left: 50%; top: -6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #9aa6b2aa; animation: smoke 1.2s ease-out infinite; pointer-events: none; }
@keyframes smoke { from { transform: translateY(0) scale(.6); opacity: .9; } to { transform: translateY(-34px) scale(1.8); opacity: 0; } }
.ticker { grid-area: ticker; overflow: hidden; border-radius: 6px; background: #05080c; border: 1px solid #1d2a38; height: 28px; position: relative; }
.ticker span { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 0.78rem/28px var(--f-slip); color: #ffb648; padding-left: 12px; }
.popover { position: absolute; z-index: 20; background: var(--slip); color: var(--slip-ink); border-radius: 10px; padding: 10px; width: min(280px, calc(100vw - 40px)); box-shadow: 0 16px 40px #000c; font-size: var(--t-s); display: grid; gap: 8px; }
.popover h4 { margin: 0; font: 800 1rem/1.1 var(--f-display); text-transform: uppercase; }
.popover .row { display: flex; gap: 8px; }
.popover .btn { min-height: 36px; flex: 1; font-size: 0.7rem; padding: 0 8px; }
.popover .btn.ghost { background: transparent; color: var(--slip-ink); border-color: #23272c55; }

/* ---------- overlay / peril board / modals ---------- */
.overlay { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: #05080ccc; padding: 10px 0; backdrop-filter: blur(2px); }
.sheet { position: relative; width: min(760px, 100%); max-height: 100%; overflow-y: auto; background: var(--steel); border: 1px solid var(--girder); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 30px 60px #000c; }
.sheet h3 { font: 800 var(--t-xl)/1 var(--f-display); text-transform: uppercase; }
.forecast { display: flex; gap: 10px; align-items: center; background: #2b1210; border: 1px solid #7a2a1e; border-radius: 10px; padding: 8px 10px; color: #ffd7cf; font-size: var(--t-s); }
.forecast svg { flex: none; width: 28px; height: 28px; }
.board { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 560px) { .board { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.tile { position: relative; min-height: 76px; border-radius: 10px; background: var(--night-2); border: 1px solid var(--girder); padding: 6px; display: grid; grid-template-rows: auto 1fr auto; gap: 2px; cursor: pointer; text-align: left; min-width: 0; color: var(--ink); }
.tile .tn { font: 700 0.64rem/1.15 var(--f-ui); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
.tile svg.ic { width: 22px; height: 22px; opacity: .75; }
.tile .pins { display: flex; flex-wrap: wrap; gap: 2px; }
.tile .pins i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); border: 1px solid #0008; }
.tile .exp { font: 700 0.66rem/1 var(--f-ui); color: var(--ink); font-variant-numeric: tabular-nums; }
.tile.threat { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; animation: threat 1s ease-in-out infinite alternate; }
@keyframes threat { to { background: #3a1712; } }
.tile.shielded { box-shadow: 0 0 0 3px var(--crane-2) inset; }
.tile.drop { border-color: var(--brass); }
.tile.hit { background: #5b1a12; animation: none; }
.shieldtok { justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; background: var(--crane); color: #fff; font: 800 0.8rem/1 var(--f-ui); text-transform: uppercase; cursor: grab; touch-action: none; border: 0; }
.shieldtok svg { width: 18px; height: 18px; }
.shieldtok.dragging { position: fixed; z-index: 60; cursor: grabbing; }
.boardfoot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.lossline { font: 800 1.3rem/1.1 var(--f-display); color: #ffb3a6; text-transform: uppercase; }
.flash { position: fixed; inset: 0; z-index: 70; background: #fff; pointer-events: none; opacity: 0; }
.flash.go { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); } 30%, 50%, 70% { transform: translate(-7px, 3px); } 40%, 60% { transform: translate(7px, -3px); } }
.inter { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; background: #0c131bf2; text-align: center; padding: 20px 0; cursor: pointer; }
.inter .ic { display: grid; gap: 12px; justify-items: center; max-width: 560px; }
.inter h2 { font: 900 clamp(2.2rem, 8vw, 4rem)/0.9 var(--f-display); text-transform: uppercase; }
.inter .real { font: 400 1rem/1.5 var(--f-slip); color: var(--brass-2); max-width: 48ch; }
.inter .real b { color: var(--ink); }

/* Lime Street Launch engine: pure data and maths, no DOM. */
(function (root) {
  'use strict';

  // ---------- seeded randomness ----------
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) {
      h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function rng(seed) {
    let a = typeof seed === 'string' ? hashStr(seed) : seed >>> 0;
    const next = function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    next.normal = function (mu, sd) {

      let tot = 0; for (const p of pairs) tot += p[1];
      let x = next() * tot;

      return pairs[pairs.length - 1][0];

    const day = date.getUTCDay() || 7;

    const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    const week = Math.ceil(((date - yearStart) / 86400000 + 1) / 7);

  // ---------- the world ----------

    { id: 'propdf', name: 'Property D&F / US E&S', seg: 'pr', tag: 'Binders all the way down.', split: { propdf: 7, propcat: 2, terror: 1 } },
    { id: 'castreaty', name: 'Casualty Treaty', seg: 're', tag: 'Looks great… until year 3.', split: { castreaty: 7, finlines: 3 } },

  const MIX_BY_ID = Object.fromEntries(MIXES.map(m => [m.id, m]));

  const AUS = {
    veteran: { name: 'The Veteran', line: '30 years in the Room', ability: 'Brokers wait 40% longer, and you can read their gut tells.' },
    quant: { name: 'The Quant', line: 'Has a model for lunch', ability: 'Sees the price adequacy on every slip, and halves reserve shocks.' },

  const BROKERS = {
    hal: { name: 'Honest Hal', firm: 'Gallop & Finch', patience: 1, size: 1, qBias: 0, commAdj: 0 },
    seb: { name: 'Smooth Sebastian', firm: 'Velvet Rope Re', patience: 1, size: 1.1, qBias: 0.04, commAdj: 0.02 },

    bot: { name: 'PlacementBot 3000', firm: 'AlgoPlace', patience: 0.7, size: 0.7, qBias: 0, commAdj: -0.02 }
  };

  const MODIFIERS = [
    { id: 'soft-prop', text: 'Soft market: property cat rates −10%', lr: { propcat: 0.05, propdf: 0.03, parametric: 0.04 } },
    { id: 'cyber-soft', text: 'Cyber pricing slides again: rates −15%', lr: { cyber: 0.06, techeo: 0.03 } },
    { id: 'marine-hard', text: 'Marine hardens after last year’s losses: rates +10%', lr: { marine: -0.05, energy: -0.04 } },
    { id: 'cas-release', text: 'Casualty reserves are looking healthy', res: { castreaty: -0.04, finlines: -0.03, techeo: -0.02 } },
    { id: 'cas-inflation', text: 'Social inflation bites: casualty reserves under pressure', res: { castreaty: 0.04, finlines: 0.03 } },
    { id: 'capital-glut', text: 'Capital glut: everyone wants to back a syndicate', cap: -0.02 },
    { id: 'capital-crunch', text: 'Capital crunch: investors are nervous', cap: 0.02 },
    { id: 'specialty-boom', text: 'Geopolitics lifts specialty rates +10%', lr: { terror: -0.04, prc: -0.04, aviation: -0.03 } },
    { id: 'benign', text: 'Steady market. No surprises (yet).' }
  ];

  const PLAN_GWP = 100;      // £m stamp capacity applied for
  const FIXED_COSTS = 8;     // £m team, Lloyd's fees, ops
  const ECU = 1.35;          // economic capital uplift
  const SOLVENCY_LINE = 0.8; // cash call below 80% of ECA
  const CASH_CALL_COST = 0.2;
  const QS_SHARE = 0.25;
  const SHIELD_COST = 0.08;  // ILW cost as share of the shielded premium

  // ---------- the week's market ----------
  function weekMarket(season) {
    const r = rng('market|' + season);
    const modifier = MODIFIERS[Math.floor(r() * MODIFIERS.length)];
    const pool = EVENTS.slice();
    const chosen = [];
    while (chosen.length < 2) chosen.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
    const events = chosen.map((e, i) => {
      const lo = i === 0 ? 2 : 6, hi = i === 0 ? 6 : 10;
      let month = e.months ? r.pick(e.months.filter(m => m >= lo - 1 && m <= hi + 1).length ? e.months.filter(m => m >= lo - 1 && m <= hi + 1) : e.months) : lo + Math.floor(r() * (hi - lo + 1));
      return { id: e.id, name: r.pick(e.names), kind: e.name, month, tile: r.pick(e.tiles), candidates: e.tiles.slice(), sev: e.sev * (0.8 + 0.4 * r()), forecast: e.forecast };
    }).sort((a, b) => a.month - b.month);
    if (events[0].month === events[1].month) events[1].month = Math.min(11, events[1].month + 2);
    const shock = {}, resDev = {};
    for (const id in CLASSES) {
      const c = CLASSES[id];
      shock[id] = r.normal(0, c.vol) + ((modifier.lr && modifier.lr[id]) || 0);
      resDev[id] = c.tail ? r.normal(0, c.tail) + ((modifier.res && modifier.res[id]) || 0) : 0;
    }
    return { season, modifier, events, shock, resDev, capAdj: modifier.cap || 0 };
  }

  // ---------- capital ----------
  function splitKey(split) {
    return Object.keys(split).filter(k => split[k] > 0).sort().map(k => k + split[k]).join('-');
  }
  function weights(split) {
    let tot = 0; for (const k in split) tot += split[k];
    const w = {}; for (const k in split) if (split[k] > 0) w[k] = split[k] / tot;
    return w;
  }
  function capitalFor(split, loading, qs) {
    const w = weights(split);
    let scr = 0, hhi = 0;
    for (const k in w) { scr += w[k] * CLASSES[k].scr; hhi += w[k] * w[k]; }
    const div = 0.3 * (1 - hhi);
    const scrAmt = PLAN_GWP * scr * (1 - div);
    const eca = scrAmt * ECU * (1 + (loading || 0)) * (qs ? 1 - QS_SHARE : 1);
    return { scrFactor: scr, div, scr: scrAmt, eca };
  }
  function mixProfile(split) {
    const w = weights(split);
    let margin = 0, vol = 0, catLoad = 0;
    for (const k in w) {
      const c = CLASSES[k];
      margin += w[k] * (1 - c.lr - c.comm - 0.08);
      catLoad += w[k] * c.cat;
      vol += w[k] * (c.vol + c.cat * 0.6 + c.tail);
    }
    const cap = capitalFor(split, 0, false);
    return { margin, vol, catLoad, hunger: cap.eca / PLAN_GWP, eca: cap.eca, div: cap.div };
  }

  // capital offers that float up in the Capital Grab, scaled to the player's ECA
  function capitalOffers(season, eca, capAdj) {
    const r = rng('capital|' + season);
    const c = capAdj || 0;
    const list = [
      { src: 'corporate', label: 'Corporate parent', amt: 0.22, rate: 0.07 },
      { src: 'names', label: 'Names via members’ agents', amt: 0.12, rate: 0.09 },
      { src: 'pe', label: 'PE vehicle via London Bridge 2', amt: 0.42, rate: 0.12 },
      { src: 'names', label: 'Names via members’ agents', amt: 0.12, rate: 0.09 },
      { src: 'family', label: 'Family office', amt: 0.18, rate: 0.06, trap: 'racehorse', hint: 'Cheap money, but the founder\u2019s racehorse comes with it.' },
      { src: 'qs', label: 'Outward QS reinsurer', amt: 0, rate: 0, qs: true, hint: 'Cuts the capital you need by 25%, takes 25% of your result.' },
      { src: 'corporate', label: 'Corporate parent', amt: 0.18, rate: 0.07 },
      { src: 'pe', label: 'PE vehicle via London Bridge 2', amt: 0.45, rate: 0.18, trap: 'hurdle', hint: 'Wants a 25% hurdle. Priced like it.' },
      { src: 'names', label: 'Names via members’ agents', amt: 0.12, rate: 0.09 },
      { src: 'pe', label: 'PE vehicle via London Bridge 2', amt: 0.35, rate: 0.12 },
      { src: 'names', label: 'Names via members’ agents', amt: 0.1, rate: 0.09 }
    ];
    return list.map((o, i) => Object.assign({}, o, {
      id: 'cap' + i,
      amt: round1(o.amt * eca * (0.9 + 0.2 * r())),
      rate: o.qs ? 0 : Math.max(0.03, o.rate + c),
      appearAt: i * 1.6 + r() * 0.5,
      life: 3.6 + r() * 1.6
    }));
  }

  // ---------- deals ----------
  function makeDeck(season, split, auId, tag) {
    const r = rng('deck|' + season + '|' + splitKey(split) + '|' + auId + '|' + (tag || 'player'));
    const w = weights(split);
    const inMix = Object.keys(w);
    const offMix = Object.keys(CLASSES).filter(k => !inMix.includes(k));
    const hasProperty = inMix.some(k => ['propcat', 'propdf', 'parametric'].includes(k));
    const rain = auId === 'rainmaker';
    const n = rain ? 26 : 20;
    const deck = [];
    for (let i = 0; i < n; i++) {
      const off = r() < 0.15;
      const brokerWeights = [['hal', 20], ['seb', 20], ['fiona', hasProperty ? 15 : 0], ['reggie', 15], ['dev', 15], ['bot', 15]];
      const brokerId = r.weighted(brokerWeights);
      const b = BROKERS[brokerId];
      let cls;
      if (brokerId === 'fiona') cls = r.weighted([['propcat', w.propcat || 0.01], ['propdf', w.propdf || 0.01], ['parametric', w.parametric || 0.01]]);
      else cls = off ? r.pick(offMix) : r.weighted(inMix.map(k => [k, w[k]]));
      const c = CLASSES[cls];
      let tmpl = r.pick(c.deals);
      if (brokerId === 'fiona') tmpl = c.deals.find(d => d[1] === 'florida') || tmpl;
      const q = clamp(Math.exp(r.normal(b.qBias + (rain ? 0.03 : 0), 0.22)), 0.6, 1.6);
      const base = round1((4 + 6 * r()) * b.size * (rain ? 1.15 : 1));
      const comm = clamp(c.comm + r.normal(0, 0.03) + b.commAdj, 0.08, 0.42);
      // tells: noisy readings of the hidden quality q
      const z = (q - 1) / 0.2 + r.normal(0, 0.8);
      const hist = z < -0.4 ? 'Clean' : z > 0.6 ? 'Ugly' : 'Patchy';
      const rate = Math.round(-(q - 1) * 35 + r.normal(0, 4) + c.rate * 0.5);
      const growth = Math.max(0, Math.round(15 + (q - 1) * 120 + r.normal(0, 18)));
      const adequacy = Math.round(100 / q + r.normal(0, 3));
      const gq = q + r.normal(0, 0.05);
      const grade = gq < 0.85 ? 'A' : gq < 1.0 ? 'B' : gq < 1.15 ? 'C' : 'D';
      const gutScore = (q - 1) + r.normal(0, 0.08);
      const gut = gutScore < -0.06 ? 'good' : gutScore > 0.08 ? 'bad' : 'meh';
      deck.push({
        id: 'd' + i, cls, off: !inMix.includes(cls), label: tmpl[0], tile: tmpl[1], structure: tmpl[2],
        broker: brokerId, q, base, comm,
        tells: { hist, rate, growth }, adequacy, grade, gut
      });
    }
    return deck;
  }

  function brokerLine(deal) {
    const q = deal.q;
    switch (deal.broker) {
      case 'hal': return q < 0.95 ? 'This one’s a good’un, I promise.' : q > 1.1 ? 'I’d be careful with this one.' : 'Fair risk, fair price.';
      case 'seb': return 'Cracking risk, honestly.';
      case 'fiona': return 'Sunshine and low-rise, darling. What could go wrong?';
      case 'reggie': return 'Shall we discuss it over lunch?';
      case 'dev': return 'It’s Friday, it’s four o’clock, it’s yours.';
      case 'bot': return 'BEEP. CAPACITY REQUESTED. BEEP.';
    }
    return '';
  }

  const RACEHORSE = {
    id: 'racehorse', cls: 'specie', off: true, label: 'The founder’s racehorse (bloodstock binder)', tile: 'vaults', structure: 'binder',
    broker: 'reggie', q: 1.55, base: 2.5, comm: 0.3, tells: { hist: 'Ugly', rate: -12, growth: 0 }, adequacy: 64, grade: 'D', gut: 'bad', forced: true
  };

  // attritional loss ratio of a deal in this week's market
  function dealLR(deal, market) {
    const c = CLASSES[deal.cls];
    return Math.max(0.05, c.lr * deal.q * (1 + market.shock[deal.cls]));
  }

  // ---------- scoring ----------
  // book: [{deal, P, month, exitMonth?, alert:'audit'|'exit'|'ignore'|null, alertMonth?}]
  // opts: {market, fal, capital:[{amt,rate}], eca, capacity, plan, split, au, qs, shields:{eventIndex:tile},
  //        reinsCall:{eventIndex:true}, pmd, cashCallChoice: (info)=>'pay'|'runoff', audits, runoffMonth}
  function scoreRun(book, o) {
    const m = o.market;
    const au = o.au;
    const fixed = FIXED_COSTS + (au === 'rainmaker' ? 3 : 0);
    const capCostRate = o.capital.reduce((s, c) => s + c.amt * c.rate, 0); // £m per year
    let fal = o.fal;
    const months = 12;
    const curve = [], uwCurve = [];
    let cumUW = 0, catTotal = 0, shieldSpend = 0, auditSpend = 0, cashCallCost = 0;
    let runoff = null;
    const lines = book.map(b => ({
      b, lr: dealLR(b.deal, m) * (b.alert === 'ignore' ? 1.35 : 1), cat: 0,
      end: b.alert === 'exit' ? b.alertMonth : 12
    }));
    for (const l of lines) if (l.b.alert === 'audit') auditSpend += (au === 'forensic' ? 0 : 0.3);
    const evByMonth = {};
    m.events.forEach((e, i) => { evByMonth[e.month] = (evByMonth[e.month] || []).concat([[e, i]]); });
    const cashCalls = [];
    let lastMonth = 11;
    for (let mo = 0; mo < months; mo++) {
      // earned underwriting result this month
      let uw = 0;
      for (const l of lines) {
        const start = l.b.month;
        if (mo < start || mo >= l.end) continue;
        const span = 12 - start;
        const share = 1 / span;
        uw += l.b.P * (1 - l.b.deal.comm - l.lr) * share;
      }
      // cat events
      for (const pair of (evByMonth[mo] || [])) {
        const [e, idx] = pair;
        const shieldTile = o.shields && o.shields[idx];
        const halve = o.reinsCall && o.reinsCall[idx];
        let shieldedP = 0;
        for (const l of lines) {
          if (l.b.month > mo || l.end <= mo) continue;
          if (shieldTile && l.b.deal.tile === shieldTile) shieldedP += l.b.P;
          if (l.b.deal.tile !== e.tile) continue;
          let loss = l.b.P * CLASSES[l.b.deal.cls].catMult * e.sev;
          if (shieldTile === e.tile) loss *= 0.5;
          if (halve) loss *= 0.5;
          l.cat += loss;
          uw -= loss;
          catTotal += loss;
        }
        if (shieldTile) { const sc = shieldedP * SHIELD_COST; shieldSpend += sc; uw -= sc; }
      }
      uw -= fixed / 12;
      if (mo === 0) uw -= auditSpend; // charged up front for simplicity
      const uwNet = uw * (o.qs ? 1 - QS_SHARE : 1);
      cumUW += uwNet;
      // solvency check after an event month
      if (evByMonth[mo]) {
        const capitalNow = fal + cumUW;
        const line = SOLVENCY_LINE * o.eca;
        if (capitalNow < line) {
          const topUp = line - capitalNow;
          const choice = o.cashCallChoice ? o.cashCallChoice({ month: mo, topUp, capitalNow, line, cost: topUp * CASH_CALL_COST }) : 'pay';
          cashCalls.push({ month: mo, topUp, choice });
          if (choice === 'runoff') { runoff = mo; }
          else { fal += topUp; cashCallCost += topUp * CASH_CALL_COST; }
        }
      }
      curve.push(round1(cumUW - capCostRate * (mo + 1) / 12 - cashCallCost));
      uwCurve.push(cumUW);
      if (runoff !== null) { lastMonth = mo; break; }
    }
    // totals (gross of outward QS for the waterfall lines)
    let gwp = 0, comm = 0, attr = 0, res = 0;
    for (const l of lines) {
      const earnedFrac = runoff !== null ? clamp((runoff + 1 - l.b.month) / (12 - l.b.month), 0, 1) : (l.end - l.b.month) / (12 - l.b.month);
      const P = l.b.P * earnedFrac;
      gwp += P; comm += P * l.b.deal.comm; attr += P * l.lr;
      if (runoff === null && l.end === 12) {
        let rd = m.resDev[l.b.deal.cls] * l.b.P;
        if (au === 'quant') rd *= 0.5;
        res += rd;
      }
    }
    const fixedSpent = runoff !== null ? fixed * (runoff + 1) / 12 : fixed;
    const expenses = fixedSpent + shieldSpend + auditSpend;
    const uwGross = gwp - comm - attr - catTotal - res - expenses;
    const qsTake = o.qs ? uwGross * QS_SHARE : 0;
    const uw = uwGross - qsTake;
    const capCost = capCostRate * (runoff !== null ? (runoff + 1) / 12 : 1) + cashCallCost;
    const value = uw - capCost;
    // plan discipline
    const plan = o.plan;
    const bound = {};
    for (const l of lines) bound[l.b.deal.cls] = (bound[l.b.deal.cls] || 0) + l.b.P;
    const boundTot = Object.values(bound).reduce((a, b) => a + b, 0);
    const w = weights(o.split);
    let drift = 0;
    const allCls = new Set([...Object.keys(w), ...Object.keys(bound)]);
    for (const k of allCls) drift += Math.abs((boundTot ? (bound[k] || 0) / boundTot : 0) - (w[k] || 0));
    drift = drift * 50; // half the L1 distance, in percentage points
    const onPlan = runoff === null && boundTot >= plan * 0.9 && boundTot <= plan * 1.1 && drift <= 10;
    const pmd = o.pmd || 0;
    const score = Math.round(value * 1000 + (onPlan ? 1000 : 0) - pmd * 1000);
    const cor = gwp > 0 ? (comm + attr + catTotal + res + expenses) / gwp : 0;
    const roc = fal > 0 ? uw / fal : 0;
    if (runoff !== null) while (curve.length < 12) { curve.push(curve[curve.length - 1]); uwCurve.push(uwCurve[uwCurve.length - 1]); }
    return {
      gwp, comm, attr, cat: catTotal, res, fixed: fixedSpent, shield: shieldSpend, audits: auditSpend, expenses,
      uwGross, qsTake, uw, capCost, cashCallCost, value, onPlan, pmd, score, cor, roc, drift, boundTot,
      curve, uwCurve, cashCalls, runoff, fal, capCostRate, lines: lines.map(l => ({ id: l.b.deal.id, cls: l.b.deal.cls, P: l.b.P, lr: l.lr, cat: l.cat }))
    };
  }

  function grade(roc, runoff) {
    if (runoff !== null && runoff !== undefined) return 'Run-off';
    if (roc >= 0.25) return 'Lloyd’s darling';
    if (roc >= 0.15) return 'Solid franchise';
    if (roc >= 0.05) return 'Keep calm and carry on';
    if (roc >= 0) return 'PMD on speed-dial';
    return 'Remediation plan';
  }

  // ---------- automated players (rivals and the balance sim) ----------
  function estimateQ(deal, au, noise) {
    let est = 1;
    est += deal.tells.hist === 'Clean' ? -0.1 : deal.tells.hist === 'Ugly' ? 0.13 : 0;
    est += -(deal.tells.rate - CLASSES[deal.cls].rate * 0.5) / 35 * 0.45;
    est += (deal.tells.growth - 15) / 120 * 0.35;
    if (au === 'quant') est = 0.3 * est + 0.7 * (100 / deal.adequacy);
    if (au === 'forensic') est = 0.5 * est + 0.5 * ({ A: 0.8, B: 0.93, C: 1.07, D: 1.25 }[deal.grade]);
    if (au === 'veteran') est += deal.gut === 'good' ? -0.05 : deal.gut === 'bad' ? 0.06 : 0;
    if (deal.broker === 'hal') est += deal.q < 0.95 ? -0.04 : deal.q > 1.1 ? 0.05 : 0;
    if (noise) est += noise;
    return est;
  }

  const POLICIES = {
    decline: () => 0,
    small: () => 1,
    big: () => 2,
    skilled: (deal, ctx) => {
      const est = estimateQ(deal, ctx.au, 0);
      const cost = deal.comm - CLASSES[deal.cls].comm;
      const edge = est + cost * 1.5;
      if (deal.off && edge > 0.88) return 0;
      if (ctx.boundTot > ctx.capacity * 1.1) return 0;
      if (edge < 0.93) return 2;
      if (edge < 1.04) return 1;
      return 0;
    },
    aggressive: (deal, ctx) => { const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.1)); return est < 1.15 ? 2 : 1; },
    cautious: (deal, ctx) => { const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.05)); return est < 0.98 ? 1 : 0; },
    medium: (deal, ctx) => {
      const est = estimateQ(deal, ctx.au, ctx.r.normal(0, 0.08));
      if (ctx.boundTot > ctx.capacity * 1.15) return 0;
      return est < 0.92 ? 2 : est < 1.06 ? 1 : 0;
    }
  };

  // Simulate a whole run for an automated player.
  // cfg: {season, split, au, policy, tag, deals (offered), capitalMode:'tight'|'loose', shield:bool, audit:bool, reinsCall:bool, cashCall:'pay'|'runoff'}
  function simulateRun(cfg) {
    const market = weekMarket(cfg.season);
    const loading = cfg.loading || 0;
    const qs = !!cfg.qs;
    const cap = capitalFor(cfg.split, loading, qs);
    const eca = cap.eca;
    const blended = (cfg.capitalMode === 'loose' ? 0.10 : 0.085) + market.capAdj;
    const fal = eca * (cfg.capitalMode === 'loose' ? 1.3 : 1.03);
    const capital = [{ amt: fal, rate: blended }];
    const capacity = PLAN_GWP * Math.min(1, fal / eca);
    const deck = makeDeck(cfg.season, cfg.split, cfg.au, cfg.tag);
    const r = rng('policy|' + cfg.season + '|' + (cfg.tag || '') + '|' + cfg.policy);
    const nOffer = Math.min(deck.length, cfg.deals || (cfg.au === 'rainmaker' ? 17 : 14));
    const policy = POLICIES[cfg.policy];
    const book = [];
    let boundTot = 0;
    for (let i = 0; i < nOffer; i++) {
      const deal = deck[i];
      const month = Math.min(11, Math.floor(i * 12 / nOffer));
      const line = policy(deal, { au: cfg.au, r, boundTot, capacity });
      if (!line) continue;
      const room = capacity * 1.3 - boundTot;
      const P = Math.min(deal.base * line, room);
      if (P < 0.5) continue;
      book.push({ deal, P: round1(P), month });
      boundTot += P;
    }
    // alerts: in months 3 and 8 the worst bound book turns
    [3, 8].forEach(am => {
      const cands = book.filter(b => b.month < am && !b.alert);
      if (!cands.length) return;
      const worst = cands.reduce((a, b) => (b.deal.q > a.deal.q ? b : a));
      worst.alertMonth = am;
      worst.alert = cfg.audit ? (worst.deal.q > 1.25 ? 'exit' : 'audit') : 'ignore';
    });
    const shields = {}, reinsCall = {};

  // ---------- pointer drag helper (tap and keyboard fall back to onTap) ----------
  function draggable(node, opts) {
    let id = null, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, vx = 0, vy = 0, moved = false;
    const th = opts.threshold || 6;
    node.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || (opts.enabled && !opts.enabled())) return;
      id = e.pointerId; sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now(); moved = false; vx = vy = 0;
      try { node.setPointerCapture(id); } catch (err) { /* capture unsupported */ }
      opts.onDown && opts.onDown(e);
    });
    node.addEventListener('pointermove', (e) => {
      if (e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > th) { moved = true; opts.onStart && opts.onStart(e); }
      const now = performance.now(), dt = Math.max(8, now - lt);
      vx = ((e.clientX - lx) / dt) * 1000; vy = ((e.clientY - ly) / dt) * 1000; lx = e.clientX; ly = e.clientY; lt = now;
      if (moved && opts.onMove) opts.onMove(dx, dy, e);
    });
    const end = (e, cancelled) => {
      if (e.pointerId !== id) return;
      id = null;
      if (!moved) { if (!cancelled && opts.onTap) opts.onTap(e); return; }
      opts.onEnd && opts.onEnd(e.clientX - sx, e.clientY - sy, vx, vy, e, cancelled);
    };
    node.addEventListener('pointerup', (e) => end(e, false));
    node.addEventListener('pointercancel', (e) => end(e, true));
    node.addEventListener('click', (e) => { if (e.detail === 0 && opts.onTap) opts.onTap(e); });
  }
  function dropTarget(x, y, selector, ignore) {

      const hit = n.closest && n.closest(selector);
      if (hit) return hit;
    }
    return null;
  }

  // ---------- leaderboard (shared via the db capability when available) ----------
  const LB = {
    db: null, user: null, uid: null, rows: [], unsub: null, live: false, names: {}, listeners: new Set(),
    async init() {
      const C = window.claude;
      if (!C || typeof C.use !== 'function') return;
      try {
        const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
        if (!db) return;
        this.db = db; this.user = user;
        this.uid = user ? await user.id() : null;
        this.live = true;
        this.unsub = db.collection('scores').where('season', '==', SEASON).orderBy('score', 'desc').limit(25)
          .onSnapshot((snap) => {
            this.rows = snap.docs.map((d) => Object.assign({ uid: d.id }, d.data()));
            this.resolveNames().then(() => this.listeners.forEach((fn) => fn()));
          }, () => { this.live = false; this.listeners.forEach((fn) => fn()); });
      } catch (e) { this.live = false; }
    },
    async resolveNames() {
      if (!this.user || !this.user.profiles) return;
      const ids = this.rows.map((r) => r.uid).filter((id) => !(id in this.names));
      if (!ids.length) return;
      try {
        const ps = await this.user.profiles(ids);
        for (const id of ids) this.names[id] = (ps && ps[id] && ps[id].name) || '';
      } catch (e) { /* names stay blank */ }
    },
    async submit(entry) {
      // local board and personal best always
      const key = 'lsl-local-' + SEASON;
      const local = store.get(key, []);
      local.push(Object.assign({ uid: 'local-' + Date.now(), me: true }, entry));
      local.sort((a, b) => b.score - a.score);
      store.set(key, local.slice(0, 10));
      const pb = store.get('lsl-pb-' + SEASON, null);
      if (!pb || entry.score > pb.score) store.set('lsl-pb-' + SEASON, entry);
      if (!this.db || !this.uid) return { shared: false };
      try {
        const ref = this.db.doc('scores/' + this.uid);
        const cur = await ref.get();
        const old = cur.exists ? cur.data() : null;
        if (old && old.season === SEASON && old.score >= entry.score) return { shared: true, best: false };
        await ref.set(entry);
        return { shared: true, best: true };
      } catch (e) { return { shared: false, error: e && e.code }; }
    },
    displayName(row) {
      if (row.uid && row.uid === this.uid) return 'You';

    ghostCurve() {
      const pref = store.get('lsl-ghost', null);

        const row = (pref && this.rows.find((r) => r.uid === pref)) || this.rows.find((r) => r.uid !== this.uid) || this.rows[0];
        if (row && Array.isArray(row.curve)) return { label: row.uid === this.uid ? 'Your best' : (this.displayName(row) + ' (ghost)'), curve: row.curve, score: row.score };
      }
      const pb = store.get('lsl-pb-' + SEASON, null);
      if (pb && Array.isArray(pb.curve)) return { label: 'Your best (ghost)', curve: pb.curve, score: pb.score };
      return null;

  // ----- Step 2: the BOC -----

  SCENES.pitch = {
    enter() {
      setStep('Step 2 of 5 · Business Opportunities Committee');
      const w = E.weights(G.split);
      const top = Object.keys(w).sort((a, b) => w[b] - w[a]);
      const used = new Set();
      const qs = [];
      const take = (pred) => { const q = QUESTIONS.find((x, i) => !used.has(i) && pred(x)); if (q) { used.add(QUESTIONS.indexOf(q)); qs.push(q); } };
      if (Object.keys(w).length >= 4) take((q) => q.tags.includes('composite'));
      for (const c of top) { if (qs.length >= 2) break; take((q) => q.tags.includes(c) && !qs.some((o) => o.who === q.who)); }
      for (let guard = 0; qs.length < 3 && guard < 6; guard++) {
        const before = qs.length;
        take((q) => q.tags.includes('any') && !qs.some((o) => o.who === q.who));
        if (qs.length === before) take((q) => q.tags.includes('any'));

      this.qs = qs.slice(0, 3);
      this.qi = -1; this.t = 0; this.state = 'intro'; this.conf = 0;

        '<div class="stephead"><div><span class="eyebrow">Step 2 · Business Opportunities Committee</span><h2>Pitch to the panel</h2></div>' +

        '<div class="boardroom">' +
        '<div class="panelists">' + Object.keys(PANEL).map((k) => '<div class="panelist" data-p="' + k + '"><div class="face">' + face(k) + '</div><span class="pname">' + PANEL[k].name + '</span><span class="prole">' + PANEL[k].role + '</span></div>').join('') + '</div>' +
        '<div class="table" id="table"><p class="question" id="qText"></p><div class="qmeta"><span class="pen" id="pen"></span><span class="num" id="qTime">8s</span><span id="qNo"></span></div></div>' +
        '<div class="answers" id="answers"></div>' +
        '<div class="meterwrap"><span>Council confidence</span><div class="applause"><i id="appl"></i></div><span id="confTxt">0</span></div>' +
        '</div></section>');

      this.onKey = (e) => { if (this.state === 'ask' && ['1', '2', '3'].includes(e.key)) this.answer(+e.key - 1); };
      addEventListener('keydown', this.onKey);
      setTimeout(() => this.next(), 200);
      return root;
    },
    exit() { removeEventListener('keydown', this.onKey); },
    next() {
      this.qi++;
      if (this.qi >= this.qs.length) return this.stampPhase();
      const q = this.qs[this.qi];
      this.state = 'ask'; this.t = 8;
      this.root.querySelector('#qText').textContent = q.q;
      this.root.querySelector('#qNo').textContent = 'Question ' + (this.qi + 1) + ' of 3 · ' + PANEL[q.who].name;
      this.root.querySelectorAll('.panelist .bubble').forEach((b) => b.remove());
      this.root.querySelectorAll('.panelist').forEach((p) => { p.classList.toggle('asking', p.dataset.p === q.who); p.querySelector('.face').innerHTML = face(p.dataset.p); });
      const order = [0, 1, 2].sort(() => rand() - 0.5);
      this.order = order;
      const box = this.root.querySelector('#answers');
      box.innerHTML = order.map((ai, i) => '<button class="answer" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + esc(q.a[ai][0]) + '</span></button>').join('');
      const table = this.root.querySelector('#table');
      box.querySelectorAll('.answer').forEach((b) => {
        draggable(b, {
          enabled: () => this.state === 'ask',
          onStart: () => b.classList.add('dragging'),
          onMove: (dx, dy, e) => { b.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 30 + 'deg)'; table.classList.toggle('drop', !!dropTarget(e.clientX, e.clientY, '#table', b)); },
          onEnd: (dx, dy, vx, vy, e) => {
            b.classList.remove('dragging'); table.classList.remove('drop');
            if (dropTarget(e.clientX, e.clientY, '#table', b) || vy < -900) this.answer(+b.dataset.i);

    answer(i) {
      if (this.state !== 'ask') return;
      this.state = 'react';
      const q = this.qs[this.qi];
