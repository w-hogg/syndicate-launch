      const cur = row ? row.net : 0, ap = st.appetite[main];
      const addS = d.base * f * (row && row.shielded ? 0.5 : 1);
      const pctNow = cur / ap, pctBig = (cur + addS * 2) / ap;
      const col = pctBig > 1 ? 'var(--bad)' : pctBig > 0.8 ? 'var(--warn)' : 'var(--good)';
      return '<div class="rdsline" title="Gross loss to this RDS if the full scenario happened">' + icon(E.RDS[main].icon) +
        '<span>RDS: <b>' + esc(E.RDS[main].name) + '</b> +' + fmtM(addS) + ' / +' + fmtM(addS * 2) + ' → ' + Math.round(pctBig * 100) + '% of appetite</span>' +
        '<span class="rdsmini"><i style="width:' + Math.min(100, pctNow * 100) + '%"></i><i class="add" style="left:' + Math.min(100, pctNow * 100) + '%;width:' + Math.max(0, Math.min(100, pctBig * 100) - Math.min(100, pctNow * 100)) + '%;background:' + col + '"></i></span></div>';
    },
    // would a small line on this slip bring the mix closer to plan, or push it further away?
    mixHint(d) {
      const now = this.mixData(); if (!now.bt) return '';
      const after = this.mixData({ cls: d.cls, P: d.base }).drift;
      return after < now.drift - 0.5 ? '<span class="tag mixtag good">Helps your mix</span>' : after > now.drift + 0.5 ? '<span class="tag mixtag bad">Moves you off plan</span>' : '';
    },
    renderSlip() {
      const c = this.cur, d = c.d, cl = E.CLASSES[d.cls];
      const area = this.root.querySelector('#slotArea');
      const when = this.phase === 'mid17' ? '1 Jul ' + yoaName(this.y) : '1 Jan ' + yoaName(this.y);
      area.innerHTML = '<div class="slip" id="slip"><div class="holes"><i></i><i></i><i></i><i></i></div>' +
        '<div class="sh"><span>' + esc(STRUCT[d.structure] || d.structure) + ' · ' + d.window + '</span><span>Incepts ' + when + '</span></div>' +
        '<h3>' + esc(d.label) + '</h3>' +
        '<div class="clsrow"><span class="tag" style="--c:' + clsColor(d.cls) + '"><i></i>' + esc(cl.name) + '</span>' + (d.off ? '<span class="tag off">Off plan</span>' : this.mixHint(d)) + (d.hot ? '<span class="tag">Hot box</span>' : '') + '</div>' +
        '<div class="terms"><div><span>Small line</span><b class="num">£' + d.base.toFixed(1) + 'm</b></div><div><span>Big line</span><b class="num">£' + (d.base * 2).toFixed(1) + 'm</b></div>' +
        '<div><span>Commission</span><b class="num">' + Math.round(d.comm * 100) + '%</b></div><div><span>Market rates</span><b class="num">' + (cl.rate > 0 ? '+' : '') + cl.rate + '%</b></div></div>' +
        this.rdsLine(d) +
        '<div class="smallprint"><span class="lbl">Small print · tap to read (costs patience)</span><div class="tells">' + [0, 1, 2].map((i) => this.tellHTML(i)).join('') + '</div></div>' +
        '<div id="ins">' + this.insightHTML() + '</div>' +
        (c.blocked ? '<div class="insight" style="--c:var(--bad);margin-top:6px"><span class="pip"></span>' + esc(c.blocked) + '</div>' : '') +
        '<div class="stamp ghoststamp" id="gs"></div></div>';
      const slip = area.querySelector('#slip');
      slip.querySelectorAll('.tell').forEach((t) => t.addEventListener('click', (e) => { e.stopPropagation(); this.reveal(+t.dataset.t); }));
      const gs = slip.querySelector('#gs');
      const dir = (dx, dy) => (Math.abs(dy) > Math.abs(dx) && dy > 0 ? 1 : dx > 0 ? 2 : 0);
      draggable(slip, {
        ignore: '.tell',
        enabled: () => this.cur && !this.cur.busy && !this.over,
        onStart: () => slip.classList.add('dragging'),
        onMove: (dx, dy) => {
          slip.style.transform = 'translate(' + dx + 'px,' + Math.max(-40, dy) + 'px) rotate(' + dx / 18 + 'deg)';
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          gs.textContent = ['Decline', 'Small line', 'Big line'][k];
          gs.style.borderColor = gs.style.color = k === 0 ? 'var(--stamp)' : k === 1 ? '#1b2a6b' : '#1d7a4c';
          gs.style.opacity = Math.min(0.95, dist / 110);
        },
        onEnd: (dx, dy, vx, vy, e, cancelled) => {
          slip.classList.remove('dragging');
          const k = dir(dx, dy), dist = k === 1 ? dy : Math.abs(dx);
          if (!cancelled && (dist > 95 || (k === 2 && vx > 900) || (k === 0 && vx < -900) || (k === 1 && vy > 900)) && !(k > 0 && this.cur.blocked)) { gs.style.opacity = 0; this.decide(k); }
          else {
            if (k > 0 && this.cur && this.cur.blocked) toast('Can’t bind this one', this.cur.blocked, 'var(--bad)');
            slip.classList.add('back'); slip.style.transform = ''; gs.style.opacity = 0;
            setTimeout(() => slip.classList.remove('back'), 320);
          }
        }
      });
    },
    reveal(i) {
      const c = this.cur; if (!c || c.busy || c.revealed[i]) return;
      c.revealed[i] = true; c.patience = Math.max(0.04, c.patience - 0.15);
      Sound.tick();
      const t = this.root.querySelector('.tell[data-t="' + i + '"]');
      if (t) t.replaceWith(el(this.tellHTML(i)));
    },
    revealNext() { if (!this.cur) return; const i = this.cur.revealed.indexOf(false); if (i >= 0) this.reveal(i); },
    decide(line) {
      const c = this.cur; if (!c || c.busy || this.over) return;
      if (line > 0 && c.blocked) { toast('Can’t bind this one', c.blocked, 'var(--bad)'); return; }
      c.busy = true;
      const d = c.d;
      G.decisionTimes.push(this.t - c.shownAt);
      const slip = this.root.querySelector('#slip');
      if (line === 0) {
        Sound.crumple();
        if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(-120px,140px) scale(.15) rotate(-260deg)', opacity: 0 }], { duration: 480, easing: 'ease-in', fill: 'forwards' });
        if (rand() < 0.5) { G.walked.push({ d, to: G.nemesis }); this.tick(E.RIVALS[G.nemesis].name + ' scratched the ' + d.label.toLowerCase() + ' you declined.'); }
      } else {
        const room = this.Y.capacity * 1.3 - yoaTot(this.y);
        const P = E.round1(Math.max(0.5, Math.min(d.base * line, room)));
        const entry = { deal: d, P, start: 12 * this.y + (this.phase === 'mid17' ? 6 : 0), yoa: this.y, line };
        G.entries.push(entry);
        if (line === 2) G.bigLines++;
        if (this.phase === 'rush' && this.clock < 3) G.midnightScratch = true;
        if (d.q < 0.95) G.streak++; else G.streak = 0;
        if (G.streak >= 3) {
          G.streak = 0; G.hotLeft = 2;
          toast('Hot box!', 'Three good binds in a row. Better brokers are queueing.', 'var(--brass)');
          const box = this.root.querySelector('#box'); box.classList.add('hotbox'); setTimeout(() => box.classList.remove('hotbox'), 15000 / SPEED);
        }
        if (slip) {
          slamStamp(slip, 'Scratched<small>Synd ' + G.no + ' · ' + (line === 2 ? 'Big' : 'Small') + ' line £' + P.toFixed(1) + 'm</small>', { pos: 'right:6%;top:34%', rot: -8, shake: false, blue: line === 1 });
          Sound.kaching();
          const [x, yy] = centre(slip); FX.burst(x, yy, 'coins', line === 2 ? 26 : 14);
          setTimeout(() => {
            const shelf = this.root.querySelector('#shelf'); if (!shelf || !slip.isConnected) return;
            const [sx, sy] = centre(shelf);
            slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translate(' + (sx - x) + 'px,' + (sy - yy) + 'px) scale(.08)', opacity: 0.3 }], { duration: 380, easing: 'ease-in', fill: 'forwards' });
          }, 380 / SPEED);
        }
        this.addBinder(entry);
        this.checkGWP();
        toast('+£' + P.toFixed(1) + 'm premium', d.label, clsColor(d.cls), 1.6);
      }
      setTimeout(() => this.clearDeal(), 700 / SPEED);
      this.nextAt = this.t + 0.8;
      this.updateRace();
    },
    walk(silent) {
      const c = this.cur; if (!c || c.busy) return;
      c.busy = true;
      G.walked.push({ d: c.d, to: G.nemesis });
      const b = this.root.querySelector('#brokerRow .bubble'); if (b) b.textContent = 'Fine. I’ll take it to ' + E.RIVALS[G.nemesis].name + '.';
      const slip = this.root.querySelector('#slip');
      if (slip) slip.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(140%) rotate(12deg)', opacity: 0 }], { duration: 520, easing: 'ease-in', fill: 'forwards' });
      Sound.whoosh();
      G.decisionTimes.push(c.total);
      if (!silent) this.tick(E.RIVALS[G.nemesis].name + ' picked up the ' + c.d.label.toLowerCase() + '. You took too long.');
      setTimeout(() => this.clearDeal(), 800 / SPEED);
      this.nextAt = this.t + 1.0;
    },
    clearDeal() {
      this.cur = null;
      if (!this.root || (this.phase !== 'rush' && this.phase !== 'mid17')) return;
      this.root.querySelector('#brokerRow').innerHTML = '';
      this.root.querySelector('#slotArea').innerHTML = '<p class="waiting">' + (this.deckIdx >= this.deck.length ? 'That’s every broker for this window.' : 'Next broker approaching…') + '</p>';
    },
    checkGWP() {
      const bt = yoaTot(this.y), key = 'gwp' + this.y;
      if (!G.pmdFlags[key] && bt > this.Y.capacity * 1.2) { G.pmdFlags[key] = true; this.pmdLetter('your YoA ' + yoaName(this.y) + ' premium is running at ' + pct(bt / this.Y.capacity) + ' of plan.'); }
    },
    // quiet: the letter counts but isn't shown (the in-tray card already says so)
    pmdLetter(text, quiet) {
      // goodwill with your Lloyd's contact turns one letter into a warning
      if (G.goodwill > 0) {
        G.goodwill--;
        if (quiet) return;
        const w = el('<div class="letter warn" role="status"><h4>Lloyd’s Performance Management</h4>Dear Active Underwriter,<br>We note that ' + esc(text) + ' Your account manager has spoken for you, so this time it is a warning.<br><b>No penalty</b></div>');
        this.root.querySelector('#box').appendChild(w);
        setTimeout(() => w.remove(), 6000 / Math.min(SPEED, 2));
        return;
      }
      G.pmd++; G.pmdNotes.push(text); G.pmdAt.push(this.abs());
      if (quiet) return;
      const l = el('<div class="letter" role="status"><h4>Lloyd’s Performance Management</h4>Dear Active Underwriter,<br>We note that ' + esc(text) + ' Please explain.<br><b>−£1.0m (−1,000 points)</b></div>');
      this.root.querySelector('#box').appendChild(l);
      Sound.thud();
      setTimeout(() => l.remove(), 6000 / Math.min(SPEED, 2));
    },
    q1Review() {
      this.setPhase('q1', '1 March · Q1 review');
      const st = this.rdsState(12 * this.y + 2);
      const over = st.rows.filter((x) => x.pct > 1);
      const drift = this.drift();
      const box = this.root.querySelector('#slotArea');
      box.innerHTML = '<div class="ffpanel" id="q1panel" style="position:relative"><span class="eyebrow">Lloyd’s Q1 review</span><div class="ffmonth">YoA ' + yoaName(this.y) + '</div><p>' +
        (over.length ? esc(E.RDS[over[0].r].name) + ' is at ' + Math.round(over[0].pct * 100) + '% of your agreed appetite.' : 'RDS within appetite.') + ' Mix ' + Math.round(drift) + '% off plan.</p></div>';
      const panel = box.querySelector('#q1panel');
      if (over.length) this.pmdLetter('your net ' + E.RDS[over[0].r].name + ' exposure is ' + Math.round(over[0].pct * 100) + '% of the appetite in your plan.');
      else if (drift > 35 && yoaTot(this.y) > this.Y.capacity * 0.3) this.pmdLetter(Math.round(drift) + '% of the premium you’ve written is in different classes from your business plan.');
      else slamStamp(panel, 'On track<small>Q1 review</small>', { pos: 'right:8%;top:22%', rot: -7, shake: false, blue: true });
      this.over = true;
      setTimeout(() => this.resumeFF(), (over.length ? 2600 : 1500) / SPEED);
    },

    // ---- who is on the stamp this year ----
    renderStamp() {
      const Y = this.Y, mem = Y.members || [];
      const a = 1 - mem.reduce((s, x) => s + x.share, 0);
      const segs = [['Your agency', a, 'var(--brass)']].concat(mem.map((x) => [x.short, x.share, x.color]));
      const n = this.root.querySelector('#stampStrip');
      n.innerHTML = '<span class="eyebrow">Stamp £' + Y.capacity.toFixed(0) + 'm · your share ' + Math.round(a * 100) + '%</span><span class="ssbar">' + segs.map(([l, w, c]) => '<i style="flex:' + w + ';background:' + c + '" title="' + esc(l + ' ' + Math.round(w * 100) + '%') + '"></i>').join('') + '</span>' +
        '<span class="sslegend">' + segs.map(([l, w, c]) => '<em><i style="background:' + c + '"></i>' + esc(l) + ' ' + Math.round(w * 100) + '%</em>').join('') + '</span>';
      n.onclick = () => toast('Your stamp', mem.length ? 'Members bring their own Funds at Lloyd’s (FAL), keep their share of the result and pay you fees and profit commission. They react to your results each November.' : 'All yours: every pound of profit, and every pound of loss.', 'var(--brass)', 4);
    },

    // ---- the bookcase: one shelf per year of account ----
    renderShelf() {
      const shelf = this.root.querySelector('#shelf');
      shelf.innerHTML = '';
      for (let k = 0; k <= this.y; k++) shelf.appendChild(el('<div class="shelfgroup" data-y="' + k + '"><span class="yoalbl">' + yoaName(k) + '</span></div>'));
      G.entries.forEach((e) => this.addBinder(e, true));
      if (!G.entries.length) shelf.appendChild(el('<span class="empty">Your book is empty. Bind something.</span>'));
    },
    addBinder(entry, quiet) {
      const shelf = this.root.querySelector('#shelf');
      const empty = shelf.querySelector('.empty'); if (empty) empty.remove();
      let grp = shelf.querySelector('.shelfgroup[data-y="' + entry.yoa + '"]');
      if (!grp) { grp = el('<div class="shelfgroup" data-y="' + entry.yoa + '"><span class="yoalbl">' + yoaName(entry.yoa) + '</span></div>'); shelf.appendChild(grp); }
      const w = Math.max(12, Math.min(40, entry.P * 2.2));
      const n = el('<button class="binder' + (quiet ? ' quiet' : '') + '" style="--c:' + clsColor(entry.deal.cls) + ';--w:' + w + 'px" aria-label="' + esc(entry.deal.label) + '"><span class="lbl">' + esc(E.CLASSES[entry.deal.cls].short) + '</span><span class="st"></span></button>');
      entry.node = n;
      n.addEventListener('click', (e) => { e.stopPropagation(); this.binderInfo(entry); });
      grp.appendChild(n);
      shelf.scrollLeft = shelf.scrollWidth;
      this.paintBinder(entry);
    },
    lineCat(entry) {
      const l = this.res && this.res.lines.find((x) => x.id === entry.deal.id && x.yoa === entry.yoa);
      return l ? l.cat : 0;
    },
    paintBinder(entry) {
      const n = entry.node; if (!n) return;
      const st = n.querySelector('.st');
      st.className = 'st';
      if (this.abs() - entry.start >= 2 || entry.alert || entry.yoa < this.y) st.classList.add(E.bookTrafficLight(entry, G.market, this.lineCat(entry)).light);
      n.classList.toggle('scorched', !!entry.catHit);
      n.classList.toggle('exited', entry.alert === 'exit' || !!entry.shredded);
    },
    binderInfo(entry) {
      this.root.querySelectorAll('.popover').forEach((p) => p.remove());
      const d = entry.deal;
      const pending = entry.alertPending;
      const tl = E.bookTrafficLight(entry, G.market, this.lineCat(entry));
      const p = el('<div class="popover" role="dialog"><h4>' + esc(d.label) + '</h4><div>' + esc(E.CLASSES[d.cls].name) + ' · YoA ' + yoaName(entry.yoa) + ' · incepts ' + d.window + '<br>£' + entry.P.toFixed(1) + 'm written' + (entry.catHit ? ' · hit by a catastrophe' : '') + (entry.alert ? ' · ' + ({ audit: 'audited', exit: 'exited', ignore: 'alert ignored' })[entry.alert] : '') + (entry.shredded ? ' · not renewed' : '') + '<br>Loss ratio so far: ' + Math.round(tl.lr * 100) + '%</div>' +
        (pending ? '<div><b>' + esc(entry.alertMsg) + '</b></div><div class="row"><button class="btn primary" data-a="audit">Audit' + (G.au === 'forensic' ? ' (free)' : ' (£0.3m)') + '</button><button class="btn danger" data-a="exit">Exit the book</button></div>' : '<div class="row"><button class="btn ghost" data-a="close">Close</button></div>') + '</div>');
      const box = this.root.querySelector('.side');
      box.style.position = 'relative';
      p.style.left = '0'; p.style.bottom = '100%';
      box.appendChild(p);
      p.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => { const a = b.dataset.a; p.remove(); if (a !== 'close') this.resolveAlert(entry, a); }));
      setTimeout(() => { const off = (e) => { if (!p.contains(e.target)) { p.remove(); removeEventListener('pointerdown', off, true); } }; addEventListener('pointerdown', off, true); }, 0);
    },
    triggerAlert() {
      const abs = this.abs();
      const cands = G.entries.filter((b) => b.start < abs && b.start + 12 > abs && !b.alert && !b.alertPending && !b.catHit && !b.deal.forced);
      if (!cands.length) return false;
      const worst = cands.reduce((a, b) => (b.deal.q > a.deal.q ? b : a));
      worst.alertPending = true; worst.alertMonth = Math.floor(abs);
      worst.alertMsg = pick(['Bordereaux are three months late.', 'The book grew 60% overnight.', 'Claims notifications have doubled.', 'The coverholder has changed its name. Again.']);
      G.alerts.push(worst);
      if (worst.node) { worst.node.classList.add('smoking'); worst.node.appendChild(el('<span class="smoke"></span>')); }
      toast('Portfolio alert', worst.deal.label + ': ' + worst.alertMsg + (G.au === 'forensic' ? ' The Forensic says audit it (free).' : ' Audit, exit or ignore it.'), 'var(--bad)', 6);
      this.alerting = worst; this.alertT = 10;
      this.setPhase('alert', MONTHS[this.month] + ' · portfolio alert');
      const box = this.root.querySelector('#slotArea');
      box.innerHTML = '<div class="ffpanel alertpanel"><span class="eyebrow">Portfolio alert</span><div class="ffmonth">' + esc(worst.deal.label) + '</div><p>' + esc(worst.alertMsg) + ' Decide in <b class="num" id="alT">10s</b>, or it is ignored.</p>' +
        '<div class="alopts"><button class="btn primary" data-a="audit"><b>Audit · ' + (G.au === 'forensic' ? 'free' : '£0.3m') + '</b><small>Keeps the book and stops it getting worse</small></button>' +
        '<button class="btn danger" data-a="exit"><b>Exit the book</b><small>No more premium or losses from it</small></button>' +
        '<button class="btn" data-a="ignore"><b>Ignore</b><small>Its loss ratio rises 35% this year</small></button></div></div>';
      box.querySelectorAll('.alopts [data-a]').forEach((b) => b.addEventListener('click', () => this.resolveAlert(worst, b.dataset.a)));
      if (AUTO) setTimeout(() => this.resolveAlert(worst, worst.deal.q > 1.25 ? 'exit' : 'audit'), 600 / SPEED);
      return true;
    },
    resolveAlert(entry, choice) {
      if (!entry.alertPending) return;
      entry.alertPending = false; entry.alert = choice;
      if (entry.node) { entry.node.classList.remove('smoking'); entry.node.querySelectorAll('.smoke').forEach((s) => s.remove()); }
      if (choice === 'audit') { toast('Audited', 'The coverholder has been reminded what a bordereau is.', 'var(--good)'); Sound.blip(true); }
      if (choice === 'exit') { toast('Book exited', 'You hand back the unearned premium and walk away.', 'var(--warn)'); Sound.crumple(); }
      if (choice === 'ignore') toast('Alert ignored', entry.deal.label + ' is getting worse.', 'var(--bad)');
      this.paintBinder(entry);
      if (this.alerting === entry) { this.alerting = null; if (this.phase === 'alert') this.resumeFF(); }
    },

    // ---- favours ----
    wireFavour(n) {
      const k = n.dataset.f;
      draggable(n, {
        enabled: () => G.favours[k],
        onStart: () => n.classList.add('dragging'),
        onMove: (dx, dy) => { n.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 25 + 'deg)'; },
        onEnd: (dx, dy, vx, vy, e) => { n.classList.remove('dragging'); n.style.transform = ''; if (dropTarget(e.clientX, e.clientY, FAVOURS[k][2], n)) this.useFavour(k); },
        onTap: () => this.useFavour(k)
      });
    },
    useFavour(k) {
      if (!G.favours[k]) return;
      if (k === 'lunch') {
        if (!this.cur || this.cur.busy) { toast('No slip on the table', 'Save the lunch for a broker.', 'var(--warn)'); return; }
        this.cur.lunch = true;
        const ins = this.root.querySelector('#ins'); if (ins) ins.innerHTML = this.insightHTML();
        toast('Long Lunch', 'Three courses later, the truth comes out.', 'var(--brass)');
      }
      if (k === 'reins') { G.armedReins = true; toast('Reinsurance Call armed', 'The next catastrophe hit is halved.', 'var(--brass)'); }
      if (k === 'poach') {
        const w = [...G.walked].reverse().find((x) => x.to === G.nemesis && !x.poached && x.d.year === this.y);
        if (!w) { toast('Nothing to poach yet', E.RIVALS[G.nemesis].name + ' hasn’t taken anything of yours this year.', 'var(--warn)'); return; }
        const room = this.Y.capacity * 1.3 - yoaTot(this.y);
        if (room < 0.5) { toast('No room', 'Your stamp capacity is full.', 'var(--warn)'); return; }
        w.poached = true;
        const entry = { deal: w.d, P: E.round1(Math.min(w.d.base, room)), start: 12 * this.y + (w.d.window === '1.7' ? 6 : 0), yoa: this.y, line: 1, poached: true };
        G.entries.push(entry); this.addBinder(entry); this.checkGWP();
        this.tick(E.RIVALS[G.nemesis].name.toUpperCase() + ': “That was OURS.”');
        toast('Poached!', w.d.label + ' is now yours.', 'var(--brass)');
      }
      G.favours[k] = false;
      Sound.blip(true);
      const n = this.root.querySelector('.favour[data-f="' + k + '"]'); if (n) n.classList.add('used');
      this.updateRace();
    },

    // ---- main loop ----
    update(dt) {
      if (this.overlayTick) { this.overlayTick(dt); return; }
      if (this.over) return;
      this.t += dt;
      if (this.phase === 'rush' || this.phase === 'mid17') {
        this.clock -= dt; this.paintClock();
        const c = this.cur;
        if (c && !c.busy) {
          c.patience -= dt / c.total;
          const pat = this.root.querySelector('#pat');
          if (pat) { pat.style.transform = 'scaleX(' + Math.max(0, c.patience) + ')'; pat.style.background = c.patience < 0.3 ? 'var(--bad)' : c.patience < 0.6 ? 'var(--warn)' : 'var(--good)'; }
          if (c.patience <= 0) this.walk();
        }
        if (!this.cur && this.t >= this.nextAt && this.deckIdx < this.deck.length && this.clock > 1.2) this.present();
        if (this.clock <= 0 || (!this.cur && this.deckIdx >= this.deck.length && this.t > this.nextAt + 0.6)) { this.clock = 0; this.endWindow(); }
      } else if (this.phase === 'ff') {
        this.mt += dt / FF_MONTH;
        while (this.mt >= 1 && this.phase === 'ff') {
          this.mt -= 1; this.month++;
          if (this.month >= 12) { this.mt = 0; this.month = 12; }
          G.entries.forEach((e) => this.paintBinder(e));
          this.updateRace();
          if (this.runBeats()) break;
        }
        this.paintPlanner();
      } else if (this.phase === 'alert') {
        this.alertT -= dt;
        const t = this.root.querySelector('#alT'); if (t) t.textContent = Math.max(0, Math.ceil(this.alertT)) + 's';
        if (this.alertT <= 0 && this.alerting) this.resolveAlert(this.alerting, 'ignore');
      }
      this.raceT -= dt;
      if (this.raceT <= 0) { this.raceT = 0.4; this.updateRace(); }
      this.talkT -= dt;
      if (this.talkT <= 0) { this.talkT = 16 + rand() * 10; this.trash(rand() < 0.6 ? 'nemesis' : 'rival2'); }
    }
  };

  // ----- The Year Planner, part 2: renewals, the RDS Board, the business plan, coming into line, the annual report -----
  const SEV_WORD = (s) => (s > 0.85 ? 'extreme' : s > 0.6 ? 'severe' : 'moderate');
  const corColor = (c) => (c < 0.95 ? 'var(--good)' : c < 1.05 ? 'var(--warn)' : 'var(--bad)');
  const STEP_LABEL = { shrink: ['Shrink', '−20%'], hold: ['Hold', '±0%'], grow: ['Grow', '+25%'], large: ['Go large', '+50%'] };

  Object.assign(SCENES.year, {
    // a modal sheet that freezes the year while it is open
    sheet(html, cls) {
      const body = el('<div class="' + (cls || '') + '">' + html + '</div>');
      const o = overlay(body);
      this.over = true;
      return { o, body, close: () => { o.remove(); this.over = false; this.overlayTick = null; } };
    },
    focusLater(node) { setTimeout(() => { if (node && node.isConnected) node.focus({ preventScroll: true }); }, 200); },

    // ---- the RDS Board ----
    rdsRowsHTML(st, hit, only) {
      const rows = only ? st.rows.filter((x) => x.r === hit) : st.rows.slice();
      if (hit && !rows.some((x) => x.r === hit)) rows.push({ r: hit, gross: 0, net: 0, appetite: st.appetite[hit], shielded: (this.Y.outwards || []).includes(hit), pct: 0 });
      if (!rows.length) return '<p class="muted sm">No exposure yet. Bind something and it shows up here.</p>';
      const scale = Math.max(...rows.map((x) => Math.max(x.gross, x.appetite))) * 1.04;
      let out = '';
      for (const g of Object.keys(E.RDS_GROUPS)) {
        const gr = rows.filter((x) => E.RDS[x.r].group === g).sort((a, b) => b.gross - a.gross);
        if (gr.length) out += '<div class="rdsgroup"><h5>' + esc(E.RDS_GROUPS[g]) + '</h5>' + gr.map((x) => this.rdsRowHTML(x, scale, hit)).join('') + '</div>';
      }
      return out;
    },
    rdsRowHTML(x, scale, hit) {
      const R = E.RDS[x.r];
      const w = (v) => Math.max(0, Math.min(100, (v / scale) * 100)).toFixed(1) + '%';
      const over = x.gross > 0 && x.net > x.appetite;
      return '<button class="rdsrow' + (over ? ' over' : '') + (x.shielded ? ' shielded' : '') + (hit === x.r ? ' threat' : '') + '" data-r="' + x.r + '">' +
        '<span class="ri">' + icon(R.icon) + '</span><span class="rn"><b>' + esc(R.name) + '</b><small>' +
        (x.gross > 0 ? fmtM(x.gross) + ' gross · ' + fmtM(x.net) + ' net · ' + Math.round(x.pct * 100) + '% of appetite' : 'No exposure') + '</small></span>' +
        '<span class="rs">' + (x.shielded ? icon('shield') : '') + '</span>' +
        '<span class="rbar"><i class="g" style="width:' + w(x.gross) + '"></i><i class="n" style="width:' + w(x.net) + '"></i><span class="ap" style="left:' + w(x.appetite) + '"></span></span></button>';
    },
    openRDS(opt) {
      if (opt.mode === 'event') return this.catastrophe(opt.e);
      if (opt.mode === 'outwards') return this.outwards();
      if (this.over || this.overlayTick) return;
      this.root.querySelector('#rdsBtn').classList.remove('hot');
      const st = this.rdsState();
      const S = this.sheet('<span class="eyebrow">' + MONTHS[Math.min(11, this.month)] + ' ' + yoaName(this.y) + ' · Realistic Disaster Scenarios</span><h3>RDS Board</h3>' +
        '<p class="muted sm">Realistic Disaster Scenarios (RDS) are Lloyd’s standard what-if events. Each bar is your gross loss if that scenario happened in full, against the appetite in your business plan (the white line). Solid bars are net of your shields.</p>' +
        '<div class="rdsboard">' + this.rdsRowsHTML(st) + '</div>' +
        '<div class="boardfoot stickfoot"><span class="muted sm">' + (G.armedReins ? 'Reinsurance Call armed: it halves the next catastrophe hit.' : (this.Y.outwards || []).length ? 'Shields on: ' + this.Y.outwards.map((r) => esc(E.RDS[r].name)).join(', ') + '.' : 'No shields this year.') + '</span><button class="btn" data-close>Close</button></div>', 'rdssheet');
      const close = () => S.close();
      S.body.querySelector('[data-close]').addEventListener('click', close);
      S.o.addEventListener('click', (ev) => { if (ev.target === S.o) close(); });
      this.focusLater(S.body.querySelector('[data-close]'));
    },

    // 1 January: two annual cat XL shields
    outwards() {
      const y = this.y, at = 12 * y;
      this.Y.outwards = []; this.Y.outwardsCost = 0;
      const st = this.rdsState(at);
      const sm = G.shieldMult[y] || 1;
      const cost = (r) => E.shieldCost(r, (st.rows.find((x) => x.r === r) || { gross: 0 }).gross) * sm;
      const S = this.sheet('<span class="eyebrow">1 January ' + yoaName(y) + ' · outwards</span><h3>Buy your cat XL</h3>' +
        '<p class="muted sm">A catastrophe excess of loss (cat XL) treaty is reinsurance you buy for the year. Drag a shield onto a disaster scenario (RDS) row, or tap the row. Each shield halves your losses from that scenario for the year. It’s priced at the expected recovery plus a margin: the price is shown on each row.' + (sm > 1 ? ' <b>After a reinsurer left the market, shields cost ' + Math.round((sm - 1) * 100) + '% more this year.</b>' : '') + '</p>' +
        '<div class="stickbar"><div class="shields" id="shields"></div><div class="boardfoot"><span class="sm" id="outCost"></span><button class="btn primary" id="outDone"></button></div></div>' +
        '<div class="rdsboard" id="rdsb"></div>', 'rdssheet');
      const toggle = (r) => {
        const i = this.Y.outwards.indexOf(r);
        if (i >= 0) this.Y.outwards.splice(i, 1);
        else if (this.Y.outwards.length < 2) { this.Y.outwards.push(r); Sound.blip(true); }
        else { toast('Two shields only', 'Tap a shielded row to take its shield back.', 'var(--warn)'); return; }
        paint();
      };
      const wireShield = (n) => {
        draggable(n, {
          onStart: () => n.classList.add('dragging'),
          onMove: (dx, dy, ev) => {
            n.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
            S.body.querySelectorAll('.rdsrow').forEach((x) => x.classList.remove('drop'));
            const t = dropTarget(ev.clientX, ev.clientY, '.rdsrow', n); if (t) t.classList.add('drop');
          },
          onEnd: (dx, dy, vx, vy, ev) => {
            n.classList.remove('dragging'); n.style.transform = '';
            const t = dropTarget(ev.clientX, ev.clientY, '.rdsrow', n);
            S.body.querySelectorAll('.rdsrow').forEach((x) => x.classList.remove('drop'));
            if (t && !this.Y.outwards.includes(t.dataset.r)) toggle(t.dataset.r);
          },
          onTap: () => { const best = st.rows.find((x) => !this.Y.outwards.includes(x.r)); if (best) toggle(best.r); }
        });
      };
      const paint = () => {
        const now = this.rdsState(at);
        const board = S.body.querySelector('#rdsb');
        board.innerHTML = this.rdsRowsHTML(now);
        board.querySelectorAll('.rdsrow').forEach((n) => {
          const r = n.dataset.r;
          n.querySelector('.rs').innerHTML = (this.Y.outwards.includes(r) ? icon('shield') : '') + '<em class="num">' + fmtM(cost(r)) + '</em>';
          n.addEventListener('click', () => toggle(r));
        });
        const left = 2 - this.Y.outwards.length;
        const sh = S.body.querySelector('#shields');
        sh.innerHTML = Array.from({ length: left }, () => '<button class="shieldtok">' + icon('shield') + 'Cat XL shield</button>').join('') +
          (left === 0 ? '<span class="muted sm">Both shields placed. Tap a shielded row to take one back.</span>' : '');
        sh.querySelectorAll('.shieldtok').forEach(wireShield);
        this.Y.outwardsCost = this.Y.outwards.reduce((s, r) => s + cost(r), 0);
        S.body.querySelector('#outCost').innerHTML = this.Y.outwards.length ? 'Outwards spend <b class="num">' + fmtM(this.Y.outwardsCost) + '</b> this year.' : 'No outwards yet. You can go naked, if you dare.';
        S.body.querySelector('#outDone').textContent = this.Y.outwards.length ? 'Place outwards →' : 'Go without →';
      };
      paint();
      if (!st.rows.length) S.body.querySelector('#shields').innerHTML = '<span class="muted sm">Nothing to protect yet.</span>';
      const done = () => {
        S.close();
        const o = this.Y.outwards;
        this.tick(o.length ? 'OUTWARDS PLACED · ' + o.map((r) => E.RDS[r].name.toUpperCase()).join(' & ') + ' · ' + fmtM(this.Y.outwardsCost).toUpperCase() : G.no + ' GOES WITHOUT OUTWARDS. BRAVE.');
        this.updateRace();
        this.startFF();
      };
      const btn = S.body.querySelector('#outDone');
      btn.addEventListener('click', done);
      this.focusLater(btn);
      if (AUTO) setTimeout(() => { st.rows.slice(0, 2).forEach((x) => toggle(x.r)); setTimeout(done, 300 / SPEED); }, 300 / SPEED);
    },

    // a catastrophe: forecast events give a countdown and a last-minute ILW; the rest just happen
    catastrophe(e) {
      const R = E.RDS[e.rds];
      this.setPhase('cat', MONTHS[e.month % 12] + ' · ' + (R.sober ? 'major loss' : 'catastrophe'));
      this.setActions(false);
      this.root.querySelector('#rdsBtn').classList.remove('hot');
      const st = this.rdsState(e.month);
      const row = st.rows.find((x) => x.r === e.rds);
      const gross = row ? row.gross : 0;
      const shielded = (this.Y.outwards || []).includes(e.rds);
      const head = e.warn
        ? '<div class="forecast">' + icon(R.icon) + '<div><b>Forecast</b> · ' + esc(R.forecast || e.name) + ' Expected to be <b>' + SEV_WORD(e.sev) + '</b>.</div></div>'
        : '<div class="forecast breaking">' + icon(R.icon) + '<div><b>Breaking</b> · ' + esc(R.breaking || e.name) + '</div></div>';
      let foot;
      if (e.warn) {
        const ilw = gross > 0 ? '<button class="btn brass" id="ilw">' + icon('shield') + ' Buy an ILW · ' + fmtM(gross * E.ILW_COST) + '</button>' : '';
        const call = G.favours.reins && !G.armedReins && gross > 0 ? '<button class="btn" id="call">Make the Reinsurance Call</button>' : '';
        foot = '<div class="cfoot"><span class="sm muted" id="cTxt">' + (gross > 0 ? 'Gross exposure ' + fmtM(gross) + (shielded ? ' · your shield halves it' : ' · no shield on this one') + '. An industry loss warranty (ILW) halves this loss.' : 'You have nothing on this scenario.') + (G.armedReins ? ' Reinsurance Call armed.' : '') + '</span>' +
          '<div class="cbtns">' + ilw + call + '<button class="btn danger" id="brace">Brace · <span class="num" id="cd">10s</span></button></div></div>';
      } else {
        foot = '<div class="cfoot"><span class="sm muted" id="cTxt">' + (gross > 0 ? 'Gross exposure ' + fmtM(gross) + (shielded ? '. Your shield halves it.' : '. No shield on this one.') : 'You have nothing on this scenario.') + (G.armedReins ? ' Reinsurance Call armed.' : '') + '</span></div>';
      }
      const S = this.sheet('<span class="eyebrow">' + esc(E.RDS_GROUPS[R.group]) + ' · RDS: ' + esc(R.name) + '</span><h3>' + esc(e.name) + '</h3>' + head +
        '<div class="rdsboard" id="rdsb">' + this.rdsRowsHTML(st, e.rds, true) + '</div>' + foot + '<p class="lossline" id="lossline"></p><div class="cnext" id="cnext"></div>', 'rdssheet cat' + (R.sober ? ' sober' : ''));
      this.cat = { e, S };
      if (!R.sober) Sound.rumble(); else Sound.thud();
      const ilwBtn = S.body.querySelector('#ilw');
      if (ilwBtn) ilwBtn.addEventListener('click', () => {
        G.ilw[e.key] = true; ilwBtn.disabled = true; ilwBtn.innerHTML = icon('shield') + ' ILW bought';
        Sound.kaching(); toast('ILW bought', 'Last-minute cover at a last-minute price: ' + fmtM(gross * E.ILW_COST) + '.', 'var(--brass)');
      });
      const callBtn = S.body.querySelector('#call');
      if (callBtn) callBtn.addEventListener('click', () => { this.useFavour('reins'); callBtn.remove(); });
      const brace = S.body.querySelector('#brace');
      if (brace) { brace.addEventListener('click', () => this.landfall()); this.focusLater(brace); }
      let t = e.warn ? 10 : 1.6;
      this.overlayTick = (dt) => {
        t -= dt;
        const c = S.body.querySelector('#cd'); if (c) c.textContent = Math.max(0, Math.ceil(t)) + 's';
        if (t <= 0) this.landfall();
      };
      if (AUTO && e.warn) setTimeout(() => {
        if (ilwBtn && !shielded && gross > this.Y.fal * 0.25) ilwBtn.click();
        setTimeout(() => this.landfall(), 300 / SPEED);
      }, 400 / SPEED);
    },
    landfall() {
      const C = this.cat; if (!C || C.e.done) return;
      const { e, S } = C, R = E.RDS[e.rds];
      e.done = true;
      this.overlayTick = null;
      const hitBooks = G.entries.filter((b) => {
        const end = b.alert === 'exit' ? b.alertMonth : b.start + 12;
        return e.month >= b.start && e.month < end && b.deal.rds[e.rds];
      });
      const gross = hitBooks.reduce((s, b) => s + b.P * b.deal.rds[e.rds], 0);
      // the Reinsurance Call is only used up by a catastrophe that actually reaches you
      const reinsKept = G.armedReins && gross <= 0;
      if (G.armedReins && gross > 0) { G.reinsCall[e.key] = true; G.armedReins = false; }
      const shielded = (this.Y.outwards || []).includes(e.rds);
      const mult = (shielded ? 0.5 : 1) * (G.ilw[e.key] ? 0.5 : 1) * (G.reinsCall[e.key] ? 0.5 : 1);
      let loss = 0;
      for (const b of hitBooks) { loss += b.P * b.deal.rds[e.rds] * e.sev * mult; b.catHit = true; this.paintBinder(b); }
      const net = loss * (G.qs ? 1 - E.QS_SHARE : 1);
      e.loss = net; e.gross = gross;
      if (loss > 0 && (shielded || G.ilw[e.key])) G.calledIt = true;
      S.body.querySelectorAll('.cbtns').forEach((n) => n.remove());
      const rowN = S.body.querySelector('.rdsrow[data-r="' + e.rds + '"]');
      const [tx, ty] = centre(rowN || S.body);
      if (!R.sober) FX.storm(tx, ty, 1.6);
      setTimeout(() => {
        if (!R.sober) { flash(); shake(app); }
        Sound.bell(1);
        if (rowN) { rowN.classList.remove('threat'); rowN.classList.add('hit'); }
        const ll = S.body.querySelector('#lossline');
        const cover = [shielded && 'your shield', G.ilw[e.key] && 'the ILW', G.reinsCall[e.key] && 'the Reinsurance Call'].filter(Boolean);
        if (net > 0) {
          ll.textContent = (R.sober ? 'Net loss to the syndicate: ' : e.name + ' costs you ') + fmtM(net);
          S.body.querySelector('#cTxt').textContent = 'The event came in at ' + Math.round(e.sev * 100) + '% of the full scenario.' + (cover.length ? ' Saved by ' + cover.join(' and ') + '.' : ' No cover on it.') + (G.qs ? ' Your outward QS takes a quarter.' : '');
          if (!R.sober) {
            const k = Math.min(6, 1 + Math.floor(net / 3));
            for (let i = 0; i < k; i++) {
              const f = el('<span class="lossfloat" style="left:' + (tx - 30 + rand() * 60) + 'px;top:' + (ty - 10) + 'px">' + fmtM(-net / k) + '</span>');
              document.body.appendChild(f);
              f.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-90px)', opacity: 0 }], { duration: 1300, delay: i * 120, easing: 'ease-out', fill: 'forwards' }).onfinish = () => f.remove();
            }
          }
          this.tick((R.sober ? 'MAJOR LOSS · ' + R.name.toUpperCase() : 'CATASTROPHE · ' + e.name.toUpperCase()) + ' · ' + G.no + ' NET LOSS ' + fmtM(net).toUpperCase());
        } else {
          ll.textContent = R.sober ? 'No exposure to this scenario.' : e.name + ' misses you.';
          ll.classList.add('miss');
          S.body.querySelector('#cTxt').textContent = 'You had nothing on ' + R.name + '.' + (reinsKept ? ' Your Reinsurance Call stays armed for the next one.' : '');
          this.tick(R.sober ? R.name.toUpperCase() + ' · ' + G.no + ' HAS NO EXPOSURE' : e.name.toUpperCase() + ' MISSES ' + G.no + '. THE ROOM EXHALES.');
        }
        this.updateRace();
        setTimeout(() => this.solvency(), 900 / SPEED);
      }, (R.sober ? 300 : 700) / SPEED);
    },
    solvency() {
      const C = this.cat; if (!C) return;
      const { e, S } = C;
      let pending = null;
      E.scoreGame(G.entries, gameOpts({ cashCallChoice: (info) => { if (info.month === e.month && !(info.month in G.cashChoices)) { pending = info; return 'pay'; } return G.cashChoices[info.month] || 'pay'; } }));
      const finish = () => { this.cat = null; S.close(); G.entries.forEach((b) => this.paintBinder(b)); this.resumeFF(); };
      const nx = S.body.querySelector('#cnext');
      if (!pending) {
        nx.innerHTML = '<button class="btn primary" id="cgo">Continue <span class="kbd">Enter</span></button>';
        const b = nx.querySelector('#cgo'); b.addEventListener('click', finish); this.focusLater(b);
        if (AUTO) setTimeout(finish, 500 / SPEED);
        return;
      }
      const m = pending.month, myShare = pending.aligned != null ? pending.aligned : 1;
      nx.innerHTML = '<div class="cashcall"><h4>Lloyd’s cash call</h4><p>After ' + esc(e.name) + ', your capital (' + fmtM(pending.capitalNow) + ' including funds held in your open years) is below the solvency line (' + fmtM(pending.line) + ', 60% of your ECA).</p>' +
        '<p>Top up <b>' + fmtM(pending.topUp) + '</b> now' + (myShare < 0.999 ? ': your share (' + pct(myShare) + ') is <b>' + fmtM(pending.topUp * myShare) + '</b> and your members pay the rest' : '') + '. Emergency capital is expensive: it costs you <b>' + fmtM(pending.cost * myShare) + '</b> of value (−' + fmtPts(pending.cost * myShare * 1000) + ' points). Or go into run-off, and the game ends here.</p>' +
        '<div class="resactions"><button class="btn brass" id="pay">Pay up</button><button class="btn danger" id="runoff">Run-off</button></div></div>';
      Sound.thud();
      const pay = nx.querySelector('#pay');
      pay.addEventListener('click', () => { G.cashChoices[m] = 'pay'; G.cashTopUps[m] = pending.topUp; toast('Cash call paid', 'Your backers are not thrilled.', 'var(--warn)'); finish(); });
      nx.querySelector('#runoff').addEventListener('click', () => { G.cashChoices[m] = 'runoff'; G.runoff = m; this.cat = null; S.close(); this.endGame(); });
      this.focusLater(pay);
      if (AUTO) setTimeout(() => nx.querySelector(params.get('cash') === 'runoff' ? '#runoff' : '#pay').click(), 500 / SPEED);
    },
    endGame() {
      this.over = true; this.overlayTick = null;
      this.setPhase('ended', 'Run-off');
      Sound.bell(1);
      toast('Run-off', G.no + ' has stopped writing. The lawyers will take it from here.', 'var(--bad)', 4);
      setTimeout(() => go('results'), 1600 / SPEED);
    },

    // ---- 15 December: the renewal review (years 2 and 3) ----
    openReview() {
      const y = this.y;
      this.setPhase('review', '15 December ' + yoaName(y - 1) + ' · renewal review');
      if (y === 1 && G.racehorse) toast('The racehorse retires', 'The bloodstock binder won’t renew. The founder is “devastated”.', 'var(--warn)', 4);
      const books = yoaEntries(y - 1).filter((e) => e.alert !== 'exit' && !e.deal.forced);
      if (!books.length) { toast('Nothing to renew', 'Last year’s book is empty. Straight to the 1.1 rush.', 'var(--warn)'); this.startRush(); return; }
      const cards = books.map((e) => {
        const cat = this.lineCat(e), C = E.CLASSES[e.deal.cls];
        return { e, tl: E.bookTrafficLight(e, G.market, cat), norm: C.lr + C.cat, catPart: cat / Math.max(0.1, e.P), offer: E.renewalOffer(e, G.market, y), state: 'renew' };
      });
      const premOf = (c) => (c.state === 'shred' ? 0 : E.round1(c.e.P * (c.state === 'grow' ? 1.5 : 1) * (1 + c.offer.offeredRate / 100)));
      const LW = { good: 'good', warn: 'so-so', bad: 'bad' };
      const S = this.sheet('<span class="eyebrow">15 December ' + yoaName(y - 1) + ' · renewal review</span><h3>What do we renew at 1.1?</h3>' +
        '<p class="muted sm">Now you can see how last year’s books really ran: each card shows its loss ratio (LR) against the norm for its class, and the catastrophe part of it. <b>Drag the dogs into the shredder</b>. Tap a card to cycle Renew → Grow (half as much again) → Shred.</p>' +
        '<div class="rsum" id="rsum"></div><div class="rgrid" id="rgrid"></div>' +
        '<div class="shredrow"><div class="shredder" id="shredder">' + icon('shred') + '<span>Shredder</span></div>' +
        '<div class="rfoot"><div class="timer" id="rTimer"><span class="num">25s</span><span class="track"><span class="fill"></span></span></div><button class="btn primary" id="rDone">Send to the brokers →</button></div></div>', 'reviewsheet');
      const grid = S.body.querySelector('#rgrid');
      const card = (c, i) => '<button class="rcard ' + c.state + '" data-i="' + i + '" style="--c:' + clsColor(c.e.deal.cls) + '"><span class="spine"></span>' +
        '<span class="rt"><i class="light ' + c.tl.light + '"></i><b>' + esc(c.e.deal.label) + '</b></span>' +
        '<span class="rm">' + esc(E.CLASSES[c.e.deal.cls].short) + ' · LR ' + Math.round(c.tl.lr * 100) + '% vs ' + Math.round(c.norm * 100) + '% norm' + (c.catPart >= 0.005 ? ' (cat ' + Math.round(c.catPart * 100) + '%)' : '') + ' · ' + LW[c.tl.light] + ' · offer ' + (c.offer.offeredRate > 0 ? '+' : '') + c.offer.offeredRate + '%</span>' +
        (c.e.catHit && c.offer.offeredRate > 0 ? '<span class="rhint">Hit by a catastrophe, rates now +' + c.offer.offeredRate + '%</span>' : '') +
        '<span class="rst">' + (c.state === 'shred' ? 'Not renewed' : (c.state === 'grow' ? 'Grow · ' : 'Renew · ') + '£' + premOf(c).toFixed(1) + 'm') + '</span></button>';
      const paintSum = () => {
        const tot = cards.reduce((s, c) => s + premOf(c), 0);
        const cap = this.Y.capacity;
        S.body.querySelector('#rsum').innerHTML = 'Renewing <b class="num">' + fmtM(tot) + '</b> of your <b class="num">£' + cap.toFixed(0) + 'm</b> stamp for ' + yoaName(y) +
          ' <span class="rbarwrap"><i style="width:' + Math.min(100, (tot / (cap * 1.3)) * 100) + '%;background:' + (tot > cap * 1.1 ? 'var(--bad)' : 'var(--crane)') + '"></i><span class="line" style="left:' + (100 / 1.3).toFixed(1) + '%"></span></span>' +
          (tot > cap * 1.1 ? ' <b style="color:#ffb3a6">Over plan before 1.1 even starts.</b>' : ' The rest comes from new business at 1.1 and 1.7.');
      };
      const paintCard = (i) => { const old = grid.querySelector('.rcard[data-i="' + i + '"]'); const n = el(card(cards[i], i)); old.replaceWith(n); wire(n); };
      const setState = (i, st, fx) => {
        const c = cards[i]; if (c.state === st) return;
        c.state = st;
        if (st === 'shred') {
          Sound.shred();
          const sh = S.body.querySelector('#shredder'); sh.classList.remove('chomp'); void sh.offsetWidth; sh.classList.add('chomp');
          if (fx) { const [x, yy] = centre(sh); FX.burst(x, yy - 20, 'confetti', 22); }
        } else Sound.tick();
        paintCard(i); paintSum();
      };
      const wire = (n) => {
        const i = +n.dataset.i;
        draggable(n, {
          onStart: () => n.classList.add('dragging'),
          onMove: (dx, dy, ev) => { n.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + dx / 30 + 'deg)'; S.body.querySelector('#shredder').classList.toggle('drop', !!dropTarget(ev.clientX, ev.clientY, '#shredder', n)); },
          onEnd: (dx, dy, vx, vy, ev, cancelled) => {
            n.classList.remove('dragging');
            const hit = !cancelled && dropTarget(ev.clientX, ev.clientY, '#shredder', n);
            S.body.querySelector('#shredder').classList.remove('drop');
            if (hit) { n.animate([{ transform: n.style.transform, opacity: 1 }, { transform: n.style.transform + ' scaleY(.1)', opacity: 0 }], { duration: 260, easing: 'ease-in' }); setTimeout(() => setState(i, 'shred', true), 240); }
            n.style.transform = '';
          },
          onTap: () => setState(i, ({ renew: 'grow', grow: 'shred', shred: 'renew' })[cards[i].state], true)
        });
      };
      grid.innerHTML = cards.map(card).join('');
      grid.querySelectorAll('.rcard').forEach(wire);
      paintSum();
      let done = false, t = 25;
      const confirm = () => {
        if (done) return; done = true;
        let renewedP = 0, n = 0, shredded = 0;
        for (const c of cards) {
          if (c.state === 'shred') { c.e.shredded = true; shredded++; if (c.tl.light === 'bad') G.shreddedRed++; this.paintBinder(c.e); continue; }
          const ne = { deal: c.offer, P: premOf(c), start: 12 * y + (c.offer.window === '1.7' ? 6 : 0), yoa: y, line: c.e.line, renewed: true };
          G.entries.push(ne); this.addBinder(ne);
          renewedP += ne.P; n++;
        }
        S.close();
        toast('Renewals agreed', n + ' books renewed for ' + fmtM(renewedP) + (shredded ? ', ' + shredded + ' shredded.' : '.'), 'var(--brass)');
        this.tick('RENEWALS · ' + G.no + ' RENEWS ' + n + ' BOOKS FOR ' + fmtM(renewedP).toUpperCase() + (shredded ? ' · ' + shredded + ' SHREDDED' : ''));
        this.checkGWP(); this.updateRace();
        this.startRush();
      };
      S.body.querySelector('#rDone').addEventListener('click', confirm);
      this.overlayTick = (dt) => {
        t -= dt;
        const tm = S.body.querySelector('#rTimer');
        tm.querySelector('.num').textContent = Math.max(0, Math.ceil(t)) + 's';
        tm.querySelector('.fill').style.transform = 'scaleX(' + Math.max(0, t / 25) + ')';
        tm.classList.toggle('hot', t < 6);
        if (t <= 0) confirm();
      };
      if (AUTO) setTimeout(() => {
        cards.forEach((c, i) => {
          if (c.tl.light === 'bad' || E.estimateQ(c.offer, G.au, 0) > 1.12) setState(i, 'shred');
          else if (c.tl.light === 'good' && c.offer.offeredRate > 0) setState(i, 'grow');
        });
        setTimeout(confirm, 400 / SPEED);
      }, 400 / SPEED);
    },

    // ---- 1 September: SBF day ----
    openPlanning() {
      const y = this.y, Y = this.Y;
      this.setPhase('sbf', '1 September · SBF day');
      const out = G.market.years[y].outlook;
      const proj = E.projectYoA(G.entries, G.market, y, 12 * y + 8, G.au, protOpts());
      const split0 = Object.assign({}, Y.split);
      const plan = { ask: 'hold', split: Object.assign({}, Y.split) };
      const byOutlook = Object.keys(E.CLASSES).sort((a, b) => out[b] - out[a]);
      const hot = byOutlook[0], soft = byOutlook[byOutlook.length - 1];
      const outsider = byOutlook.find((c) => !split0[c]);
      const chips = byOutlook.filter((c) => split0[c]).concat(byOutlook.filter((c) => !split0[c]).slice(0, 2));
      const sign = (v) => (v > 0 ? '+' : '') + v + '%';
      const S = this.sheet('<span class="eyebrow">1 September ' + yoaName(y) + ' · Syndicate Business Forecast (SBF)</span><h3>Plan YoA ' + yoaName(y + 1) + '</h3>' +
        '<div class="desk"><div class="dk-col"><div class="dk-proj"><span class="eyebrow">YoA ' + yoaName(y) + ' projected</span><b class="num" style="color:' + corColor(proj) + '">' + Math.round(proj * 100) + '%</b><small>combined ratio (COR: losses and costs as a share of premium). Lloyd’s Performance Management (PMD) caps growth above 95%, blocks it above 105%, and cuts the stamp by 20% above 115%.</small></div>' +
        '<div class="dk-out"><span class="eyebrow">Market outlook for ' + yoaName(y + 1) + '</span><div class="ochips">' +
        chips.map((c) => '<span class="ochip ' + (out[c] >= 3 ? 'up' : out[c] <= -3 ? 'down' : '') + '" style="--c:' + clsColor(c) + '"><i></i>' + esc(E.CLASSES[c].short) + ' <b class="num">' + sign(out[c]) + '</b></span>').join('') + '</div>' +
        '<p class="monte">Back from Monte Carlo: everyone says ' + esc(E.CLASSES[hot].name) + ' is ' + (out[hot] > 0 ? 'up ' + out[hot] + '%' : 'flat') + '. Nobody mentions ' + esc(E.CLASSES[soft].name) + '.</p></div></div>' +
        '<div class="dk-col"><span class="eyebrow">Stamp capacity</span><div class="capbtns" id="capbtns"></div>' +
        '<span class="eyebrow">Business mix · <span id="moves"></span></span><div class="dkmix" id="dkmix"></div></div></div>' +
        '<div class="dk-foot" id="dkFoot"><div class="timer" id="pTimer"><span class="num">30s</span><span class="track"><span class="fill"></span></span></div><button class="btn primary" id="pDone">Submit the SBF →</button></div>', 'desksheet');
      const moves = (s) => { let d = 0; for (const k of new Set([...Object.keys(s), ...Object.keys(split0)])) d += Math.abs((s[k] || 0) - (split0[k] || 0)); return d / 2; };
      const move = (from, to) => {
        if (from === to || !plan.split[from]) return;
        const s = Object.assign({}, plan.split); s[from]--; s[to] = (s[to] || 0) + 1; if (!s[from]) delete s[from];
        if (Object.keys(s).length > 4) { toast('Four classes at most', 'Lloyd’s likes a focused plan.', 'var(--warn)'); return; }
        if (moves(s) > 2) { toast('Two chip moves at most', 'PMD won’t wear a bigger change in one plan.', 'var(--warn)'); return; }
        plan.split = s; Sound.tick(); paint();
      };
      const paint = () => {
        const cb = S.body.querySelector('#capbtns');
        cb.innerHTML = Object.keys(E.CAPACITY_STEPS).map((k) => {
          const stamp = Math.round(Y.capacity * E.CAPACITY_STEPS[k]);
          const eca = E.capitalFor(plan.split, G.loading, G.qs, stamp).eca;
          return '<button class="capbtn' + (plan.ask === k ? ' on' : '') + '" data-k="' + k + '" aria-pressed="' + (plan.ask === k) + '"><b>' + STEP_LABEL[k][0] + '</b><span class="num">' + STEP_LABEL[k][1] + ' · £' + stamp + 'm</span><small class="num">ECA £' + eca.toFixed(0) + 'm</small></button>';
        }).join('');
        cb.querySelectorAll('.capbtn').forEach((b) => b.addEventListener('click', () => { plan.ask = b.dataset.k; Sound.tick(); paint(); }));
        const rows = Array.from(new Set(Object.keys(split0).concat(Object.keys(plan.split)).concat(outsider && Object.keys(split0).length < 4 ? [outsider] : [])));
        const mix = S.body.querySelector('#dkmix');
        mix.innerHTML = rows.map((k) => '<div class="dkrow" data-cls="' + k + '"><span class="dn"><i style="background:' + clsColor(k) + '"></i>' + esc(E.CLASSES[k].short) + ' <em class="' + (out[k] >= 3 ? 'up' : out[k] <= -3 ? 'down' : '') + '">' + sign(out[k]) + '</em></span>' +
          '<span class="chips">' + Array.from({ length: plan.split[k] || 0 }, () => '<span class="chip" data-cls="' + k + '" style="--c:' + clsColor(k) + '"></span>').join('') + '</span>' +
          '<span class="ctl"><button data-act="minus" aria-label="One chip less, to the hardest class">−</button><button data-act="plus" aria-label="One chip more, from the softest class">+</button></span></div>').join('');
        mix.querySelectorAll('.dkrow').forEach((r) => {
          const k = r.dataset.cls;
          const others = rows.filter((o) => o !== k);
          r.querySelector('[data-act="plus"]').addEventListener('click', () => { const donor = others.filter((o) => plan.split[o]).sort((a, b) => out[a] - out[b])[0]; if (donor) move(donor, k); });
          r.querySelector('[data-act="minus"]').addEventListener('click', () => { const recv = others.slice().sort((a, b) => out[b] - out[a])[0]; if (recv) move(k, recv); });
        });
        mix.querySelectorAll('.chip').forEach((chip) => {
          let ghost = null;
          draggable(chip, {
            onStart: () => { ghost = el('<span class="chip ghost" style="--c:' + clsColor(chip.dataset.cls) + '"></span>'); document.body.appendChild(ghost); },
            onMove: (dx, dy, ev) => {
              ghost.style.left = ev.clientX - 13 + 'px'; ghost.style.top = ev.clientY - 13 + 'px';
              mix.querySelectorAll('.dkrow').forEach((s) => s.classList.remove('drop'));
              const t = dropTarget(ev.clientX, ev.clientY, '.dkrow', ghost); if (t) t.classList.add('drop');
            },
            onEnd: (dx, dy, vx, vy, ev) => {
              if (ghost) ghost.remove(); ghost = null;
              const t = dropTarget(ev.clientX, ev.clientY, '.dkrow');
              mix.querySelectorAll('.dkrow').forEach((s) => s.classList.remove('drop'));
              if (t) move(chip.dataset.cls, t.dataset.cls);
            }
          });
        });
        S.body.querySelector('#moves').textContent = moves(plan.split) + ' of 2 chip moves';
      };
      paint();
      let done = false, t = 30;
      const submit = () => {
        if (done) return; done = true;
        this.overlayTick = null;
        const v = E.pmdVerdict(proj, E.CAPACITY_STEPS[plan.ask]);
        const stamp = Math.round(Y.capacity * v.mult);
        G.next = { capacity: stamp, split: plan.split, verdict: v, ask: plan.ask };
        if (Object.keys(plan.split).some((k) => (plan.split[k] || 0) > (split0[k] || 0) && out[k] >= 8)) G.cycleSurf = true;
        S.body.querySelectorAll('.capbtn, .dkrow button').forEach((b) => { b.disabled = true; });
        const foot = S.body.querySelector('#dkFoot');
        foot.innerHTML = '<p class="verdict"><b>PMD:</b> ' + esc(v.note) + ' Stamp for ' + yoaName(y + 1) + ': <b class="num">£' + stamp + 'm</b>.</p><button class="btn primary" id="pGo">Continue <span class="kbd">Enter</span></button>';
        slamStamp(S.body.querySelector('.desk'), esc(v.stamp) + '<small>PMD · YoA ' + yoaName(y + 1) + '</small>', { pos: 'right:6%;top:30%', rot: -8, shake: false, blue: v.stamp === 'Approved' });
        this.tick('SBF SUBMITTED · YOA ' + yoaName(y + 1) + ' · PMD SAYS: ' + v.stamp.toUpperCase());
        const go2 = foot.querySelector('#pGo');
        go2.addEventListener('click', () => { S.close(); this.resumeFF(); });
        this.focusLater(go2);
        if (AUTO) setTimeout(() => go2.click(), 500 / SPEED);
      };
      S.body.querySelector('#pDone').addEventListener('click', submit);
      this.overlayTick = (dt) => {
        t -= dt;
        const tm = S.body.querySelector('#pTimer'); if (!tm) return;
        tm.querySelector('.num').textContent = Math.max(0, Math.ceil(t)) + 's';
        tm.querySelector('.fill').style.transform = 'scaleX(' + Math.max(0, t / 30) + ')';
        tm.classList.toggle('hot', t < 6);
        if (t <= 0) submit();
      };
      if (AUTO) setTimeout(() => {
        plan.ask = proj < 0.95 ? 'grow' : 'hold';
        const inMix = Object.keys(plan.split);
        const best = Object.keys(E.CLASSES).filter((c) => inMix.includes(c) || inMix.length < 4).sort((a, b) => out[b] - out[a])[0];
        const worst = inMix.filter((c) => c !== best && plan.split[c] > 1).sort((a, b) => out[a] - out[b])[0];
        if (best && worst && out[best] - out[worst] >= 8) { move(worst, best); move(worst, best); }
        paint();
        setTimeout(submit, 300 / SPEED);
      }, 400 / SPEED);
    },

    // ---- 30 November: coming into line ----
    openCIL() {
      const y = this.y, Y = this.Y;
      this.setPhase('cil', '30 November · coming into line');
      const nx = G.next || { capacity: Y.capacity, split: Object.assign({}, Y.split), verdict: null, ask: 'hold' };
      G.next = nx;
      const mem = Y.members || [];
      if (!mem.length) { nx.members = []; return this.cilCapital(nx); }
      this.memberReview(nx);
    },
    // third-party members look at the year and decide: stay, leave, cut, or ask for a bigger line
    memberReview(nx) {
      const y = this.y, Y = this.Y;
      const info = E.memberReturn(G.entries, G.market, y, G.au, Y, G.qs, protOpts());
      const review = E.memberReview(Y.members, info);
      const key = (x) => x.kind + '|' + x.label;
      const accept = {};
      const SAY = {
        leaves: { names: 'Walking away. Their members’ agent has “concerns”.', ils: 'Out. The fund’s investors didn’t sign up for this.', corporate: 'Leaving the stamp.' },
        cuts: 'Halving their share. Patience has limits.',
        stays: { family: G.racehorse ? 'Loyal as ever. The racehorse sends its regards.' : 'Loyal as ever.', other: 'Staying on the same line.' }
      };
      const pcf = (x) => Math.round(x * 100) + '%';
      const rule = (k) => {
        const M = E.MEMBERS[k]; if (!M) return '';
        if (M.stays) return 'Always stays.';
        const down = M.halve != null ? 'Halves its share below ' + (M.halve < 0 ? '−' : '') + pcf(Math.abs(M.halve)) : 'Leaves below ' + pcf(M.leave || 0) + (M.catLimit ? ', or if catastrophes cost over ' + pcf(M.catLimit) + ' of FAL' : '');
        return down + '. Asks for ' + pcf(M.growBy) + ' more above ' + pcf(M.grow) + '.';
      };
      const S = this.sheet('<span class="eyebrow">30 November ' + yoaName(y) + ' · coming into line</span><h3>Member review</h3>' +
        '<p class="muted sm">Your members’ projected return on their capital this year, after your fees and profit commission: <b class="num" style="color:' + (info.ret < 0 ? '#ffb3a6' : 'var(--good)') + '">' + (info.ret >= 0 ? '+' : '') + Math.round(info.ret * 100) + '%</b>' +
        (info.catHit > 0.05 ? '. Catastrophes cost the syndicate ' + Math.round(info.catHit * 100) + '% of its FAL' : '') + '. Members react before next year’s capital is set.</p>' +
        '<div class="mrev" id="mrev"></div><div class="cilact"><p class="verdict" id="mSum"></p><button class="btn primary" id="mGo">On to the capital check →</button></div>', 'cilsheet');
      const paint = () => {
        const box = S.body.querySelector('#mrev');
        box.innerHTML = review.map((x, i) => {
          const k = key(x), on = accept[k];
          const said = x.action === 'leaves' ? (SAY.leaves[x.kind] || SAY.leaves.corporate) : x.action === 'cuts' ? SAY.cuts : x.action === 'offers' ? 'Wants a bigger share. More fees and commission for you, but less of the upside.' : (x.kind === 'family' ? SAY.stays.family : SAY.stays.other);
          const to = x.action === 'offers' ? (on ? x.to : x.share) : x.to;
          return '<div class="mcard ' + x.action + (on ? ' accepted' : '') + '" style="--mc:' + x.color + '"><span class="mn"><i></i><b>' + esc(x.label) + '</b></span>' +
            '<span class="ml num">' + Math.round(x.share * 100) + '% → <b>' + Math.round(to * 100) + '%</b>' + (x.action === 'offers' && !on ? ' (offered ' + Math.round(x.to * 100) + '%)' : '') + '</span><em>' + esc(said) + '</em><small class="mrule">' + esc(rule(x.kind)) + '</small>' +
            (x.action === 'offers' ? '<span class="mbtns"><button class="btn' + (on ? ' brass' : '') + '" data-i="' + i + '" data-a="1">' + (on ? 'Accepted' : 'Accept') + '</button><button class="btn' + (on ? '' : ' ghostish') + '" data-i="' + i + '" data-a="0">Decline</button></span>' : '') + '</div>';
        }).join('');
        box.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', () => { accept[key(review[+b.dataset.i])] = b.dataset.a === '1'; Sound.tick(); paint(); }));
        const next = E.applyReview(review, (x) => !!accept[key(x)]);
        const a = 1 - next.reduce((s2, x) => s2 + x.share, 0);
        S.body.querySelector('#mSum').innerHTML = 'Next year your share is <b class="num">' + Math.round(a * 100) + '%</b> of the stamp' + (a > 1 - Y.members.reduce((s2, x) => s2 + x.share, 0) + 0.005 ? ': you must fund the gap your members leave.' : '.');
      };
      paint();
      const done = () => {
        const next = E.applyReview(review, (x) => !!accept[key(x)]);
        G.memberNews[y] = review.filter((x) => x.action !== 'stays').map((x) => ({ label: x.label, action: x.action, from: x.share, to: x.action === 'offers' ? (accept[key(x)] ? x.to : x.share) : x.to, accepted: !!accept[key(x)] }));
        if (review.some((x) => x.action === 'offers')) G.darling = true;
        nx.members = next;
        this.tick('MEMBER REVIEW · ' + (G.memberNews[y].length ? G.memberNews[y].map((n) => n.label.toUpperCase() + ' ' + ({ leaves: 'LEAVES', cuts: 'CUTS ITS LINE', offers: n.accepted ? 'GROWS' : 'OFFERED MORE' })[n.action]).join(' · ') : 'EVERYONE STAYS'));
        S.close();
        this.cilCapital(nx);
      };
      const go = S.body.querySelector('#mGo');
      go.addEventListener('click', done);
      this.focusLater(go);
      if (AUTO) setTimeout(() => {
        const target = Math.max(E.MIN_ALIGNED, Math.min(1, parseFloat(params.get('al')) || 0.5));
        let third = Y.members.reduce((s2, x) => s2 + x.share, 0);
        review.forEach((x) => { if (x.action === 'offers' && 1 - (third + x.to - x.share) >= target - 0.001) { accept[key(x)] = true; third += x.to - x.share; } });
        paint();
        setTimeout(done, 300 / SPEED);
      }, 400 / SPEED);
    },
    // the agency's own capital must cover its share of next year's ECA
    cilCapital(nx) {
      const y = this.y, Y = this.Y;
      const eca = E.capitalFor(nx.split, G.loading, G.qs, nx.capacity).eca;
      const res = this.live();
      const held = res.uwCurve[12 * y + 10] || 0, extra = falExtra();
      const aNow = 1 - (Y.members || []).reduce((s2, x) => s2 + x.share, 0);
      const members = nx.members || [];
      const aNext = 1 - members.reduce((s2, x) => s2 + x.share, 0);
      const myFal = Y.alignedFal != null ? Y.alignedFal : Y.fal;
      const mine = aNow * (held + extra);
      const avail = myFal + mine, need = aNext * eca;
      Object.assign(nx, { eca, members, capital: Y.capital.map((c) => Object.assign({}, c)), alignedFal: myFal, final: nx.capacity });
      const scale = Math.max(avail, need) * 1.15;
      const pctW = (v) => Math.max(0, Math.min(100, (v / scale) * 100)).toFixed(1) + '%';
      const S = this.sheet('<span class="eyebrow">30 November ' + yoaName(y) + ' · coming into line</span><h3>Come into line</h3>' +

  function miniRing(split, size = 18) {

        '<div class="dateline"><span>31 December ' + yoaName(2) + ' · Late edition</span><span>Price: one Lutine Bell</span></div>' +
        '<h2>' + esc(hl) + '</h2><p class="deck">' + esc(deck) + '</p>' +
        '<div class="cols"><div class="photo">' + face(G.au, res.score >= 0 ? 'grin' : 'worried') + '</div><div class="body"><p>' + esc(para) + '</p><p>“' + esc(quote.replace(/\.$/, ',')) + '” said ' + esc(E.AUS[G.au].name) + ', Active Underwriter.</p></div></div>' +
        '<div class="figs"><div><b class="num">' + (res.gwp ? Math.round(res.cor * 100) + '%' : '–') + '</b><span>Combined ratio</span></div><div><b class="num">' + pct(res.roc, 1) + '</b><span>Syndicate RoC</span></div><div><b class="num">' + fmtM(res.value, true) + '</b><span>Your value</span></div><div><b class="num">' + fmtPts(res.score) + '</b><span>Score</span></div></div></article>' +
        '<div class="scorebox"><div class="bigscore"><span class="n num" id="bigN">0</span><small class="pts">points · £1k = 1 point</small><span class="g">' + esc(grade) + '</span></div>' +
        '<div class="panel fbpanel" id="fbPanel"><span class="eyebrow">Make it better</span>' + fbBlockHTML('fb', 'One thing that would make this game better?') + '</div>' +
        '<div class="panel"><span class="eyebrow">This week’s leaderboard · ' + WEEK_LABEL + ' · points (£1k = 1 point)</span><div class="lb" id="lb"></div><p class="muted" id="lbNote" style="font-size:.78rem;margin:8px 0 0"></p></div>' +
        '<div class="panel"><span class="eyebrow">Year by year</span>' + yoaTableHTML(res) + '</div>' +
        '<div class="panel"><span class="eyebrow">How you scored over three years (£m)</span>' + waterfallSVG(res) + '</div>' +
        '<div class="panel"><span class="eyebrow">Badges</span><div class="badges">' + (badges.length ? badges.map((b, i) => '<span class="badge' + (BADGES[b][2] ? ' shame' : '') + '" style="--dl:' + (0.6 + i * 0.15) + 's" title="' + esc(BADGES[b][1]) + '">' + esc(BADGES[b][0]) + '</span>').join('') : '<span class="muted">No badges this time. The Room is a hard school.</span>') + '</div></div>' +
        '</div></div></section>');
      this.root = root; this.res = res; this.rivalRuns = rivalRuns; this.grade = grade;
      // Play again asks for one idea first, unless feedback has already gone from this screen
      const startAgain = () => { newGame(); interstitial('enquiry', () => go('build')); };
      this.fbSent = false;
      root.querySelector('#again').addEventListener('click', () => (this.fbSent ? startAgain() : this.askFeedback(startAgain)));
      root.querySelector('#copy').addEventListener('click', () => this.copy());
      const panel = root.querySelector('#fbPanel');
      this.wireFeedback(panel, 'fb');
      root.querySelector('#fbJump').addEventListener('click', () => { panel.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }); root.querySelector('#fbText').focus({ preventScroll: true }); });
      this.entry = {
        season: WEEK, seed: G.season, score: res.score, syndicateNo: G.no, syndicateName: String(G.name).slice(0, 28), mixType: G.mixId, split: G.split, au: G.au,
        badges: badges.slice(0, 8), cor: Math.round(res.cor * 1000) / 1000, roc: Math.round(res.roc * 1000) / 1000, per: res.per.map((P) => E.round1(P.value)), runoff: res.runoff, aligned: Math.round(res.alignedAvg * 100) / 100,
        curve: res.curve.map((v) => E.round1(v)), at: new Date().toISOString()
      };
      this.lbListener = () => this.renderLB();
      LB.listeners.add(this.lbListener);
      return root;
    },
    mounted() {
      const res = this.res;
      Sound.bell(res.score >= 0 ? 2 : 1);
      if (res.score > 0) setTimeout(() => { const [x, y] = centre(this.root.querySelector('#bigN')); FX.burst(x, y, 'confetti', 70); }, 900);
      const n = this.root.querySelector('#bigN');
      const t0 = performance.now(), dur = REDUCED ? 1 : 1400;
      const step = () => { const k = Math.min(1, (performance.now() - t0) / dur); n.textContent = fmtPts(res.score * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      this.renderLB();
      LB.submit(this.entry).then((r) => {
        this.submitted = r;
        const note = this.root && this.root.querySelector('#lbNote');
        if (!note) return;
        note.textContent = r.shared ? (r.best === false ? 'Your best score this week is already on the shared board.' : 'Your score is on the shared board for everyone who can open this game.')
          : LB.live ? 'Saved on this device. To post to the shared board, ask the owner for Contributor access.' : 'This board lives on this device. Share your result and challenge colleagues to beat it.';
        this.renderLB();
      });
    },
    exit() { LB.listeners.delete(this.lbListener); },
    renderLB() {
      const box = this.root && this.root.querySelector('#lb'); if (!box) return;
      let humans = LB.live ? LB.rows.map((r) => Object.assign({}, r, { who: LB.displayName(r), me: r.uid === LB.uid })) : store.get('lsl-local-' + WEEK, []).map((r) => Object.assign({}, r, { who: r.me ? 'You' : 'Someone' }));
      if (LB.live && !humans.some((h) => h.me && h.score === this.entry.score)) humans.push(Object.assign({}, this.entry, { uid: 'this-run', who: 'This run', me: true }));
      const ai = Object.keys(this.rivalRuns).map((id) => ({ uid: 'ai-' + id, who: E.RIVALS[id].name + ' (AI)', ai: true, score: this.rivalRuns[id].score, syndicateNo: E.RIVALS[id].no, syndicateName: E.RIVALS[id].blurb, split: E.MIX_BY_ID[E.RIVALS[id].mix].split, mixType: E.RIVALS[id].mix }));
      const rows = humans.concat(ai).sort((a, b) => b.score - a.score).slice(0, 14);
      const pref = store.get('lsl-ghost', null);
      box.innerHTML = rows.map((r, i) => '<button class="lbrow' + (r.me ? ' me' : '') + (r.ai ? ' ai' : '') + (pref && r.uid === pref ? ' ghostpick' : '') + '" data-uid="' + esc(r.uid) + '"' + (r.ai || r.me ? ' tabindex="-1"' : '') + '>' +
        '<span class="rk">' + (i + 1) + '</span>' + miniRing(r.split || {}) + '<span class="who"><b>' + esc(r.who) + '</b><span>' + esc((r.syndicateNo ? r.syndicateNo + ' · ' : '') + (r.syndicateName || '') + (r.mixType && E.MIX_BY_ID[r.mixType] && !r.ai ? ' · ' + E.MIX_BY_ID[r.mixType].name : '')) + '</span></span>' +
        '<span class="sc num">' + fmtPts(r.score) + '</span></button>').join('');
      box.querySelectorAll('.lbrow').forEach((b) => b.addEventListener('click', () => {
        const uid = b.dataset.uid;
        if (!LB.live || uid.startsWith('ai-') || uid === LB.uid || uid === 'this-run') return;
        store.set('lsl-ghost', uid);
        toast('Ghost chosen', 'Next game you’ll race their ghost.', 'var(--brass)');
        this.renderLB();
      }));
    },
    // the feedback panel: starter chips, a draft kept on this device, and a live mailto link
    // box holds one feedback block (prefix p); both blocks share the draft kept on this device
    wireFeedback(box, p, onSent) {
      const ta = box.querySelector('#' + p + 'Text'), mail = box.querySelector('#' + p + 'Mail'), note = box.querySelector('#' + p + 'Note');
      const body = () => feedbackBody(this.res, this.grade, ta.value);
      const refresh = () => { mail.href = feedbackMail(body()); store.set('lsl-fb-draft', ta.value); };
      const thanks = () => {
        box.classList.add('sent'); note.textContent = 'Thanks! That goes straight into the next version.'; store.set('lsl-fb-draft', '');
        this.fbSent = true;
        if (onSent) onSent();
      };
      const needText = (e) => {
        if (ta.value.trim().length >= 3) return false;
        e.preventDefault(); ta.focus();
        toast('Add a line first', 'One sentence is plenty. Tap a starter if you like.', 'var(--warn)');
        return true;
      };
      ta.value = store.get('lsl-fb-draft', '') || '';
      refresh();
      ta.addEventListener('input', refresh);
      box.querySelectorAll('.fbchip').forEach((c) => c.addEventListener('click', () => {
        const s = FB_STARTERS[+c.dataset.s];
        ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n' : '') + s;
        ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
        refresh();
      }));
      mail.addEventListener('click', (e) => { if (needText(e)) return; refresh(); setTimeout(thanks, 300); });
      box.querySelector('#' + p + 'Copy').addEventListener('click', (e) => { if (needText(e)) return; this.copyText(body(), 'Feedback copied', 'Paste it into an email, Teams or Slack to whoever shared the game.', box.querySelector('.copybox')); thanks(); });
    },
    // the Play again sheet: the same feedback block, then on to the next game
    askFeedback(next) {
      const body = el('<div class="fbsheet"><h3>Before your next go…</h3><p class="muted sm">You’ve just run a syndicate. What one thing would make the game better?</p>' +
        '<div class="fbpanel" id="paPanel">' + fbBlockHTML('pa', 'Your idea') + '<textarea class="copybox" readonly hidden aria-label="Your feedback"></textarea></div>' +
        '<div class="fbgo"><button class="btn" id="paGo">Skip and play again</button></div></div>');
      const o = overlay(body);
      const go2 = body.querySelector('#paGo');
      // keep the results panel in step with whatever was typed or sent here
      const sync = () => {
        const t = this.root && this.root.querySelector('#fbText'); if (!t) return;
        t.value = store.get('lsl-fb-draft', '') || ''; t.dispatchEvent(new Event('input'));
        if (this.fbSent) { const rp = this.root.querySelector('#fbPanel'); rp.classList.add('sent'); rp.querySelector('#fbNote').textContent = 'Thanks! That goes straight into the next version.'; }
      };
      const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } };
      const close = () => { o.remove(); removeEventListener('keydown', onKey); sync(); };
      this.wireFeedback(body.querySelector('#paPanel'), 'pa', () => { go2.textContent = 'Play again →'; go2.classList.add('primary'); });
      go2.addEventListener('click', () => { close(); next(); });
      addEventListener('keydown', onKey);
      o.addEventListener('click', (e) => { if (e.target === o) close(); });
      setTimeout(() => { const t = body.querySelector('#paText'); if (t && t.isConnected) t.focus({ preventScroll: true }); }, 60);
    },
    copyText(text, title, msg, boxEl) {
      const box = boxEl || this.root.querySelector('#copyBox');
      const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); toast('Select and copy', 'The text is highlighted below.', 'var(--crane)'); };
      try {
        navigator.clipboard.writeText(text).then(() => toast(title, msg, 'var(--good)'), fallback);
      } catch (e) { fallback(); }
    },
    copy() {
      const text = shareText(this.res, this.grade);
      const copyIt = () => this.copyText(text, 'Copied', 'Paste it into Teams and wait for the replies.');
      // phones (and some desktops) get the share sheet, with the link inside the text so apps don't show it twice;
      // a cancelled share does nothing, a failed one copies instead
      if (canShare()) navigator.share({ title: 'Lime Street Launch', text }).catch((e) => { if (!e || e.name !== 'AbortError') copyIt(); });
      else copyIt();
    }
  };

  // ---------- boot ----------
  let booted = false;
  function boot(data) {
    if (booted) return;
    booted = true;
    FX.init();
    newGame(data && data.no ? data : null);
    go('title');
    let last = performance.now();
    const loop = (ts) => {
      const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts;
      if (!paused && scene && scene.update) {
        try { scene.update(dt * SPEED); } catch (err) { console.error(err); }
      }
      FX.step(dt);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    LB.init();
  }
  window.__LSL = { get G() { return G; }, get scene() { return scene; }, go, E, LB };
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ no: G && G.no, name: G && G.name })); } catch (e) { /* hot reload unavailable */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
